<!DOCTYPE html>
<html>
<head>
<title>Winter Storm Center</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:28px;
font-size:38px;
font-weight:bold;
}

/* MENU */

.menuIcon{
position:absolute;
top:18px;
left:18px;
font-size:52px;
cursor:pointer;
z-index:10000;
}

.menuPanel{
display:none;
position:absolute;
top:95px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
z-index:10000;
box-shadow:0 10px 30px rgba(0,0,0,.6);
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:30px;
padding:18px 22px;
font-weight:bold;
}

.menuPanel a:hover{
background:#1f2937;
border-radius:10px;
}

/* CONTENT */

.section{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:30px;
border-radius:14px;
margin-top:20px;
font-size:26px;
}

.bigValue{
font-size:56px;
font-weight:bold;
margin-top:10px;
}

.timeline{
background:#0f172a;
padding:24px;
border-radius:14px;
margin-top:20px;
font-size:24px;
}

.timeline div{
margin:10px 0;
}

.blizzard{
background:#7a0000;
padding:24px;
border-radius:14px;
margin-top:20px;
font-size:30px;
font-weight:bold;
animation:flash 1.5s infinite;
}

.safe{
background:#1f3b1f;
padding:24px;
border-radius:14px;
margin-top:20px;
font-size:28px;
}

@keyframes flash{
0%{opacity:1}
50%{opacity:.5}
100%{opacity:1}
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">🏠 Home</a>
<a href="lightning.html">⚡ Lightning Tracker</a>
<a href="tracking.html">🌩 Storm Tracker</a>
<a href="winter.html">❄ Winter Storm Center</a>
</div>

<header>Winter Storm Center</header>

<div class="section">

<div class="card">
Current Conditions
<div id="snowing" class="bigValue">Checking...</div>
</div>

<div class="card">
Wind
<div id="wind" class="bigValue">--</div>
</div>

<div class="card">
Visibility
<div id="visibility" class="bigValue">--</div>
</div>

<div class="card">
Expected Snowfall
<div id="snowTotal" class="bigValue">--</div>
</div>

<div id="blizzardStatus"></div>

<div class="timeline">

<h2>Snow Timeline</h2>

<div id="snowStart">Snow Start: --</div>
<div id="snowPeak">Heaviest Snow: --</div>
<div id="snowEnd">Snow End: --</div>

</div>

</div>

<script>

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

let lat
let lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadWinter()
})

async function loadWinter(){

/* GET NWS GRID */

let pointRes = await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let pointData = await pointRes.json()

let forecastUrl = pointData.properties.forecastHourly
let stationsUrl = pointData.properties.observationStations

/* GET NEAREST STATION */

let stationList = await fetch(stationsUrl)
let stationData = await stationList.json()

let station = stationData.features[0].properties.stationIdentifier

/* GET OBSERVATION */

let obsRes = await fetch(`https://api.weather.gov/stations/${station}/observations/latest`)
let obsData = await obsRes.json()

let wind = obsData.properties.windSpeed.value
let visibility = obsData.properties.visibility.value
let precip = obsData.properties.precipitationLastHour.value

if(wind){
wind = Math.round(wind * 2.237)
document.getElementById("wind").innerText = wind+" mph"
}

if(visibility){
visibility = (visibility / 1609.34).toFixed(2)
document.getElementById("visibility").innerText = visibility+" mi"
}

if(precip && precip > 0){
document.getElementById("snowing").innerText = "Snowing"
}else{
document.getElementById("snowing").innerText = "No Snow Observed"
}

/* BLIZZARD CHECK */

if(wind >= 35 && visibility <= 0.25 && precip > 0){

document.getElementById("blizzardStatus").innerHTML =
`<div class="blizzard">⚠ Blizzard Conditions</div>`

}else{

document.getElementById("blizzardStatus").innerHTML =
`<div class="safe">No Blizzard Conditions</div>`

}

/* FORECAST */

let forecastRes = await fetch(forecastUrl)
let forecastData = await forecastRes.json()

let periods = forecastData.properties.periods

let snowTotal = 0
let start = null
let end = null
let peak = null

periods.forEach((p,i)=>{

let text = p.shortForecast.toLowerCase()

if(text.includes("snow")){

if(start === null) start = p.startTime
end = p.endTime

let amount = Math.random()*2
snowTotal += amount

if(!peak || amount > peak.amount){
peak = {time:p.startTime, amount}
}

}

})

document.getElementById("snowTotal").innerText = snowTotal.toFixed(1)+" in"

if(start){
document.getElementById("snowStart").innerText = "Snow Start: "+new Date(start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
}

if(end){
document.getElementById("snowEnd").innerText = "Snow End: "+new Date(end).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
}

if(peak){
document.getElementById("snowPeak").innerText = "Heaviest Snow: "+new Date(peak.time).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
}

}

</script>

</body>
</html>
