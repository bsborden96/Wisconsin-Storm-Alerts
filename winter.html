<!DOCTYPE html>
<html>
<head>
<title>Winter Storm Center</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:28px;
font-size:38px;
font-weight:bold;
}

/* MENU */

.menuIcon{
position:absolute;
top:18px;
left:18px;
font-size:52px;
cursor:pointer;
z-index:10000;
}

.menuPanel{
display:none;
position:absolute;
top:95px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
z-index:10000;
box-shadow:0 10px 30px rgba(0,0,0,.6);
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:30px;
padding:18px 22px;
font-weight:bold;
}

.menuPanel a:hover{
background:#1f2937;
border-radius:10px;
}

/* CONTENT */

.section{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:30px;
border-radius:14px;
margin-top:20px;
font-size:26px;
}

.bigValue{
font-size:56px;
font-weight:bold;
margin-top:10px;
}

.timeline{
background:#0f172a;
padding:24px;
border-radius:14px;
margin-top:20px;
font-size:24px;
}

.timeline div{
margin:10px 0;
}

.blizzard{
background:#7a0000;
padding:24px;
border-radius:14px;
margin-top:20px;
font-size:30px;
font-weight:bold;
animation:flash 1.5s infinite;
}

.safe{
background:#1f3b1f;
padding:24px;
border-radius:14px;
margin-top:20px;
font-size:28px;
}

@keyframes flash{
0%{opacity:1}
50%{opacity:.5}
100%{opacity:1}
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">🏠 Home</a>
<a href="lightning.html">⚡ Lightning Tracker</a>
<a href="tracking.html">🌩 Storm Tracker</a>
<a href="winter.html">❄ Winter Storm Center</a>
</div>

<header>Winter Storm Center</header>

<div class="section">

<div class="card">
Current Snowfall Rate
<div id="snowRate" class="bigValue">--</div>
</div>

<div class="card">
Wind Speed
<div id="wind" class="bigValue">--</div>
</div>

<div class="card">
Expected Snowfall (24h)
<div id="snowTotal" class="bigValue">--</div>
</div>

<div id="blizzardStatus"></div>

<div class="timeline">

<h2>Snow Timeline</h2>

<div id="snowStart">Snow Start: --</div>
<div id="snowPeak">Heaviest Snow: --</div>
<div id="snowEnd">Snow End: --</div>

</div>

</div>

<script>

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

let lat
let lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadWinterWeather()
})

async function loadWinterWeather(){

let res=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,precipitation,wind_speed_10m&hourly=snowfall,temperature_2m&temperature_unit=fahrenheit&wind_speed_unit=mph`
)

let data=await res.json()

let temp=data.current.temperature_2m
let precip=data.current.precipitation
let wind=data.current.wind_speed_10m

document.getElementById("wind").innerText=Math.round(wind)+" mph"

/* SNOW RATE DETECTION */

let hourlySnow=data.hourly.snowfall[0]

if(temp<=34 && (precip>0 || hourlySnow>0)){
document.getElementById("snowRate").innerText=hourlySnow.toFixed(2)+" in/hr"
}else{
document.getElementById("snowRate").innerText="No Snow"
}

/* BLIZZARD CHECK */

let box=document.getElementById("blizzardStatus")

if(wind>=35 && (precip>0 || hourlySnow>0) && temp<=34){

box.innerHTML=`<div class="blizzard">⚠ Blizzard Conditions Possible</div>`

}else{

box.innerHTML=`<div class="safe">No Blizzard Conditions</div>`

}

/* SNOW TOTAL + TIMELINE */

let snow=data.hourly.snowfall
let temps=data.hourly.temperature_2m
let times=data.hourly.time

let start=null
let end=null
let peak=0
let peakTime=null
let total=0

for(let i=0;i<24;i++){

if(temps[i]<=34 && snow[i]>0){

if(start===null) start=i

end=i
total+=snow[i]

if(snow[i]>peak){
peak=snow[i]
peakTime=i
}

}

}

document.getElementById("snowTotal").innerText=total.toFixed(1)+" in"

if(start!==null){

let startTime=new Date(times[start]).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})
let endTime=new Date(times[end]).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})
let peakT=new Date(times[peakTime]).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})

document.getElementById("snowStart").innerText="Snow Start: "+startTime
document.getElementById("snowPeak").innerText="Heaviest Snow: "+peakT
document.getElementById("snowEnd").innerText="Snow End: "+endTime

}else{

document.getElementById("snowStart").innerText="Snow Start: None expected"
document.getElementById("snowPeak").innerText=""
document.getElementById("snowEnd").innerText=""

}

}

</script>

</body>
</html>
