<!DOCTYPE html>
<html>
<head>
<title>Winter Storm Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:28px;
font-size:38px;
font-weight:bold;
}

/* MENU */

.menuIcon{
position:absolute;
top:18px;
left:18px;
font-size:52px;
cursor:pointer;
z-index:10000;
}

.menuPanel{
display:none;
position:absolute;
top:95px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
z-index:10000;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:28px;
padding:16px;
}

.menuPanel a:hover{
background:#1f2937;
border-radius:8px;
}

/* CONTENT */

.section{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:26px;
border-radius:14px;
margin-top:20px;
font-size:26px;
}

.big{
font-size:44px;
font-weight:bold;
margin-top:10px;
}

.timeline{
background:#0f172a;
padding:22px;
border-radius:14px;
margin-top:20px;
font-size:22px;
}

.timeline div{
margin:10px 0;
}

.safe{
background:#1f3b1f;
}

.warning{
background:#8a4b00;
}

.danger{
background:#7a0000;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Storm Center</a>
</div>

<header>Winter Storm Center</header>

<div class="section">

<div class="card">
Current Weather
<div id="weather" class="big">Loading...</div>
</div>

<div class="card">
Temperature
<div id="temp" class="big">--</div>
</div>

<div id="roadCard" class="card safe">
Road Conditions Near You
<div id="roads" class="big">Checking...</div>
</div>

<div class="timeline">

<h2>Snow Timeline</h2>

<div id="start">Checking forecast...</div>
<div id="peak"></div>
<div id="end"></div>

</div>

</div>

<script>

function toggleMenu(){
let p=document.getElementById("menuPanel")
p.style.display=(p.style.display==="block")?"none":"block"
}

let lat
let lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadWinter()
loadRoads()
})

async function loadWinter(){

let p=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let grid=await p.json()

let stations=grid.properties.observationStations
let forecast=grid.properties.forecastHourly

let s=await fetch(stations)
let stationData=await s.json()

let station=stationData.features[0].properties.stationIdentifier

let obs=await fetch(`https://api.weather.gov/stations/${station}/observations/latest`)
let data=await obs.json()

let weather=data.properties.textDescription
document.getElementById("weather").innerText=weather

let temp=data.properties.temperature.value

if(temp){
temp=(temp*9/5)+32
temp=Math.round(temp)
document.getElementById("temp").innerText=temp+"°F"
}

/* FORECAST TIMELINE */

let f=await fetch(forecast)
let fdata=await f.json()

let periods=fdata.properties.periods

let start=null
let end=null
let peak=null

periods.forEach(p=>{

let text=p.shortForecast.toLowerCase()

if(text.includes("snow")){

if(start===null) start=p.startTime
end=p.endTime

if(!peak) peak=p.startTime

}

})

if(start){
document.getElementById("start").innerText=
"Snow Start: "+new Date(start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
}

if(peak){
document.getElementById("peak").innerText=
"Heaviest Snow: "+new Date(peak).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
}

if(end){
document.getElementById("end").innerText=
"Snow End: "+new Date(end).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
}

}

/* ROAD CONDITIONS (Nationwide Incident Feed) */

async function loadRoads(){

try{

let res = await fetch("https://api.weather.gov/alerts/active")
let data = await res.json()

let hazard = false

data.features.forEach(a=>{

let e = a.properties.event.toLowerCase()

if(
e.includes("winter storm") ||
e.includes("blizzard") ||
e.includes("ice storm") ||
e.includes("snow squall")
){
hazard = true
}

})

let card=document.getElementById("roadCard")

if(hazard){

card.classList.remove("safe")
card.classList.add("danger")

document.getElementById("roads").innerText="Hazardous Travel Possible"

}else{

document.getElementById("roads").innerText="No hazardous travel reported"

}

}catch{

document.getElementById("roads").innerText="Road data unavailable"

}

}

</script>

</body>
</html>
