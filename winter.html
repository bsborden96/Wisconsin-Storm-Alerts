<!DOCTYPE html>
<html>
<head>
<title>Winter Storm Center</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:28px;
font-size:38px;
font-weight:bold;
}

/* MENU */

.menuIcon{
position:absolute;
top:18px;
left:18px;
font-size:52px;
cursor:pointer;
z-index:10000;
}

.menuPanel{
display:none;
position:absolute;
top:95px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
z-index:10000;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:28px;
padding:16px;
}

.menuPanel a:hover{
background:#1f2937;
border-radius:8px;
}

/* CONTENT */

.section{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:26px;
border-radius:14px;
margin-top:20px;
font-size:26px;
}

.big{
font-size:44px;
font-weight:bold;
margin-top:10px;
}

.timeline{
background:#0f172a;
padding:22px;
border-radius:14px;
margin-top:20px;
font-size:22px;
}

.timeline div{
margin:10px 0;
}

.roadSafe{background:#1f3b1f}
.roadWet{background:#005f8a}
.roadSnow{background:#8a4b00}
.roadDanger{background:#7a0000}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Storm Center</a>
</div>

<header>Winter Storm Center</header>

<div class="section">

<div class="card">
Current Weather
<div id="weather" class="big">Loading...</div>
</div>

<div class="card">
Temperature
<div id="temp" class="big">--</div>
</div>

<div class="card">
Wind
<div id="wind" class="big">--</div>
</div>

<div class="card">
Visibility
<div id="vis" class="big">--</div>
</div>

<div id="roadCard" class="card">
Road Conditions
<div id="roads" class="big">Checking...</div>
</div>

<div class="timeline">

<h2>Snow Timeline</h2>

<div id="start">Checking forecast...</div>
<div id="peak"></div>
<div id="end"></div>

</div>

</div>

<script>

function toggleMenu(){
let p=document.getElementById("menuPanel")
p.style.display=(p.style.display==="block")?"none":"block"
}

let lat
let lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadWinter()
})

async function loadWinter(){

let p=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let grid=await p.json()

let stations=grid.properties.observationStations
let forecast=grid.properties.forecastHourly

let s=await fetch(stations)
let stationData=await s.json()

let station=stationData.features[0].properties.stationIdentifier

let obs=await fetch(`https://api.weather.gov/stations/${station}/observations/latest`)
let data=await obs.json()

let weather=data.properties.textDescription
document.getElementById("weather").innerText=weather

/* TEMP */

let temp=data.properties.temperature.value
if(temp){
temp=(temp*9/5)+32
document.getElementById("temp").innerText=Math.round(temp)+"°F"
}

/* WIND */

let wind=data.properties.windSpeed.value
if(wind){
wind=Math.round(wind*2.237)
document.getElementById("wind").innerText=wind+" mph"
}

/* VISIBILITY */

let vis=data.properties.visibility.value
if(vis){
vis=(vis/1609.34).toFixed(2)
document.getElementById("vis").innerText=vis+" mi"
}

/* ROAD CONDITIONS */

let road="Dry Roads"
let roadClass="roadSafe"

if(weather.toLowerCase().includes("snow")){
road="Snow Covered Roads"
roadClass="roadSnow"
}

if(weather.toLowerCase().includes("snow") && vis<=0.5){
road="Hazardous Travel"
roadClass="roadDanger"
}

if(temp<=32 && weather.toLowerCase().includes("rain")){
road="Icy Roads"
roadClass="roadDanger"
}

let roadCard=document.getElementById("roadCard")
roadCard.classList.add(roadClass)

document.getElementById("roads").innerText=road

/* FORECAST TIMELINE */

let f=await fetch(forecast)
let fdata=await f.json()

let periods=fdata.properties.periods

let start=null
let end=null
let peak=null

periods.forEach(p=>{

let text=p.shortForecast.toLowerCase()

if(text.includes("snow")){

if(start===null) start=p.startTime
end=p.endTime

if(!peak) peak=p.startTime

}

})

if(start){
document.getElementById("start").innerText=
"Snow Start: "+new Date(start).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
}

if(peak){
document.getElementById("peak").innerText=
"Heaviest Snow: "+new Date(peak).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
}

if(end){
document.getElementById("end").innerText=
"Snow End: "+new Date(end).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})
}

}

</script>

</body>
</html>
