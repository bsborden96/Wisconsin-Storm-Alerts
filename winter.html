<!DOCTYPE html>
<html>
<head>
<title>Winter Storm Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:28px;
font-size:38px;
font-weight:bold;
}

.menuIcon{
position:absolute;
top:18px;
left:18px;
font-size:52px;
cursor:pointer;
z-index:10000;
}

.menuPanel{
display:none;
position:absolute;
top:95px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
z-index:10000;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:28px;
padding:16px;
}

.section{
max-width:900px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:26px;
border-radius:14px;
margin-top:20px;
font-size:26px;
}

.big{
font-size:44px;
font-weight:bold;
margin-top:10px;
}

.safe{background:#1f3b1f;}
.warning{background:#8a4b00;}
.danger{background:#7a0000;}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Storm Center</a>
</div>

<header>Winter Storm Center</header>

<div class="section">

<div class="card">
Current Weather
<div id="weather" class="big">Loading...</div>
</div>

<div class="card">
Temperature
<div id="temp" class="big">--</div>
</div>

<div class="card">
Snow Intensity
<div id="intensity" class="big">--</div>
</div>

<div class="card">
Estimated Snowfall
<div id="snowTotal" class="big">--</div>
</div>

<div class="card">
Storm Impact
<div id="impact" class="big">--</div>
</div>

<div id="roadCard" class="card safe">
Travel Risk
<div id="roads" class="big">Checking...</div>
</div>

</div>

<script>

function toggleMenu(){
let p=document.getElementById("menuPanel")
p.style.display=(p.style.display==="block")?"none":"block"
}

let lat, lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadWinter()
loadRoads()
})

function getDistance(lat1,lon1,lat2,lon2){
let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180
let a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))
}

async function loadWinter(){

let p=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let grid=await p.json()

let stations=await fetch(grid.properties.observationStations)
let stationData=await stations.json()

let closest=null
let minDist=999999

for(let s of stationData.features){
let sLat=s.geometry.coordinates[1]
let sLon=s.geometry.coordinates[0]

let d=getDistance(lat,lon,sLat,sLon)

if(d<minDist){
minDist=d
closest=s.properties.stationIdentifier
}
}

let obs=await fetch(`https://api.weather.gov/stations/${closest}/observations/latest`)
let data=await obs.json()

let weather=data.properties.textDescription.toLowerCase()
let tempC=data.properties.temperature.value

let isSnow = weather.includes("snow") || weather.includes("flurries")

/* WEATHER DISPLAY */

if(isSnow){
document.getElementById("weather").innerText="Snowing ❄"
}else{
document.getElementById("weather").innerText=data.properties.textDescription
}

/* TEMP */

if(tempC){
let tempF=(tempC*9/5)+32
document.getElementById("temp").innerText=Math.round(tempF)+"°F"
}

/* INTENSITY */

let intensity="None"

if(isSnow){

if(weather.includes("heavy")){
intensity="Heavy Snow"
}
else if(weather.includes("snow")){
intensity="Moderate Snow"
}
else{
intensity="Light Snow"
}

}

document.getElementById("intensity").innerText=intensity

/* SNOW TOTAL ESTIMATE (SMART LOGIC) */

let snowTotal="0\""

if(isSnow){

if(intensity==="Heavy Snow") snowTotal="4\" - 8\""
else if(intensity==="Moderate Snow") snowTotal="2\" - 5\""
else snowTotal="Dusting - 2\""

}

document.getElementById("snowTotal").innerText=snowTotal

/* IMPACT SCORE */

let impact="LOW"

if(intensity==="Heavy Snow") impact="HIGH"
else if(intensity==="Moderate Snow") impact="MODERATE"

document.getElementById("impact").innerText=impact

}

/* ROAD CONDITIONS */

async function loadRoads(){

let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let risk="LOW"
let card=document.getElementById("roadCard")

data.features.forEach(a=>{
let e=a.properties.event.toLowerCase()

if(e.includes("blizzard")){
risk="EXTREME"
card.className="card danger"
}
else if(e.includes("winter storm")){
risk="HIGH"
card.className="card danger"
}
else if(e.includes("snow") || e.includes("ice")){
if(risk!=="HIGH"){
risk="MODERATE"
card.className="card warning"
}
}
})

document.getElementById("roads").innerText=risk

}

</script>

</body>
</html>
