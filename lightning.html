<!DOCTYPE html>
<html>
<head>
<title>Lightning Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:24px;
padding-left:110px;
font-size:28px;
font-weight:bold;
}

/* MENU */

.menuIcon{
position:fixed;
top:16px;
left:18px;
font-size:46px;
cursor:pointer;
z-index:99999;
}

.menuPanel{
display:none;
position:fixed;
top:80px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
text-align:left;
z-index:99999;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:24px;
padding:12px;
font-weight:bold;
}

.menuPanel a:hover{
background:#1f2937;
border-radius:8px;
}

/* SEARCH */

.searchBox{
margin:20px auto;
max-width:600px;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:20px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
text-align:left;
border-radius:8px;
max-height:200px;
overflow-y:auto;
font-size:18px;
z-index:5000;
}

.suggestions div{
padding:10px;
cursor:pointer;
}

.suggestions div:hover{
background:#374151;
}

/* MAP FRAME */

.mapWrap{
margin:20px;
border-radius:10px;
overflow:hidden;
}

iframe{
width:100%;
height:520px;
border:none;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<header>Lightning Tracker</header>

<div class="searchBox">
<input id="searchInput" placeholder="Search any US city or town">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="mapWrap">
<iframe id="lightningMap"></iframe>
</div>

<script>

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

let lat=39
let lon=-95

/* LOAD MAP */

function loadMap(){

let url=`https://www.lightningmaps.org/?lang=en#m=oss;t=3;s=0;o=0;b=0.00;ts=0;lat=${lat};lon=${lon};z=7;`

document.getElementById("lightningMap").src=url

}

/* GET USER LOCATION */

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadMap()
})

/* SEARCH */

let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")

input.addEventListener("input",async()=>{

let q=input.value

if(q.length<2){
suggestions.innerHTML=""
return
}

let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=us&limit=8`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(place=>{

let div=document.createElement("div")
div.innerText=place.display_name

div.onclick=()=>{

lat=parseFloat(place.lat)
lon=parseFloat(place.lon)

input.value=place.display_name
suggestions.innerHTML=""

loadMap()

}

suggestions.appendChild(div)

})

})

loadMap()

</script>

</body>
</html>
