<!DOCTYPE html>
<html>
<head>
<title>Lightning Tracker</title>
<style>

body{margin:0;font-family:Arial;background:#0a0f1c;color:white;text-align:center;}
header{background:#151c2c;padding:30px;font-size:34px;font-weight:bold;}

nav{background:#0f1424;padding:16px;display:flex;justify-content:center;gap:30px;flex-wrap:wrap;}

nav a{color:white;text-decoration:none;font-size:20px;font-weight:bold;}

.dropdown{position:relative;}
.dropbtn{background:#0f1424;color:white;border:none;font-size:20px;padding:12px 16px;}

.dropdown-content{display:none;position:absolute;background:#1f2937;min-width:230px;border-radius:8px;}

.dropdown-content a{color:white;padding:18px;display:block;}

.section{max-width:800px;margin:auto;padding:30px;}

</style>
</head>

<body>

<header>Lightning Tracker</header>

<nav>

<a href="index.html">Home</a>

<div class="dropdown">
<button class="dropbtn" onclick="toggleMenu('toolsMenu')">Storm Tools ▼</button>
<div id="toolsMenu" class="dropdown-content">
<a href="tornado.html">Tornado Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="environment.html">Storm Environment</a>
<a href="lightning.html">Lightning Tracker</a>
</div>
</div>

<div class="dropdown">
<button class="dropbtn" onclick="toggleMenu('alertsMenu')">Alerts ▼</button>
<div id="alertsMenu" class="dropdown-content">
<a href="reports.html">Storm Reports</a>
<a href="severe.html">Severe Alerts</a>
</div>
</div>

</nav>

<div class="section">

<h2>Lightning Activity Near You</h2>

</div>

<script>

function toggleMenu(menuId){

let menu=document.getElementById(menuId)
let menus=document.querySelectorAll(".dropdown-content")

menus.forEach(m=>{
if(m.id!==menuId){m.style.display="none"}
})

menu.style.display=menu.style.display==="block"?"none":"block"

}

</script>

</body>
</html>
