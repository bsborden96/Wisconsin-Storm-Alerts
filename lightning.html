<!DOCTYPE html>
<html>
<head>
<title>Lightning Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:24px;
padding-left:110px;
font-size:28px;
font-weight:bold;
}

/* MENU */

.menuIcon{
position:absolute;
top:16px;
left:18px;
font-size:46px;
cursor:pointer;
}

.menuPanel{
display:none;
position:absolute;
top:80px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
text-align:left;
z-index:9999;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:24px;
padding:12px;
font-weight:bold;
}

/* SEARCH */

.searchBox{
margin:20px auto;
max-width:600px;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:20px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
text-align:left;
border-radius:8px;
max-height:200px;
overflow-y:auto;
font-size:18px;
}

.suggestions div{
padding:10px;
cursor:pointer;
}

/* MAP */

#map{
height:500px;
margin:20px;
border-radius:10px;
}

/* MESSAGE */

.card{
background:#111827;
padding:22px;
border-radius:12px;
margin:20px;
font-size:20px;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<header>Lightning Tracker</header>

<div class="searchBox">
<input id="searchInput" placeholder="Search any US city or town">
<div id="suggestions" class="suggestions"></div>
</div>

<div id="map"></div>

<div id="message"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

let lat
let lon

let map=L.map('map').setView([39,-95],5)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:18
}).addTo(map)

let stormLayer=L.layerGroup().addTo(map)

/* GET LOCATION */

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
map.setView([lat,lon],8)

L.marker([lat,lon]).addTo(map).bindPopup("Your Location")

loadLightning()

})

/* SEARCH */

let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")

input.addEventListener("input",async()=>{

let q=input.value

if(q.length<2){
suggestions.innerHTML=""
return
}

let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=us&limit=10`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(place=>{

let div=document.createElement("div")
div.innerText=place.display_name

div.onclick=()=>{

lat=parseFloat(place.lat)
lon=parseFloat(place.lon)

map.setView([lat,lon],8)

stormLayer.clearLayers()

L.marker([lat,lon]).addTo(map).bindPopup("Selected Location")

input.value=place.display_name
suggestions.innerHTML=""

loadLightning()

}

suggestions.appendChild(div)

})

})

/* DISTANCE */

function distance(lat1,lon1,lat2,lon2){

let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

let km=R*c

return km*0.621371

}

/* LOAD LIGHTNING STORMS */

async function loadLightning(){

stormLayer.clearLayers()

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let found=false

data.features.forEach(alert=>{

let event=alert.properties.event

if(!event.includes("Severe Thunderstorm Warning")) return

let geo=alert.geometry

if(!geo) return

let coord=geo.coordinates[0][0]

let sLat=coord[1]
let sLon=coord[0]

let miles=distance(lat,lon,sLat,sLon)

if(miles<200){

found=true

let polygon=L.polygon(
geo.coordinates[0].map(c=>[c[1],c[0]]),
{color:"orange"}
)

polygon.addTo(stormLayer)

polygon.bindPopup(
"<b>"+event+"</b><br>"+alert.properties.areaDesc+
"<br>"+Math.round(miles)+" miles away"
)

}

})

if(!found){

document.getElementById("message").innerHTML=
'<div class="card">No lightning producing storms near this location</div>'

}
else{

document.getElementById("message").innerHTML=""

}

}

setInterval(loadLightning,60000)

</script>

</body>
</html>
