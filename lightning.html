<!DOCTYPE html>
<html>
<head>
<title>Lightning Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:24px;
padding-left:110px;
font-size:28px;
font-weight:bold;
}

/* MENU */

.menuIcon{
position:fixed;
top:16px;
left:18px;
font-size:46px;
cursor:pointer;
z-index:9999;
}

.menuPanel{
display:none;
position:fixed;
top:80px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
text-align:left;
z-index:9999;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:24px;
padding:12px;
font-weight:bold;
}

.menuPanel a:hover{
background:#1f2937;
border-radius:8px;
}

/* MAP */

.mapWrap{
margin:20px;
border-radius:10px;
overflow:hidden;
}

iframe{
width:100%;
height:560px;
border:none;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<header>Lightning Tracker</header>

<div class="mapWrap">
<iframe id="blitzMap"></iframe>
</div>

<script>

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

let lat=39
let lon=-95

function loadMap(){

let url=`https://www.lightningmaps.org/?lang=en#m=oss;t=3;s=0;o=0;b=0.00;ts=0;lat=${lat};lon=${lon};z=6`

document.getElementById("blitzMap").src=url

}

/* AUTO LOCATION */

navigator.geolocation.getCurrentPosition(

pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadMap()
},

()=>{
loadMap()
}

)

</script>

</body>
</html>
