<!DOCTYPE html>
<html>
<head>
<title>Lightning Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:28px;
font-size:38px;
font-weight:bold;
}

#map{
height:75vh;
width:100%;
}

.info{
padding:20px;
font-size:22px;
}

</style>
</head>

<body>

<header>Lightning Tracker</header>

<div class="info">
Showing lightning strikes within 100 miles of your location
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map
let userLat
let userLon
let strikeMarkers=[]

navigator.geolocation.getCurrentPosition(position=>{

userLat=position.coords.latitude
userLon=position.coords.longitude

map=L.map("map").setView([userLat,userLon],7)

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
maxZoom:10
}).addTo(map)

L.marker([userLat,userLon]).addTo(map)
.bindPopup("Your Location")
.openPopup()

loadLightning()

})

function distance(lat1,lon1,lat2,lon2){

let R=6371

let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

let km=R*c

return km*0.621371

}

async function loadLightning(){

strikeMarkers.forEach(m=>map.removeLayer(m))
strikeMarkers=[]

try{

let response=await fetch("https://data.blitzortung.org/live_lightning.json")

let strikes=await response.json()

strikes.slice(0,300).forEach(strike=>{

let lat=strike[1]
let lon=strike[2]

let miles=distance(userLat,userLon,lat,lon)

if(miles<100){

let marker=L.circleMarker([lat,lon],{
radius:6,
color:"yellow",
fillColor:"yellow",
fillOpacity:0.9
}).addTo(map)

marker.bindPopup(
"⚡ Lightning Strike<br>"+Math.round(miles)+" miles away"
)

strikeMarkers.push(marker)

}

})

}catch(error){

console.log("Lightning data unavailable")

}

}

setInterval(loadLightning,30000)

</script>

</body>
</html>
