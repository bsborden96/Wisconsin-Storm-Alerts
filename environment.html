<!DOCTYPE html>
<html>
<head>
<title>Storm Environment</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:36px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:14px;
}

nav a{
color:white;
text-decoration:none;
margin:0 12px;
font-size:20px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.section{
max-width:700px;
margin:auto;
padding:30px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
}

.card{
background:#111827;
padding:25px;
border-radius:10px;
}

.label{
font-size:18px;
opacity:.8;
}

.value{
font-size:34px;
font-weight:bold;
margin-top:6px;
}

.risk{
margin-top:25px;
font-size:28px;
font-weight:bold;
}

</style>
</head>

<body>

<header>
Storm Environment
</header>

<nav>
<a href="index.html">Home</a>
<a href="tornado.html">Tornado Tracker</a>
<a href="environment.html">Storm Environment</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<div class="grid">

<div class="card">
<div class="label">Temperature</div>
<div id="temp" class="value">Loading...</div>
</div>

<div class="card">
<div class="label">Humidity</div>
<div id="humidity" class="value">Loading...</div>
</div>

<div class="card">
<div class="label">Wind Speed</div>
<div id="wind" class="value">Loading...</div>
</div>

<div class="card">
<div class="label">Pressure</div>
<div id="pressure" class="value">Loading...</div>
</div>

</div>

<div id="risk" class="risk">
Analyzing storm environment...
</div>

</div>

<script>

let lat
let lon

async function loadEnvironment(){

try{

let res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,pressure_msl&temperature_unit=fahrenheit`)

let data = await res.json()

let c = data.current

document.getElementById("temp").innerText = Math.round(c.temperature_2m) + "°F"
document.getElementById("humidity").innerText = c.relative_humidity_2m + "%"
document.getElementById("wind").innerText = Math.round(c.wind_speed_10m) + " mph"
document.getElementById("pressure").innerText = Math.round(c.pressure_msl) + " mb"

let risk = "LOW"

if(c.temperature_2m > 75 && c.relative_humidity_2m > 60 && c.wind_speed_10m > 20){
risk = "MODERATE"
}

if(c.temperature_2m > 80 && c.relative_humidity_2m > 65 && c.wind_speed_10m > 30){
risk = "HIGH"
}

document.getElementById("risk").innerText = "Storm Potential: " + risk

}catch{

document.getElementById("risk").innerText = "Unable to load environment data"

}

}

navigator.geolocation.getCurrentPosition(function(pos){

lat = pos.coords.latitude
lon = pos.coords.longitude

loadEnvironment()

})

</script>

</body>
</html>
