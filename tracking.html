<!DOCTYPE html>
<html>
<head>
<title>Storm Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* HEADER (STICKY) */
header{
background:transparent;
padding:10px 0;
position:sticky;
top:0;
z-index:10000;
}

.headerContent{
display:flex;
align-items:center;
justify-content:center;
width:100%;
}

.logo{
width:400px;
height:auto;
display:block;
margin:auto;
}

/* LOGO PULSE */
@keyframes logoPulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

.logo.alert{
animation:logoPulse 0.8s infinite;
}

/* MENU */
.menuIcon{
position:absolute;
top:250px;
left:18px;
font-size:60px;
cursor:pointer;
z-index:20001;
}

.menuPanel{
display:none;
position:absolute;
top:300px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
z-index:20001;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:26px;
padding:14px;
font-weight:bold;
}

/* SEARCH */
.searchBox{
margin:30px auto;
max-width:300px;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:22px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
text-align:left;
border-radius:8px;
max-height:220px;
overflow-y:auto;
font-size:20px;
z-index:9999;
}

.suggestions div{
padding:12px;
cursor:pointer;
}

/* LAYOUT */
.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:24px;
border-radius:12px;
margin-top:20px;
font-size:22px;
}

/* ALERT GLOW */
.tornado{
background:#7a0000;
padding:20px;
margin-top:18px;
border-radius:10px;
animation:glowRed 1s infinite alternate;
}

.severe{
background:#8a4b00;
padding:20px;
margin-top:18px;
border-radius:10px;
animation:glowOrange 1.5s infinite alternate;
}

@keyframes glowRed{
from{box-shadow:0 0 10px rgba(255,0,0,0.4);}
to{box-shadow:0 0 25px rgba(255,0,0,1);}
}

@keyframes glowOrange{
from{box-shadow:0 0 8px rgba(255,140,0,0.4);}
to{box-shadow:0 0 20px rgba(255,140,0,1);}
}

.distance{
font-size:28px;
font-weight:bold;
margin-top:6px;
}

.info{
margin-top:6px;
font-size:20px;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html" onclick="toggleMenu()">Home</a>
<a href="tracking.html" onclick="toggleMenu()">Storm Tracker</a>
<a href="winter.html" onclick="toggleMenu()">Winter Center</a>
</div>

<header>
<div class="headerContent">
<img src="logo.PNG" class="logo">
</div>
</header>

<div class="searchBox">
<input id="searchInput" placeholder="Search any US city or town">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="section">
<div id="storms"></div>
</div>

<script>

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

function updateLogoAlert(hasTornado){
let logo=document.querySelector(".logo")
if(!logo) return

if(hasTornado){
logo.classList.add("alert")
}else{
logo.classList.remove("alert")
}
}

let lat, lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadStorms()
})

/* SEARCH */
let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")

input.addEventListener("input",async()=>{

let q=input.value

if(q.length<2){
suggestions.innerHTML=""
return
}

let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=us&limit=10`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(place=>{

let div=document.createElement("div")
div.innerText=place.display_name

div.onclick=()=>{
lat=parseFloat(place.lat)
lon=parseFloat(place.lon)
input.value=place.display_name
suggestions.innerHTML=""
loadStorms()
}

suggestions.appendChild(div)

})

})

/* DISTANCE */
function distance(lat1,lon1,lat2,lon2){
let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))
return (R*c)*0.621371
}

/* LOAD STORMS */
async function loadStorms(){

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let html=""
let found=false
let tornadoActive=false

data.features.forEach(alert=>{

let event=alert.properties.event
if(!event.includes("Tornado") && !event.includes("Severe Thunderstorm")) return

if(event.includes("Tornado")) tornadoActive=true

let style=event.includes("Tornado")?"tornado":"severe"

html+=`
<div class="${style}">
<b>${event}</b>
${alert.properties.areaDesc}
</div>
`

found=true

})

if(!found){
html='<div class="card">No severe storms near this location</div>'
}

document.getElementById("storms").innerHTML=html

updateLogoAlert(tornadoActive)
}

setInterval(loadStorms,60000)

</script>

</body>
</html>
