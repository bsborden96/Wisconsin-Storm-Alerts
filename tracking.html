<!DOCTYPE html>
<html>
<head>
<title>Storm Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

#map{
height:100vh;
width:100%;
}

.topBar{
position:fixed;
top:10px;
left:10px;
z-index:9999;
background:#111827;
padding:10px 15px;
border-radius:10px;
}

.legend{
position:fixed;
bottom:10px;
left:10px;
background:#111827;
padding:10px;
border-radius:10px;
font-size:14px;
z-index:9999;
text-align:left;
}

a{
color:white;
text-decoration:none;
}
</style>
</head>

<body>

<div class="topBar">
<a href="index.html">⬅ Back</a>
</div>

<div id="map"></div>

<!-- LEGEND -->
<div class="legend">
🌪️ Tornado Warning = Red<br>
🟣 Tornado Watch = Purple<br>
⛈️ Severe Warning = Orange<br>
🟡 Severe Watch = Yellow<br>
🌊 Flood Warning = Cyan<br>
🚨 Emergency = Magenta
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* INIT MAP */
let map = L.map('map').setView([39,-95], 4)

/* DARK BASEMAP */
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
attribution:'© OpenStreetMap'
}).addTo(map)

/* 🌧️ RADAR OVERLAY (RainViewer) */
let radar = L.tileLayer(
"https://tilecache.rainviewer.com/v2/radar/latest/256/{z}/{x}/{y}/2/1_1.png",
{
opacity:0.6
}).addTo(map)

let alertLayer = L.layerGroup().addTo(map)

/* 📍 CENTER ON USER */
navigator.geolocation.getCurrentPosition(
pos=>{
map.setView([pos.coords.latitude, pos.coords.longitude], 7)
},
err=>{
console.log("Location blocked or unavailable")

/* fallback to Wisconsin */
map.setView([43.5,-88.5], 6)
},
{
enableHighAccuracy:true,
timeout:5000
}
)

/* LOAD ALERTS */
async function loadStorms(){

alertLayer.clearLayers()

let res = await fetch("https://api.weather.gov/alerts/active")
let data = await res.json()

data.features.forEach(alert=>{

let coords = alert.geometry
if(!coords) return

let type = alert.properties.event
let desc = alert.properties.headline || "No details"

/* 🎯 ADVANCED COLOR CODING */
let color = "#cccccc"

if(type.includes("Tornado Emergency")) color="#ff00ff"
else if(type.includes("Tornado Warning")) color="#ff0000"
else if(type.includes("Tornado Watch")) color="#8000ff"
else if(type.includes("Severe Thunderstorm Warning")) color="#ff8800"
else if(type.includes("Severe Thunderstorm Watch")) color="#ffd000"
else if(type.includes("Flash Flood Warning")) color="#00ffcc"

/* DRAW POLYGON */
function drawPoly(latlngs){

let poly = L.polygon(latlngs,{
color:color,
weight:2,
fillColor:color,
fillOpacity:0.25
}).addTo(alertLayer)

poly.bindPopup(`
<b>${type}</b><br><br>
${desc}<br><br>
<b>Areas:</b> ${alert.properties.areaDesc}
`)
}

/* POLYGON */
if(coords.type === "Polygon"){
let latlngs = coords.coordinates[0].map(c=>[c[1],c[0]])
drawPoly(latlngs)
}

/* MULTI */
if(coords.type === "MultiPolygon"){
coords.coordinates.forEach(polyCoords=>{
let latlngs = polyCoords[0].map(c=>[c[1],c[0]])
drawPoly(latlngs)
})
}

})

}

/* ⚡ FAST REFRESH */
loadStorms()
setInterval(loadStorms, 30000)

</script>

</body>
</html>
