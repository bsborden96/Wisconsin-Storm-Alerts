<!DOCTYPE html>
<html>
<head>
<title>Storm Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:28px;
font-size:38px;
font-weight:bold;
}

.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:24px;
border-radius:12px;
margin-top:20px;
font-size:22px;
}

.storm{
background:#8a4b00;
padding:18px;
margin-top:14px;
border-radius:10px;
}

.tornado{
background:#7a0000;
padding:18px;
margin-top:14px;
border-radius:10px;
}

.distance{
font-size:30px;
font-weight:bold;
}

.arrival{
margin-top:8px;
font-size:22px;
}

</style>
</head>

<body>

<header>Storm Tracker</header>

<div class="section">

<div class="card">
Tracking storms moving toward your location
</div>

<h2>Closest Approaching Storms</h2>

<div id="storms"></div>

</div>

<script>

let lat
let lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadStorms()
})

function distance(lat1,lon1,lat2,lon2){

let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

let km=R*c

return km*0.621371

}

function direction(lat1,lon1,lat2,lon2){

let dLon=(lon2-lon1)

let y=Math.sin(dLon*Math.PI/180)*Math.cos(lat2*Math.PI/180)

let x=
Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-
Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.cos(dLon*Math.PI/180)

let brng=Math.atan2(y,x)*180/Math.PI

let dirs=["N","NE","E","SE","S","SW","W","NW"]

return dirs[Math.round(brng/45)&7]

}

function extractSpeed(text){

let match=text.match(/moving\s+(\w+)\s+at\s+(\d+)/i)

if(match){
return parseInt(match[2])
}

return null

}

async function loadStorms(){

let res=await fetch("https://api.weather.gov/alerts/active")

let data=await res.json()

let html=""

data.features.forEach(alert=>{

let event=alert.properties.event

if(!event.includes("Severe Thunderstorm") && !event.includes("Tornado")) return

let geo=alert.geometry

if(!geo) return

let coord=geo.coordinates[0][0]

let sLat=coord[1]
let sLon=coord[0]

let miles=distance(lat,lon,sLat,sLon)

let dir=direction(sLat,sLon,lat,lon)

let speed=extractSpeed(alert.properties.description)

let arrival=""

if(speed){
let minutes=Math.round((miles/speed)*60)
arrival=`Arrival estimate: ${minutes} minutes`
}

let style="storm"

if(event.includes("Tornado")) style="tornado"

if(miles<400){

html+=`

<div class="${style}">

<b>${event}</b>

<div class="distance">
${Math.round(miles)} miles ${dir}
</div>

<div class="arrival">
${arrival}
</div>

${alert.properties.areaDesc}

</div>

`

}

})

if(html===""){
html='<div class="card">No storms moving toward your location</div>'
}

document.getElementById("storms").innerHTML=html

}

setInterval(loadStorms,60000)

</script>

</body>
</html>
