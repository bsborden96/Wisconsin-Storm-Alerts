<!DOCTYPE html>
<html>
<head>
<title>Storm Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

#map{
height:100vh;
width:100%;
}

.topBar{
position:fixed;
top:10px;
left:10px;
z-index:9999;
background:#111827;
padding:10px 15px;
border-radius:10px;
}

a{
color:white;
text-decoration:none;
}
</style>
</head>

<body>

<div class="topBar">
<a href="index.html">⬅ Back</a>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* INIT MAP */
let map = L.map('map').setView([39,-95], 4)

/* DARK MAP */
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
attribution:'© OpenStreetMap'
}).addTo(map)

let alertLayer = L.layerGroup().addTo(map)

/* LOAD ALERTS */
async function loadStorms(){

alertLayer.clearLayers()

let res = await fetch("https://api.weather.gov/alerts/active")
let data = await res.json()

data.features.forEach(alert=>{

let coords = alert.geometry

if(!coords) return

let type = alert.properties.event
let desc = alert.properties.headline || "No details"

/* COLOR BASED ON TYPE */
let color = "yellow"

if(type.includes("Tornado")) color = "red"
else if(type.includes("Severe")) color = "orange"

/* DRAW POLYGON */
if(coords.type === "Polygon"){
let latlngs = coords.coordinates[0].map(c=>[c[1],c[0]])

let poly = L.polygon(latlngs,{
color:color,
weight:2,
fillOpacity:0.2
}).addTo(alertLayer)

poly.bindPopup(`
<b>${type}</b><br><br>
${desc}
`)
}

/* MULTIPOLYGON */
if(coords.type === "MultiPolygon"){
coords.coordinates.forEach(polyCoords=>{
let latlngs = polyCoords[0].map(c=>[c[1],c[0]])

let poly = L.polygon(latlngs,{
color:color,
weight:2,
fillOpacity:0.2
}).addTo(alertLayer)

poly.bindPopup(`
<b>${type}</b><br><br>
${desc}
`)
})
}

})

}

/* AUTO REFRESH */
loadStorms()
setInterval(loadStorms, 60000)

</script>

</body>
</html>
