<!DOCTYPE html>
<html>
<head>
<title>Storm Threat Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

.logo{
width:260px;
margin:15px auto;
display:block;
filter: drop-shadow(0 0 15px rgba(0,255,150,0.6));
}

.menuIcon{
position:fixed;
top:15px;
left:15px;
font-size:40px;
z-index:9999;
cursor:pointer;
}

.menuPanel{
display:none;
position:fixed;
top:70px;
left:15px;
background:#111827;
padding:15px;
border-radius:10px;
z-index:9999;
}

.menuPanel a{
display:block;
padding:10px;
color:white;
text-decoration:none;
}

.card{
background:#111827;
margin:15px;
padding:20px;
border-radius:12px;
text-align:left;
}

.tornado{background:#7a0000;}
.severe{background:#8a4b00;}
.emergency{background:#ff00ff;color:black;}
</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<img src="logo.PNG" class="logo">

<h2>Incoming Storm Threats</h2>
<div id="storms">Scanning...</div>

<script>

/* MENU */
function toggleMenu(){
let m=document.getElementById("menuPanel")
m.style.display = m.style.display==="block"?"none":"block"
}

/* USER LOCATION */
let userLat=43, userLon=-88

navigator.geolocation.getCurrentPosition(p=>{
userLat=p.coords.latitude
userLon=p.coords.longitude
loadStorms()
},()=>loadStorms())

/* TRACKING STORAGE */
let stormHistory = {}
const MAX_HISTORY = 4

/* DISTANCE */
function distance(lat1, lon1, lat2, lon2){
let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180
let a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))
}

/* DIRECTION */
function getDirection(lat1, lon1, lat2, lon2){
let dLon=(lon2-lon1)*Math.PI/180
let y=Math.sin(dLon)*Math.cos(lat2*Math.PI/180)
let x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-
Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon)
let brng=Math.atan2(y,x)
return ((brng*180/Math.PI)+360)%360
}

/* LOAD STORMS */
async function loadStorms(){

let r=await fetch("https://api.weather.gov/alerts/active")
let d=await r.json()

let html=""

d.features.forEach(a=>{

let id=a.id
let type=a.properties.event

/* FILTER */
if(
!type.includes("Tornado Warning") &&
!type.includes("Severe Thunderstorm Warning") &&
!type.includes("Tornado Emergency")
){
return
}

let coords=a.geometry?.coordinates
if(!coords) return

/* CENTER */
let pts=coords[0]
let lat=0, lon=0

pts.forEach(p=>{
lat+=p[1]
lon+=p[0]
})

lat/=pts.length
lon/=pts.length

/* DISTANCE */
let dist=distance(userLat,userLon,lat,lon)
if(dist>160) return

/* TRACK HISTORY */
let now=Date.now()

if(!stormHistory[id]){
stormHistory[id]=[]
}

stormHistory[id].push({lat,lon,time:now})

if(stormHistory[id].length > MAX_HISTORY){
stormHistory[id].shift()
}

if(stormHistory[id].length < 2) return

let totalSpeed = 0
let totalDirX = 0
let totalDirY = 0
let count = 0

for(let i=1;i<stormHistory[id].length;i++){

let p1 = stormHistory[id][i-1]
let p2 = stormHistory[id][i]

let timeDiff = (p2.time - p1.time)/3600000
if(timeDiff <= 0) continue

let distMoved = distance(p1.lat,p1.lon,p2.lat,p2.lon)

let speedCalc = distMoved / timeDiff

if(speedCalc < 5 || speedCalc > 120) continue

let dir = getDirection(p1.lat,p1.lon,p2.lat,p2.lon)

let rad = dir * Math.PI/180
totalDirX += Math.cos(rad)
totalDirY += Math.sin(rad)

totalSpeed += speedCalc
count++
}

if(count === 0) return

let speed = totalSpeed / count
let stormDir = (Math.atan2(totalDirY, totalDirX)*180/Math.PI+360)%360

/* DIRECTION TO USER */
let dirToUser=getDirection(lat,lon,userLat,userLon)

/* ONLY INCOMING */
let diff=Math.abs(stormDir-dirToUser)
if(diff>90) return

/* ETA */
let eta=Math.round((dist/speed)*60)

/* STYLE */
let style="severe"
if(type.includes("Tornado Warning")) style="tornado"
if(type.includes("Tornado Emergency")) style="emergency"

/* CARD */
html+=`
<div class="card ${style}">
<b>${type}</b><br><br>

Distance: ${Math.round(dist)} km<br>
Direction: ${Math.round(stormDir)}°<br>
Speed: ${speed.toFixed(1)} mph<br>
Arrival: ${eta} min<br><br>

${a.properties.areaDesc}
</div>
`

})

storms.innerHTML=html||"No incoming storms nearby"
}

/* REFRESH */
setInterval(loadStorms,60000)

</script>

</body>
</html>
