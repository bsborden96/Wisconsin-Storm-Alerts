<!DOCTYPE html>
<html>
<head>
<title>Storm Threat Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

.logo{
width:260px;
margin:15px auto;
display:block;
transition:0.3s;
}

.flash{
animation:flash 1s infinite;
}

@keyframes flash{
0%{filter:drop-shadow(0 0 5px red);}
50%{filter:drop-shadow(0 0 25px red);}
100%{filter:drop-shadow(0 0 5px red);}
}

.menuIcon{
position:fixed;
top:15px;
left:15px;
font-size:40px;
z-index:9999;
cursor:pointer;
}

.menuPanel{
display:none;
position:fixed;
top:70px;
left:15px;
background:#111827;
padding:15px;
border-radius:10px;
z-index:9999;
}

.menuPanel a{
display:block;
padding:10px;
color:white;
text-decoration:none;
}

.searchBox{
margin:5px auto 15px auto;
width:100%;
max-width:500px;
display:flex;
justify-content:center;
position:relative;
}

.searchBox input{
width:100%;
max-width:500px;
padding:12px;
font-size:18px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
top:100%;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:200px;
overflow-y:auto;
text-align:left;
z-index:9999;
}

.card{
background:#111827;
margin:15px;
padding:20px;
border-radius:12px;
text-align:left;
}

.closest{
border:3px solid #00ffcc;
}

.tornado{background:#7a0000;}
.severe{background:#8a4b00;}
.emergency{background:#ff00ff;color:black;}

.location{
margin-top:10px;
font-size:18px;
}
</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<img src="logo.PNG" class="logo" id="logo">

<div class="searchBox">
<input id="searchInput" placeholder="Search US city">
<div id="suggestions" class="suggestions"></div>
</div>

<div id="locationText" class="location">Locating...</div>

<h2>Incoming Storm Threats</h2>
<div id="storms">Scanning...</div>

<script>

function toggleMenu(){
menuPanel.style.display = menuPanel.style.display==="block"?"none":"block"
}

let userLat=43, userLon=-88

async function setLocation(lat,lon){
userLat=lat
userLon=lon

let res=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let d=await res.json()

let city=d.properties.relativeLocation.properties.city
let state=d.properties.relativeLocation.properties.state

locationText.innerText=`${city}, ${state}`

loadStorms()
}

navigator.geolocation.getCurrentPosition(p=>{
setLocation(p.coords.latitude,p.coords.longitude)
},()=>loadStorms())

searchInput.addEventListener("input",async()=>{
let q=searchInput.value.trim()
if(q.length<2){suggestions.innerHTML="";return}

let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=us&limit=5`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(place=>{
let div=document.createElement("div")
div.innerText=place.display_name

div.onclick=()=>{
setLocation(parseFloat(place.lat),parseFloat(place.lon))
searchInput.value=place.display_name
suggestions.innerHTML=""
}

suggestions.appendChild(div)
})
})

let stormHistory={}
const MAX_HISTORY=4

function distance(lat1, lon1, lat2, lon2){
let R=3958.8
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180
let a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))
}

function getDirection(lat1, lon1, lat2, lon2){
let dLon=(lon2-lon1)*Math.PI/180
let y=Math.sin(dLon)*Math.cos(lat2*Math.PI/180)
let x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-
Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon)
let brng=Math.atan2(y,x)
return ((brng*180/Math.PI)+360)%360
}

function angleDiff(a,b){
let diff=Math.abs(a-b)%360
return diff>180?360-diff:diff
}

async function loadStorms(){

let r=await fetch("https://api.weather.gov/alerts/active")
let d=await r.json()

let html=""
let highest="none"
let closestDist=999999

d.features.forEach(a=>{

let id=a.id
let type=a.properties.event

if(
!type.includes("Tornado Warning") &&
!type.includes("Severe Thunderstorm Warning") &&
!type.includes("Tornado Emergency")
){
return
}

let coords=a.geometry?.coordinates
if(!coords) return

let pts=coords[0]
let lat=0, lon=0

pts.forEach(p=>{
lat+=p[1]
lon+=p[0]
})

lat/=pts.length
lon/=pts.length

let dist=distance(userLat,userLon,lat,lon)
if(dist>250) return

let now=Date.now()

if(!stormHistory[id]){
stormHistory[id]=[]
}

stormHistory[id].push({lat,lon,time:now})
if(stormHistory[id].length>MAX_HISTORY){
stormHistory[id].shift()
}

let speed=30
let stormDir=0

if(stormHistory[id].length>=2){

let totalSpeed=0, totalDirX=0, totalDirY=0, count=0

for(let i=1;i<stormHistory[id].length;i++){

let p1=stormHistory[id][i-1]
let p2=stormHistory[id][i]

let t=(p2.time-p1.time)/3600000
if(t<=0) continue

let dMoved=distance(p1.lat,p1.lon,p2.lat,p2.lon)
let sp=dMoved/t

if(sp<5||sp>120) continue

let dir=getDirection(p1.lat,p1.lon,p2.lat,p2.lon)

let rad=dir*Math.PI/180
totalDirX+=Math.cos(rad)
totalDirY+=Math.sin(rad)

totalSpeed+=sp
count++
}

if(count>0){
speed=totalSpeed/count
stormDir=(Math.atan2(totalDirY,totalDirX)*180/Math.PI+360)%360
}

}

let dirToUser=getDirection(lat,lon,userLat,userLon)

let movingToward = angleDiff(stormDir,dirToUser) < 70
let overUser = dist < 15

if(!movingToward && !overUser) return

let eta = speed>0 ? Math.round((dist/speed)*60) : "--"

let style="severe"
if(type.includes("Tornado Warning")) style="tornado"
if(type.includes("Tornado Emergency")) style="emergency"

let isClosest=false
if(dist<closestDist){
closestDist=dist
isClosest=true
}

if(type.includes("Tornado Emergency")) highest="emergency"
else if(type.includes("Tornado Warning") && highest!=="emergency") highest="tornado"
else if(highest==="none") highest="severe"

html+=`
<div class="card ${style} ${isClosest?"closest":""}">
${isClosest?"🚨 CLOSEST STORM<br><br>":""}
<b>${type}</b><br><br>

Distance: ${Math.round(dist)} miles<br>
Direction: ${Math.round(stormDir)}°<br>
Speed: ${speed.toFixed(1)} mph<br>
Arrival: ${overUser?"NOW":eta+" min"}<br><br>

${a.properties.areaDesc}
</div>
`

})

logo.classList.remove("flash")
if(highest==="tornado" || highest==="emergency"){
logo.classList.add("flash")
}

storms.innerHTML=html||"No incoming storms nearby"
}

setInterval(loadStorms,60000)

</script>

</body>
</html>
