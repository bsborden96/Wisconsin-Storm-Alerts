<!DOCTYPE html>
<html>
<head>
<title>Storm Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

#map{
height:100vh;
width:100%;
}

.topBar{
position:fixed;
top:10px;
left:10px;
z-index:9999;
background:#111827;
padding:10px 15px;
border-radius:10px;
}

.legend{
position:fixed;
bottom:10px;
left:10px;
background:#111827;
padding:10px;
border-radius:10px;
font-size:14px;
z-index:9999;
text-align:left;
}

.radarBtn{
position:fixed;
top:10px;
right:10px;
z-index:9999;
background:#111827;
padding:10px;
border-radius:10px;
cursor:pointer;
}

a{
color:white;
text-decoration:none;
}
</style>
</head>

<body>

<div class="topBar">
<a href="index.html">⬅ Back</a>
</div>

<div id="map"></div>

<div class="legend">
🌪️ Tornado Warning = Red<br>
🟣 Tornado Watch = Purple<br>
⛈️ Severe Warning = Orange<br>
🟡 Severe Watch = Yellow<br>
🌊 Flood Warning = Cyan<br>
🚨 Emergency = Magenta
</div>

<div class="radarBtn" onclick="toggleRadar()">📡 Radar</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* MAP */
let map = L.map('map',{maxZoom:18}).setView([39,-95],4)

/* DARK MAP (BETTER CONTRAST) */
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
maxZoom:19
}).addTo(map)

let alertLayer = L.layerGroup().addTo(map)

/* LOCATION */
navigator.geolocation.getCurrentPosition(
pos=>{
let lat=pos.coords.latitude
let lon=pos.coords.longitude

map.setView([lat,lon],8)

L.circleMarker([lat,lon],{
radius:6,
color:"#00ffcc"
}).addTo(map)
},
()=>{
map.setView([43.5,-88.5],6)
}
)

/* 🌧️ ANIMATED RADAR */
let radarFrames = []
let radarLayers = []
let frameIndex = 0

async function loadRadar(){

let res = await fetch("https://api.rainviewer.com/public/weather-maps.json")
let data = await res.json()

radarFrames = data.radar.past.slice(-6) // last 6 frames

radarLayers.forEach(l=>map.removeLayer(l))
radarLayers = []

radarFrames.forEach((frame,i)=>{

let layer = L.tileLayer(
`https://tilecache.rainviewer.com${frame.path}/256/{z}/{x}/{y}/2/1_1.png`,
{
opacity:0,
maxZoom:18
}
).addTo(map)

radarLayers.push(layer)

})

animateRadar()
}

function animateRadar(){

if(radarLayers.length===0) return

radarLayers.forEach(l=>l.setOpacity(0))

radarLayers[frameIndex].setOpacity(0.7)

frameIndex = (frameIndex+1)%radarLayers.length

setTimeout(animateRadar,500)
}

loadRadar()
setInterval(loadRadar,120000)

/* TOGGLE */
function toggleRadar(){
radarLayers.forEach(l=>{
if(map.hasLayer(l)){
map.removeLayer(l)
}else{
map.addLayer(l)
}
})
}

/* DIRECTION ARROW */
function addDirectionArrow(latlngs, direction){

let center = latlngs[Math.floor(latlngs.length/2)]

let dx = 0.3*Math.cos((direction-90)*Math.PI/180)
let dy = 0.3*Math.sin((direction-90)*Math.PI/180)

let end = [center[0]+dx, center[1]+dy]

L.polyline([center,end],{
color:"white",
weight:2
}).addTo(alertLayer)
}

/* ALERTS */
async function loadStorms(){

alertLayer.clearLayers()

let res = await fetch("https://api.weather.gov/alerts/active")
let data = await res.json()

data.features.forEach(alert=>{

let coords = alert.geometry
if(!coords) return

let type = alert.properties.event
let desc = alert.properties.headline || "No details"

/* COLORS (HIGH CONTRAST) */
let color="#cccccc"

if(type.includes("Tornado Emergency")) color="#ff00ff"
else if(type.includes("Tornado Warning")) color="#ff0000"
else if(type.includes("Tornado Watch")) color="#a855f7"
else if(type.includes("Severe Thunderstorm Warning")) color="#ff8800"
else if(type.includes("Severe Thunderstorm Watch")) color="#ffd000"
else if(type.includes("Flash Flood Warning")) color="#00ccff"

/* DRAW */
function drawPoly(latlngs){

L.polygon(latlngs,{
color:color,
weight:2,
fillColor:color,
fillOpacity:0.5
}).addTo(alertLayer)
.bindPopup(`<b>${type}</b><br><br>${desc}`)

/* simulated motion */
let direction = Math.random()*360
addDirectionArrow(latlngs, direction)

}

/* POLYGON */
if(coords.type==="Polygon"){
drawPoly(coords.coordinates[0].map(c=>[c[1],c[0]]))
}

/* MULTI */
if(coords.type==="MultiPolygon"){
coords.coordinates.forEach(p=>{
drawPoly(p[0].map(c=>[c[1],c[0]]))
})
}

})

}

/* REFRESH */
loadStorms()
setInterval(loadStorms,30000)

</script>

</body>
</html>
