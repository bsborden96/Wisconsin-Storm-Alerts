<!DOCTYPE html>
<html>
<head>
<title>Storm Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
overflow-x:hidden;
padding-top:0; /* 🔥 auto handled by JS */
}

/* HEADER (LOCKED) */
header{
position:fixed;
top:0;
left:0;
width:100%;
background:#0a0f1c;
z-index:10000;
padding:10px 0;
}

/* LOGO (UNCHANGED) */
.logo{
width:300px;
max-width:95vw;
margin:auto;
display:block;
filter: drop-shadow(0 0 15px rgba(0,255,150,0.6));
transition: all 0.3s ease;
}

/* LOGO ALERT */
@keyframes logoPulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

.logo.alert{
animation:logoPulse 0.8s infinite;
filter: drop-shadow(0 0 25px red);
}

/* MENU */
.menuIcon{
position:fixed;
top:20px;
left:15px;
font-size:50px;
z-index:20001;
cursor:pointer;
}

.menuPanel{
display:none;
position:fixed;
top:80px;
left:15px;
background:#111827;
padding:16px;
border-radius:14px;
z-index:20001;
}

.menuPanel a{
display:block;
padding:12px;
color:white;
text-decoration:none;
}

/* LOCATION BOX */
.locationBox{
background:#111827;
margin:10px auto;
padding:15px;
border-radius:10px;
max-width:400px;
font-size:18px;
}

/* SEARCH */
.searchBox{
margin:15px auto;
width:90%;
max-width:400px;
position:relative;
}

.searchBox input{
width:100%;
padding:12px;
font-size:18px;
border:none;
border-radius:8px;
box-sizing:border-box;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:220px;
overflow-y:auto;
text-align:left;
z-index:9999;
}

/* CONTENT */
.section{
padding:20px;
max-width:1000px;
margin:auto;
}

/* CARDS */
.card{
background:#111827;
padding:20px;
border-radius:12px;
margin-top:15px;
}

/* ALERT STYLES */
.tornado{
background:#7a0000;
padding:20px;
margin-top:15px;
border-radius:10px;
animation:glowRed 1s infinite alternate;
}

.severe{
background:#8a4b00;
padding:20px;
margin-top:15px;
border-radius:10px;
animation:glowOrange 1.5s infinite alternate;
}

@keyframes glowRed{
from{box-shadow:0 0 10px rgba(255,0,0,0.4);}
to{box-shadow:0 0 25px rgba(255,0,0,1);}
}

@keyframes glowOrange{
from{box-shadow:0 0 8px rgba(255,140,0,0.4);}
to{box-shadow:0 0 20px rgba(255,140,0,1);}
}

.distance{
font-size:22px;
font-weight:bold;
margin-top:6px;
}

.info{
margin-top:6px;
font-size:16px;
opacity:.9;
}

.impact{
margin-top:6px;
font-size:18px;
font-weight:bold;
color:#00ffcc;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<header>
<img src="logo.PNG" class="logo">
</header>

<!-- LOCATION -->
<div id="locationBox" class="locationBox">Detecting location...</div>

<!-- SEARCH -->
<div class="searchBox">
<input id="searchInput" placeholder="Search US city or town">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="section">
<div id="storms"></div>
</div>

<script>

/* 🔥 AUTO FIX HEADER OVERLAP */
function fixHeaderSpacing(){
let header=document.querySelector("header")
if(!header) return
document.body.style.paddingTop = header.offsetHeight + "px"
}
window.addEventListener("load", fixHeaderSpacing)
window.addEventListener("resize", fixHeaderSpacing)

/* MENU */
function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display = panel.style.display==="block"?"none":"block"
}

/* LOGO ALERT */
function updateLogoAlert(hasTornado){
let logo=document.querySelector(".logo")
if(hasTornado) logo.classList.add("alert")
else logo.classList.remove("alert")
}

/* GEO */
let lat, lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadLocation()
loadStorms()
})

/* LOCATION */
async function loadLocation(){
try{
let p=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let d=await p.json()

let city=d.properties.relativeLocation.properties.city
let state=d.properties.relativeLocation.properties.state

let countyRes=await fetch(d.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

locationBox.innerHTML=`<b>${county} County</b><br>${city}, ${state}`

}catch{
locationBox.innerText="Location unavailable"
}
}

/* SEARCH */
let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")

input.addEventListener("input",async()=>{
let q=input.value.trim()

if(q.length<2){
suggestions.innerHTML=""
return
}

let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=us&limit=8`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(place=>{
let div=document.createElement("div")
div.innerText=place.display_name

div.onclick=()=>{
lat=parseFloat(place.lat)
lon=parseFloat(place.lon)
input.value=place.display_name
suggestions.innerHTML=""
loadLocation()
loadStorms()
}

suggestions.appendChild(div)
})
})

/* DISTANCE */
function distance(lat1,lon1,lat2,lon2){
let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))
return (R*c)*0.621371
}

/* DIRECTION */
function getDirection(lat1, lon1, lat2, lon2){
let y=Math.sin((lon2-lon1)*Math.PI/180)*Math.cos(lat2*Math.PI/180)
let x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-
Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos((lon2-lon1)*Math.PI/180)

let brng=Math.atan2(y,x)*180/Math.PI
brng=(brng+360)%360

if(brng<22.5) return "N"
if(brng<67.5) return "NE"
if(brng<112.5) return "E"
if(brng<157.5) return "SE"
if(brng<202.5) return "S"
if(brng<247.5) return "SW"
if(brng<292.5) return "W"
if(brng<337.5) return "NW"
return "N"
}

/* HISTORY */
let stormHistory={}

/* LOAD STORMS */
async function loadStorms(){

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let storms=[]
let tornadoActive=false
let now=Date.now()

data.features.forEach(alert=>{

let event=alert.properties.event
let coords=alert.geometry?.coordinates

if(!coords) return
if(!event.includes("Tornado") && !event.includes("Severe Thunderstorm")) return

let id=alert.id

let center=coords[0][0]
let lat2=center[1]
let lon2=center[0]

let dist=distance(lat,lon,lat2,lon2)

if(!stormHistory[id]){
stormHistory[id]={lat:lat2,lon:lon2,time:now,dist:dist}
return
}

let prev=stormHistory[id]

let timeDiff=(now-prev.time)/3600000
if(timeDiff===0) return

let moveDist=distance(prev.lat,prev.lon,lat2,lon2)
let speed=moveDist/timeDiff
let dir=getDirection(prev.lat,prev.lon,lat2,lon2)

stormHistory[id]={lat:lat2,lon:lon2,time:now,dist:dist}

if(dist>prev.dist) return

if(event.includes("Tornado")) tornadoActive=true

let impact="Calculating..."
if(speed>5){
let minutes=Math.round((dist/speed)*60)
impact=`Impact in ~${minutes} min`
}

storms.push({
event,
area:alert.properties.areaDesc,
distance:dist,
speed:speed,
direction:dir,
impact:impact
})

})

storms.sort((a,b)=>a.distance-b.distance)

let html=""

storms.slice(0,6).forEach(s=>{
let style=s.event.includes("Tornado")?"tornado":"severe"

html+=`
<div class="${style}">
<b>${s.event}</b>
<div class="distance">${Math.round(s.distance)} miles away</div>
<div class="info">Moving ${s.direction} at ${Math.round(s.speed)} mph</div>
<div class="impact">${s.impact}</div>
<div class="info">${s.area}</div>
</div>
`
})

if(!html){
html='<div class="card">No storms moving toward your location</div>'
}

document.getElementById("storms").innerHTML=html

updateLogoAlert(tornadoActive)

}

setInterval(loadStorms,60000)

</script>

</body>
</html>
