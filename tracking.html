<html>
<head>
<title>Storm Arrival Predictor</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#7f1d1d;
padding:30px;

}

nav{

}

}

}

</head>

<body>

<header>
Storm Arrival Predictor
</header>

<nav>
<a href="index.html">Home</a>
<a href="tornado.html">Tornado Tracker</a>
<a href="tracking.html">Storm Arrival</a>

</nav>

<div class="section">

<div id="stormBox" class="card">
Checking nearby storms...
</div>

</div>

<script>

let lat
let lon

function distance(lat1,lon1,lat2,lon2){

const R=3958.8

const dLat=(lat2-lat1)*Math.PI/180
const dLon=(lon2-lon1)*Math.PI/180

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return R*c

}

function polygonCenter(coords){

let latSum=0
let lonSum=0

for(let i=0;i<coords.length;i++){
lonSum+=coords[i][0]
latSum+=coords[i][1]
}

return{
lat:latSum/coords.length,
lon:lonSum/coords.length
}

}

function getDirection(userLat,userLon,stormLat,stormLon){

let dLat=stormLat-userLat
let dLon=stormLon-userLon

let vertical=dLat>0?"N":"S"
let horizontal=dLon>0?"E":"W"

if(Math.abs(dLat)>Math.abs(dLon)){
return vertical
}else{
return horizontal
}

}

async function checkStorms(){

try{

let response=await fetch("https://api.weather.gov/alerts/active")
let data=await response.json()

let storms=[]

data.features.forEach(alert=>{

if(!alert.geometry || !alert.geometry.coordinates) return

if(
alert.properties.event.includes("Severe") ||
alert.properties.event.includes("Tornado")
){

let polygon=alert.geometry.coordinates[0]

let center=polygonCenter(polygon)

let dist=distance(lat,lon,center.lat,center.lon)

let speed=alert.properties.parameters?.stormMotionSpeed?.[0] || 40
let dir=alert.properties.parameters?.stormMotionDirection?.[0] || "Unknown"

let arrival=Math.round((dist/speed)*60)

let direction=getDirection(lat,lon,center.lat,center.lon)

storms.push({
event:alert.properties.event,
distance:dist,
direction:direction,
speed:speed,
dir:dir,
arrival:arrival
})

}

})

if(storms.length===0){

document.getElementById("stormBox").className="card safe"
document.getElementById("stormBox").innerText="No severe storms detected nearby."

return

}

storms.sort((a,b)=>a.distance-b.distance)

let html=""

storms.slice(0,5).forEach(storm=>{

html+=`
<div class="card warning">

<b>${storm.event}</b><br><br>

Storm detected ${Math.round(storm.distance)} miles ${storm.direction} of you<br><br>

Storm Motion: ${storm.dir}° at ${storm.speed} mph<br><br>

Estimated Arrival: ${storm.arrival} minutes

</div>
`

})

document.getElementById("stormBox").innerHTML=html

}catch{

document.getElementById("stormBox").innerText="Unable to load storm data."

}

}

navigator.geolocation.getCurrentPosition(pos=>{

lat=pos.coords.latitude
lon=pos.coords.longitude

checkStorms()

})

setInterval(checkStorms,60000)

</script>

</body>
</html>
