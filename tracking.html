<script>

let lat
let lon

function distance(lat1,lon1,lat2,lon2){

const R=3958.8

const dLat=(lat2-lat1)*Math.PI/180
const dLon=(lon2-lon1)*Math.PI/180

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return R*c

}

function polygonCenter(coords){

let latSum=0
let lonSum=0

coords.forEach(p=>{
lonSum+=p[0]
latSum+=p[1]
})

return{
lat:latSum/coords.length,
lon:lonSum/coords.length
}

}

function getRelativeDirection(userLat,userLon,stormLat,stormLon){

let dLat=stormLat-userLat
let dLon=stormLon-userLon

if(dLat>0&&dLon>0) return "NE"
if(dLat>0&&dLon<0) return "NW"
if(dLat<0&&dLon>0) return "SE"
if(dLat<0&&dLon<0) return "SW"

if(Math.abs(dLat)>Math.abs(dLon)){
return dLat>0?"N":"S"
}else{
return dLon>0?"E":"W"
}

}
