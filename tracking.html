<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
overflow-x:hidden;
}
.logo{
width:300px;
max-width:96vw;
margin:20px auto;
display:block;
transition: all 0.4s ease;
filter: drop-shadow(0 0 15px rgba(0,255,150,0.6));
}
.menuIcon{
position:fixed;
top:15px;
left:15px;
font-size:50px;
z-index:9999;
cursor:pointer;
}
.menuPanel{
display:none;
position:fixed;
top:80px;
left:15px;
background:#111827;
padding:15px;
border-radius:10px;
z-index:9999;
}
.menuPanel a{
display:block;
padding:10px;
color:white;
text-decoration:none;
}
.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#7a0000;
color:white;
padding:25px;
border-radius:12px;
width:85%;
max-width:400px;
z-index:99999;
display:none;
box-shadow:0 0 20px rgba(255,0,0,0.7);
text-align:left;
}
.popupClose{
position:absolute;
top:8px;
right:12px;
font-size:20px;
cursor:pointer;
}
.tickerWrap{
background:#7a0000;
overflow:hidden;
width:100%;
}
.tickerTrack{
display:inline-block;
white-space:nowrap;
animation:scroll 60s linear infinite;
min-width:100%;
}
@keyframes scroll{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}
.searchBox{
margin:10px auto;
width:92%;
max-width:500px;
position:relative;
}
.searchBox input{
width:100%;
padding:12px;
font-size:18px;
border-radius:8px;
border:none;
box-sizing:border-box;
}
.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:220px;
overflow-y:auto;
z-index:9999;
text-align:left;
}
.section{
padding:20px;
max-width:1000px;
margin:auto;
}
.locationCard{
background:#111827;
padding:20px;
border-radius:10px;
}
.riskBox{
margin-top:10px;
padding:15px;
border-radius:10px;
font-size:22px;
font-weight:bold;
}
.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}
.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}
.weatherCard{
background:#0f172a;
padding:15px;
border-radius:10px;
cursor:pointer;
transition:all 0.3s ease;
}
.weatherDetails{
margin-top:10px;
font-size:15px;
opacity:0;
max-height:0;
overflow:hidden;
transition:all 0.3s ease;
}
.weatherCard.active .weatherDetails{
opacity:1;
max-height:200px;
}
.tempCold{color:#4da6ff;}
.tempCool{color:#00ccff;}
.tempMild{color:#00ff99;}
.tempWarm{color:#ffcc00;}
.tempHot{color:#ff3300;}
.card{
margin-top:10px;
padding:15px;
border-radius:10px;
text-align:left;
}
</style>
</head>

<body>

<div id="popup" class="popup">
<div class="popupClose" id="popupClose">✖</div>
<div id="popupText"></div>
</div>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<img src="logo.PNG" class="logo" id="logo">

<div class="tickerWrap">
<div id="tickerContent" class="tickerTrack">Loading alerts...</div>
</div>

<div class="searchBox">
<input id="searchInput" placeholder="Search US city">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="section">
<div id="locationCard" class="locationCard">Loading location...</div>
<div id="riskLevel" class="riskBox low">Severe Weather Risk: LOW</div>
</div>

<div class="section">
<h2>Current Conditions</h2>

<div class="weatherGrid">
<div class="weatherCard" onclick="toggleCard(this)">
Temp<div id="temp">--</div>
<div class="weatherDetails">
Feels Like: <span id="feels">--</span><br>
Pressure: <span id="pressure">--</span>
</div>
</div>

<div class="weatherCard" onclick="toggleCard(this)">
Humidity<div id="humidity">--</div>
<div class="weatherDetails">
Moisture Level: <span id="moistureLevel">--</span><br>
Air Feel: <span id="humidityFeel">--</span>
</div>
</div>

<div class="weatherCard" onclick="toggleCard(this)">
Dew<div id="dew">--</div>
<div class="weatherDetails">
Storm Fuel: <span id="stormFuel">--</span>
</div>
</div>

<div class="weatherCard" onclick="toggleCard(this)">
Wind<div id="wind">--</div>
<div class="weatherDetails">
Direction: <span id="windDir">--</span><br>
Gusts: <span id="gusts">--</span>
</div>
</div>
</div>
</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>
let locationCard = document.getElementById("locationCard")
let temp = document.getElementById("temp")
let humidity = document.getElementById("humidity")
let dew = document.getElementById("dew")
let wind = document.getElementById("wind")
let feels = document.getElementById("feels")
let pressure = document.getElementById("pressure")
let moistureLevel = document.getElementById("moistureLevel")
let humidityFeel = document.getElementById("humidityFeel")
let stormFuel = document.getElementById("stormFuel")
let gusts = document.getElementById("gusts")
let windDir = document.getElementById("windDir")

let alerts = document.getElementById("alerts")
let riskLevel = document.getElementById("riskLevel")

function toggleCard(card){
document.querySelectorAll(".weatherCard").forEach(c=>{
if(c!==card) c.classList.remove("active")
})
card.classList.toggle("active")
}

function toggleMenu(){
let m=document.getElementById("menuPanel")
m.style.display = m.style.display==="block"?"none":"block"
}

function showPopup(type){
let p=document.getElementById("popup")
let text=document.getElementById("popupText")

if(type.includes("Tornado")){
text.innerText=`🌪️ ${type}\n\nTAKE COVER NOW`
}else{
text.innerText=`⛈️ ${type}\n\nSEEK SHELTER`
}

p.style.display="block"
}

document.getElementById("popupClose").onclick=()=>{
document.getElementById("popup").style.display="none"
}

/* GEO */
let lat=43, lon=-88

navigator.geolocation.getCurrentPosition(p=>{
lat=p.coords.latitude
lon=p.coords.longitude
loadAll()
},()=>loadAll())

function loadAll(){
loadLocation()
loadWeather()
loadAlerts()
loadTicker()
}

/* LOCATION */
async function loadLocation(){
try{
let p = await fetch(`https://api.weather.gov/points/${lat},${lon}`, {
headers: {"User-Agent": "USStormAlertsApp"}
})
if(!p.ok) throw new Error()

let d = await p.json()

let city=d.properties?.relativeLocation?.properties?.city || "Unknown"
let state=d.properties?.relativeLocation?.properties?.state || ""

let countyRes=await fetch(d.properties.county)
let countyData=await countyRes.json()

locationCard.innerHTML=`<b>${countyData.properties.name} County</b><br>${city}, ${state}`
}catch{
locationCard.innerText="Location unavailable"
}
}

/* WEATHER */
async function loadWeather(){
try{
let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m,surface_pressure,wind_direction_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let d=await r.json()

let c=d.current

let t=Math.round(c.temperature_2m)
let dewV=Math.round(c.dewpoint_2m)
let hum=c.relative_humidity_2m
let windV=Math.round(c.wind_speed_10m)
let pressureVal=Math.round(c.surface_pressure)
let windDirVal=c.wind_direction_10m

temp.innerText=t+"°F"
dew.innerText=dewV+"°F"
humidity.innerText=hum+"%"
wind.innerText=windV+" mph"
feels.innerText=t+"°F"

pressure.innerText=pressureVal+" mb"
moistureLevel.innerText=hum>70?"Very Moist":"Normal"
humidityFeel.innerText=hum>60?"Muggy":"Comfortable"
stormFuel.innerText=dewV>65?"High":"Low"
gusts.innerText=(windV+5)+" mph"

let dir="N"
if(windDirVal>45 && windDirVal<=135) dir="E"
else if(windDirVal>135 && windDirVal<=225) dir="S"
else if(windDirVal>225 && windDirVal<=315) dir="W"

windDir.innerText=dir
}catch{}
}

/* ALERTS */
async function loadAlerts(){
try{
let r = await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`, {
headers: {"User-Agent": "USStormAlertsApp"}
})

if(!r.ok){
alerts.innerText="Alert data unavailable"
return
}

let d=await r.json()

let html=""
let risk="low"

(d.features || []).forEach(a=>{
let e=a.properties?.event || ""
let desc=a.properties?.description || ""

if(e.includes("Tornado")) risk="high"
else if(e.includes("Severe") && risk!=="high") risk="medium"

html+=`<div class="card"><b>${e}</b><br>${desc}</div>`
})

alerts.innerHTML=html||"No alerts"

riskLevel.className="riskBox "+(risk==="high"?"high":risk==="medium"?"medium":"low")
riskLevel.innerText="Severe Weather Risk: "+risk.toUpperCase()

}catch{
alerts.innerText="Alert data unavailable"
}
}

/* TICKER */
async function loadTicker(){
try{
let t=document.getElementById("tickerContent")

let res = await fetch("https://api.weather.gov/alerts/active", {
headers: {"User-Agent": "USStormAlertsApp"}
})

if(!res.ok){
t.innerText="Alert feed unavailable"
return
}

let d = await res.json()

let arr=[]
;(d.features || []).forEach(a=>{
let e=a.properties?.event || ""
if(e.includes("Tornado")||e.includes("Severe")){
arr.push(e)
}
})

t.innerText=[...new Set(arr)].join(" • ")||"No major alerts"
}catch{}
}
</script>

</body>
</html>
