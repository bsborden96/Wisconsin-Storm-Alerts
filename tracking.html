<!DOCTYPE html>
<html>
<head>
<title>Storm Arrival Predictor</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#7f1d1d;
padding:30px;
font-size:36px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:14px;
}

nav a{
color:white;
text-decoration:none;
margin:0 12px;
font-size:20px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.section{
max-width:700px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:30px;
border-radius:12px;
font-size:22px;
}

.warning{
background:#7a0000;
}

.safe{
background:#1f3b1f;
}

</style>
</head>

<body>

<header>
Storm Arrival Predictor
</header>

<nav>
<a href="index.html">Home</a>
<a href="tornado.html">Tornado Tracker</a>
<a href="tracking.html">Storm Arrival</a>
<a href="environment.html">Storm Environment</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<div id="stormBox" class="card">
Checking nearby storms...
</div>

</div>

<script>

let lat
let lon

function distance(lat1,lon1,lat2,lon2){

const R=3958.8

const dLat=(lat2-lat1)*Math.PI/180
const dLon=(lon2-lon1)*Math.PI/180

const a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return R*c

}

function centerOfPolygon(coords){

let latSum=0
let lonSum=0

coords.forEach(p=>{
lonSum+=p[0]
latSum+=p[1]
})

return {
lat:latSum/coords.length,
lon:lonSum/coords.length
}

}

function directionFromUser(userLat,userLon,stormLat,stormLon){

let dLat=stormLat-userLat
let dLon=stormLon-userLon

if(Math.abs(dLat)>Math.abs(dLon)){
return dLat>0?"N":"S"
}else{
return dLon>0?"E":"W"
}

}

async function checkStorm(){

try{

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let storms=data.features.filter(a=>
a.properties.event.includes("Severe") ||
a.properties.event.includes("Tornado")
)

if(storms.length===0){

document.getElementById("stormBox").className="card safe"

document.getElementById("stormBox").innerText=
"No severe storms detected nearby."

return

}

let storm=storms[0]

let polygon=storm.geometry.coordinates[0]

let center=centerOfPolygon(polygon)

let dist=distance(lat,lon,center.lat,center.lon)

let speed=storm.properties.parameters?.stormMotionSpeed?.[0] || 40
let dir=storm.properties.parameters?.stormMotionDirection?.[0] || "Unknown"

let arrival=Math.round((dist/speed)*60)

let direction=directionFromUser(lat,lon,center.lat,center.lon)

document.getElementById("stormBox").className="card warning"

document.getElementById("stormBox").innerHTML=`

<h2>${storm.properties.event}</h2>

Storm detected ${Math.round(dist)} miles ${direction} of you<br><br>

Storm Motion: ${dir}° at ${speed} mph<br><br>

Estimated Arrival: ${arrival} minutes

`

}catch{

document.getElementById("stormBox").innerText=
"Unable to load storm data."

}

}

navigator.geolocation.getCurrentPosition(pos=>{

lat=pos.coords.latitude
lon=pos.coords.longitude

checkStorm()

})

setInterval(checkStorm,60000)

</script>

</body>
</html>
