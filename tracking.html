<!DOCTYPE html>
<html>
<head>
<title>Storm Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* HEADER */

header{
background:#151c2c;
padding:24px;
padding-left:110px;
font-size:30px;
font-weight:bold;
}

/* MENU */

.menuIcon{
position:absolute;
top:16px;
left:18px;
font-size:48px;
cursor:pointer;
z-index:10000;
}

.menuPanel{
display:none;
position:absolute;
top:80px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
text-align:left;
z-index:10000;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:26px;
padding:14px;
font-weight:bold;
}

/* SEARCH */

.searchBox{
margin:30px auto;
max-width:600px;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:22px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
text-align:left;
border-radius:8px;
max-height:220px;
overflow-y:auto;
font-size:20px;
}

.suggestions div{
padding:12px;
cursor:pointer;
}

.suggestions div:hover{
background:#374151;
}

/* CONTENT */

.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:24px;
border-radius:12px;
margin-top:20px;
font-size:22px;
}

.tornado{
background:#7a0000;
padding:18px;
margin-top:14px;
border-radius:10px;
}

.severe{
background:#8a4b00;
padding:18px;
margin-top:14px;
border-radius:10px;
}

.distance{
font-size:28px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<header>Storm Tracker</header>

<div class="searchBox">
<input id="searchInput" placeholder="Search any US city or town">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="section">

<div id="storms"></div>

</div>

<script>

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

let lat
let lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadStorms()
})

/* SEARCH */

let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")

input.addEventListener("input",async()=>{

let q=input.value

if(q.length<2){
suggestions.innerHTML=""
return
}

let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=us&limit=10`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(place=>{

let div=document.createElement("div")
div.innerText=place.display_name

div.onclick=()=>{
lat=parseFloat(place.lat)
lon=parseFloat(place.lon)
input.value=place.display_name
suggestions.innerHTML=""
loadStorms()
}

suggestions.appendChild(div)

})

})

/* DISTANCE CALCULATION */

function distance(lat1,lon1,lat2,lon2){

let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

let km=R*c

return km*0.621371

}

/* LOAD STORMS */

async function loadStorms(){

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let html=""
let foundStorm=false

data.features.forEach(alert=>{

let event=alert.properties.event

if(!event.includes("Tornado Warning") && !event.includes("Severe Thunderstorm Warning")) return

let geo=alert.geometry
if(!geo) return

let coord=geo.coordinates[0][0]

let sLat=coord[1]
let sLon=coord[0]

let miles=distance(lat,lon,sLat,sLon)

if(miles<250){

foundStorm=true

let style="severe"
if(event.includes("Tornado")) style="tornado"

html+=`

<div class="${style}">

<b>${event}</b>

<div class="distance">
${Math.round(miles)} miles away
</div>

${alert.properties.areaDesc}

</div>

`

}

})

if(!foundStorm){
html='<div class="card">No severe storms near this location</div>'
}

document.getElementById("storms").innerHTML=html

}

setInterval(loadStorms,60000)

</script>

</body>
</html>
