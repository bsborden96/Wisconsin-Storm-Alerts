<!DOCTYPE html>
<html>
<head>
<title>Storm Tracker</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:24px;
padding-left:110px;
font-size:30px;
font-weight:bold;
}

.menuIcon{
position:absolute;
top:16px;
left:18px;
font-size:48px;
cursor:pointer;
}

.menuPanel{
display:none;
position:absolute;
top:80px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
text-align:left;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:26px;
padding:14px;
font-weight:bold;
}

.searchBox{
margin:30px auto;
max-width:600px;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:22px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
text-align:left;
border-radius:8px;
max-height:220px;
overflow-y:auto;
font-size:20px;
}

.suggestions div{
padding:12px;
cursor:pointer;
}

.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:24px;
border-radius:12px;
margin-top:20px;
font-size:22px;
}

.tornado{
background:#7a0000;
padding:20px;
margin-top:18px;
border-radius:10px;
}

.severe{
background:#8a4b00;
padding:20px;
margin-top:18px;
border-radius:10px;
}

.distance{
font-size:28px;
font-weight:bold;
margin-top:6px;
}

.info{
margin-top:6px;
font-size:20px;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<header>Storm Tracker</header>

<div class="searchBox">
<input id="searchInput" placeholder="Search any US city or town">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="section">
<div id="storms"></div>
</div>

<script>

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

let lat
let lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadStorms()
})

/* SEARCH */

let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")

input.addEventListener("input",async()=>{

let q=input.value

if(q.length<2){
suggestions.innerHTML=""
return
}

let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&countrycodes=us&limit=10`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(place=>{

let div=document.createElement("div")
div.innerText=place.display_name

div.onclick=()=>{
lat=parseFloat(place.lat)
lon=parseFloat(place.lon)
input.value=place.display_name
suggestions.innerHTML=""
loadStorms()
}

suggestions.appendChild(div)

})

})

/* DISTANCE */

function distance(lat1,lon1,lat2,lon2){

let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

let km=R*c

return km*0.621371

}

/* DIRECTION */

function direction(lat1,lon1,lat2,lon2){

let dLon=(lon2-lon1)

let y=Math.sin(dLon*Math.PI/180)*Math.cos(lat2*Math.PI/180)

let x=
Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-
Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.cos(dLon*Math.PI/180)

let brng=Math.atan2(y,x)*180/Math.PI

let dirs=["N","NE","E","SE","S","SW","W","NW"]

return dirs[Math.round(brng/45)&7]

}

/* MOVEMENT */

function getMovement(text){

let match=text.match(/moving\s+([a-zA-Z]+)\s+at\s+(\d+)/i)

if(match){
return {dir:match[1].toUpperCase(),speed:parseInt(match[2])}
}

return null

}

function isHeadingToward(stormDir,targetDir){

let dirs=["N","NE","E","SE","S","SW","W","NW"]

let stormIndex=dirs.indexOf(stormDir)
let targetIndex=dirs.indexOf(targetDir)

if(stormIndex==-1 || targetIndex==-1) return true

let diff=Math.abs(stormIndex-targetIndex)

return diff<=2

}

/* WIND + HAIL */

function getWind(text){
let match=text.match(/(\d+)\s?mph/i)
if(match){return match[1]+" mph"}
return "Unknown"
}

function getHail(text){
let match=text.match(/(\d+(\.\d+)?)\s?inch/i)
if(match){return match[1]+" in"}
return "Unknown"
}

/* LOAD STORMS */

async function loadStorms(){

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let storms=[]
let html=""
let found=false

data.features.forEach(alert=>{

let event=alert.properties.event

if(!event.includes("Tornado") && !event.includes("Severe Thunderstorm")) return

storms.push(alert)

})

storms.sort((a,b)=>{

let ea=a.properties.event
let eb=b.properties.event

if(ea.includes("Emergency")) return -1
if(eb.includes("Emergency")) return 1

if(ea.includes("Tornado") && !eb.includes("Tornado")) return -1
if(eb.includes("Tornado") && !ea.includes("Tornado")) return 1

return 0

})

storms.forEach(alert=>{

let geo=alert.geometry
if(!geo) return

let coord=geo.coordinates[0][0]

let sLat=coord[1]
let sLon=coord[0]

let miles=distance(lat,lon,sLat,sLon)

let dir=direction(sLat,sLon,lat,lon)

let desc=alert.properties.description

let movement=getMovement(desc)

let headingToward=true
let arrival=""

if(movement){

headingToward=isHeadingToward(movement.dir,dir)

let minutes=Math.round((miles/movement.speed)*60)

arrival="Arrival: ~"+minutes+" minutes"

}

if(miles<250 && headingToward){

found=true

let style="severe"
if(alert.properties.event.includes("Tornado")) style="tornado"

html+=`

<div class="${style}">

<b>${alert.properties.event}</b>

<div class="distance">
${Math.round(miles)} miles ${dir}
</div>

<div class="info">${arrival}</div>
<div class="info">Wind: ${getWind(desc)}</div>
<div class="info">Hail: ${getHail(desc)}</div>

${alert.properties.areaDesc}

</div>

`

}

})

if(!found){
html='<div class="card">No severe storms near this location</div>'
}

document.getElementById("storms").innerHTML=html

}

setInterval(loadStorms,60000)

</script>

</body>
</html>
