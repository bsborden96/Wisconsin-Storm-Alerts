<!DOCTYPE html>
<html>
<head>
<title>Storm Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
overflow-x:hidden;
}

/* 🔥 LOGO (NORMAL FLOW) */
.logo{
width:300px;
max-width:95vw;
margin:20px auto;
display:block;
filter: drop-shadow(0 0 15px rgba(0,255,150,0.6));
transition: all 0.3s ease;
}

/* LOGO ALERT */
@keyframes logoPulse{
0%{transform:scale(1);}
50%{transform:scale(1.1);}
100%{transform:scale(1);}
}

.logo.alert{
animation:logoPulse 0.8s infinite;
filter: drop-shadow(0 0 25px red);
}

/* MENU */
.menuIcon{
position:fixed;
top:20px;
left:15px;
font-size:50px;
z-index:20001;
cursor:pointer;
}

.menuPanel{
display:none;
position:fixed;
top:80px;
left:15px;
background:#111827;
padding:16px;
border-radius:14px;
z-index:20001;
}

.menuPanel a{
display:block;
padding:12px;
color:white;
text-decoration:none;
}

/* LOCATION */
.locationBox{
background:#111827;
margin:10px auto;
padding:15px;
border-radius:10px;
max-width:400px;
font-size:18px;
}

/* SEARCH */
.searchBox{
margin:15px auto;
width:90%;
max-width:400px;
position:relative;
}

.searchBox input{
width:100%;
padding:12px;
font-size:18px;
border:none;
border-radius:8px;
box-sizing:border-box;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:220px;
overflow-y:auto;
text-align:left;
z-index:9999;
}

/* CONTENT */
.section{
padding:20px;
max-width:1000px;
margin:auto;
}

/* CARDS */
.card{
background:#111827;
padding:20px;
border-radius:12px;
margin-top:15px;
}

/* ALERT STYLES */
.tornado{
background:#7a0000;
padding:20px;
margin-top:15px;
border-radius:10px;
animation:glowRed 1s infinite alternate;
}

.severe{
background:#8a4b00;
padding:20px;
margin-top:15px;
border-radius:10px;
animation:glowOrange 1.5s infinite alternate;
}

@keyframes glowRed{
from{box-shadow:0 0 10px rgba(255,0,0,0.4);}
to{box-shadow:0 0 25px rgba(255,0,0,1);}
}

@keyframes glowOrange{
from{box-shadow:0 0 8px rgba(255,140,0,0.4);}
to{box-shadow:0 0 20px rgba(255,140,0,1);}
}

.distance{
font-size:22px;
font-weight:bold;
margin-top:6px;
}

.info{
margin-top:6px;
font-size:16px;
opacity:.9;
}

.impact{
margin-top:6px;
font-size:18px;
font-weight:bold;
color:#00ffcc;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<!-- 🔥 LOGO (SCROLLS NATURALLY) -->
<img src="logo.PNG" class="logo">

<div id="locationBox" class="locationBox">Detecting location...</div>

<div class="searchBox">
<input id="searchInput" placeholder="Search US city or town">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="section">
<div id="storms"></div>
</div>

<script>

/* MENU */
function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display = panel.style.display==="block"?"none":"block"
}

/* LOGO ALERT */
function updateLogoAlert(hasTornado){
let logo=document.querySelector(".logo")
if(hasTornado) logo.classList.add("alert")
else logo.classList.remove("alert")
}

/* GEO */
let lat, lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadLocation()
loadStorms()
})

/* LOCATION */
async function loadLocation(){
try{
let p=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let d=await p.json()

let city=d.properties.relativeLocation.properties.city
let state=d.properties.relativeLocation.properties.state

let countyRes=await fetch(d.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

locationBox.innerHTML=`<b>${county} County</b><br>${city}, ${state}`

}catch{
locationBox.innerText="Location unavailable"
}
}

/* SEARCH */
let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")

input.addEventListener("input",async()=>{
let q=input.value.trim()

if(q.length<2){
suggestions.innerHTML=""
return
}

let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=us&limit=8`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(place=>{
let div=document.createElement("div")
div.innerText=place.display_name

div.onclick=()=>{
lat=parseFloat(place.lat)
lon=parseFloat(place.lon)
input.value=place.display_name
suggestions.innerHTML=""
loadLocation()
loadStorms()
}

suggestions.appendChild(div)
})
})

/* BASIC STORMS (UNCHANGED SAFE VERSION) */
async function loadStorms(){
let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let html=""

data.features.slice(0,6).forEach(a=>{
let e=a.properties.event
let style=e.includes("Tornado")?"tornado":"severe"

html+=`
<div class="${style}">
<b>${e}</b>
<div class="info">${a.properties.areaDesc}</div>
</div>
`
})

document.getElementById("storms").innerHTML = html || "<div class='card'>No storms</div>"
}

setInterval(loadStorms,60000)

</script>

</body>
</html>
