<script>

let lat
let lon

function distance(lat1,lon1,lat2,lon2){

const R = 3958.8

const dLat = (lat2-lat1)*Math.PI/180
const dLon = (lon2-lon1)*Math.PI/180

const a =
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

const c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return R*c

}

function centerOfPolygon(coords){

let latSum = 0
let lonSum = 0

coords.forEach(p=>{
lonSum += p[0]
latSum += p[1]
})

return {
lat: latSum / coords.length,
lon: lonSum / coords.length
}

}

function directionFromUser(userLat,userLon,stormLat,stormLon){

let dLat = stormLat-userLat
let dLon = stormLon-userLon

if(Math.abs(dLat) > Math.abs(dLon)){
return dLat > 0 ? "N" : "S"
}else{
return dLon > 0 ? "E" : "W"
}

}

async function checkStorm(){

try{

let res = await fetch("https://api.weather.gov/alerts/active")
let data = await res.json()

let storms = data.features.filter(a =>
(a.properties.event.includes("Severe") ||
a.properties.event.includes("Tornado")) &&
a.geometry &&
a.geometry.coordinates
)

if(storms.length === 0){

document.getElementById("stormBox").innerText =
"No severe storms detected nearby."

return

}

let stormList = []

storms.forEach(storm=>{

let polygon = storm.geometry.coordinates[0]

let center = centerOfPolygon(polygon)

let dist = distance(lat,lon,center.lat,center.lon)

let speed = storm.properties.parameters?.stormMotionSpeed?.[0] || 40
let dir = storm.properties.parameters?.stormMotionDirection?.[0] || "Unknown"

let arrival = Math.round((dist/speed)*60)

let direction = directionFromUser(lat,lon,center.lat,center.lon)

stormList.push({
event: storm.properties.event,
distance: dist,
direction: direction,
speed: speed,
dir: dir,
arrival: arrival
})

})

stormList.sort((a,b)=>a.distance-b.distance)

let html = ""

stormList.slice(0,5).forEach(s=>{

html += `
<div class="card warning">

<h2>${s.event}</h2>

Storm detected ${Math.round(s.distance)} miles ${s.direction} of you<br><br>

Storm Motion: ${s.dir}° at ${s.speed} mph<br><br>

Estimated Arrival: ${s.arrival} minutes

</div>
`

})

document.getElementById("stormBox").innerHTML = html

}catch(e){

document.getElementById("stormBox").innerText =
"Storm tracker error loading data."

}

}

navigator.geolocation.getCurrentPosition(pos=>{

lat = pos.coords.latitude
lon = pos.coords.longitude

checkStorm()

})

setInterval(checkStorm,60000)

</script>
