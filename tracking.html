<!DOCTYPE html>
<html>
<head>
<title>Storm Threat Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* LOGO */
.logo{
width:260px;
margin:15px auto;
display:block;
filter: drop-shadow(0 0 15px rgba(0,255,150,0.6));
}

/* MENU */
.menuIcon{
position:fixed;
top:15px;
left:15px;
font-size:40px;
z-index:9999;
cursor:pointer;
}

.menuPanel{
display:none;
position:fixed;
top:70px;
left:15px;
background:#111827;
padding:15px;
border-radius:10px;
z-index:9999;
}

.menuPanel a{
display:block;
padding:10px;
color:white;
text-decoration:none;
}

/* CARD */
.card{
background:#111827;
margin:15px;
padding:20px;
border-radius:12px;
text-align:left;
}

/* COLORS */
.tornado{background:#7a0000;}
.severe{background:#8a4b00;}
.emergency{background:#ff00ff;color:black;}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<img src="logo.PNG" class="logo">

<h2>Incoming Storm Threats</h2>

<div id="storms">Scanning for storms...</div>

<script>

/* MENU */
function toggleMenu(){
let m=document.getElementById("menuPanel")
m.style.display = m.style.display==="block"?"none":"block"
}

/* USER LOCATION */
let userLat=43, userLon=-88

navigator.geolocation.getCurrentPosition(p=>{
userLat=p.coords.latitude
userLon=p.coords.longitude
loadStorms()
},()=>loadStorms())

/* DISTANCE CALC */
function distance(lat1, lon1, lat2, lon2){
let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2

return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))
}

/* DIRECTION */
function getDirection(lat1, lon1, lat2, lon2){
let dLon=(lon2-lon1)
let y=Math.sin(dLon)*Math.cos(lat2)
let x=Math.cos(lat1)*Math.sin(lat2)-Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon)
let brng=Math.atan2(y,x)
return ((brng*180/Math.PI)+360)%360
}

/* LOAD STORMS */
async function loadStorms(){

let r=await fetch(`https://api.weather.gov/alerts/active`)
let d=await r.json()

let html=""

d.features.forEach(a=>{

let type=a.properties.event

/* FILTER ONLY IMPORTANT */
if(
!type.includes("Tornado") &&
!type.includes("Severe Thunderstorm")
){
return
}

/* GET CENTER OF STORM */
let coords=a.geometry?.coordinates
if(!coords) return

let c=coords[0][0]
let lat=c[1]
let lon=c[0]

let dist=distance(userLat,userLon,lat,lon)

/* ONLY SHOW IF WITHIN 150 MILES */
if(dist>240) return

/* ESTIMATE SPEED */
let speed=40 // mph average storm

let eta=Math.round((dist/speed)*60)

/* DIRECTION */
let dir=getDirection(userLat,userLon,lat,lon)

/* COLOR */
let style="severe"
if(type.includes("Tornado Warning")) style="tornado"
if(type.includes("Tornado Emergency")) style="emergency"

/* BUILD CARD */
html+=`
<div class="card ${style}">
<b>${type}</b><br><br>

Distance: ${Math.round(dist)} km<br>
Direction: ${Math.round(dir)}°<br>
Speed: ~${speed} mph<br>
Arrival: ~${eta} min<br><br>

${a.properties.areaDesc}
</div>
`

})

storms.innerHTML=html||"No incoming storms nearby"
}

/* AUTO REFRESH */
setInterval(loadStorms,60000)

</script>

</body>
</html>
