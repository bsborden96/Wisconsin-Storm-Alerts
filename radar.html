<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weather Radar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#050812;
  --panel:rgba(10,18,32,.90);
  --panel2:rgba(5,12,22,.92);
  --line:rgba(0,207,255,.18);
  --cyan:#00cfff;
  --cyan2:#6fe8ff;
  --text:#e7f4ff;
  --muted:#6d8fa6;
  --red:#ff4d4d;
  --warn:#ff9f2f;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#map{position:absolute;inset:0;background:#03060b}
.leaflet-container{background:#03060b}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  padding:calc(env(safe-area-inset-top,0px)+10px) 12px 10px;
  background:linear-gradient(to bottom,rgba(3,8,18,.98),rgba(3,8,18,.70));
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px
}
.brand{
  font-weight:800;font-size:13px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--cyan);white-space:nowrap;text-shadow:0 0 10px rgba(0,207,255,.35)
}
.spacer{flex:1}
.btn,.seg{
  border:1px solid var(--line);
  background:rgba(0,207,255,.07);
  color:var(--text);
  border-radius:12px;
  padding:10px 12px;
  font-size:13px;
  line-height:1;
  box-shadow:var(--shadow);
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.btn:active,.seg:active,.seg.active{
  background:rgba(0,207,255,.18);
  border-color:var(--cyan);
  color:var(--cyan)
}
.btn.alertOn{
  background:rgba(255,77,77,.16);
  border-color:rgba(255,77,77,.32);
  color:#ffb0b0
}
.locCard{
  position:fixed;left:12px;top:70px;z-index:940;
  max-width:calc(100vw - 24px);
  padding:10px 12px;
  border-radius:14px;
  background:rgba(5,12,22,.90);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  font-size:12px
}
.locCard b{color:var(--cyan)}
#status{
  position:fixed;left:12px;bottom:84px;z-index:930;
  max-width:calc(100vw - 24px);
  padding:8px 10px;
  border-radius:12px;
  background:rgba(5,12,22,.92);
  border:1px solid var(--line);
  font-size:12px;
  color:var(--cyan);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.fab{
  position:fixed;right:12px;bottom:92px;z-index:950;
  display:flex;flex-direction:column;gap:10px
}
.panel{
  position:fixed;left:12px;right:12px;z-index:960;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow)
}
.timeline{
  bottom:12px;
  padding:12px
}
.timelineRow{
  display:flex;align-items:center;gap:10px
}
.time{
  font-size:12px;color:var(--muted);min-width:34px;text-align:center
}
#timeSlider{
  flex:1;
  -webkit-appearance:none;appearance:none;
  height:5px;border-radius:999px;
  background:rgba(0,207,255,.18);
  outline:none
}
#timeSlider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:18px;height:18px;border-radius:50%;
  background:var(--cyan);
  box-shadow:0 0 10px rgba(0,207,255,.65)
}
#timeSlider::-moz-range-thumb{
  width:18px;height:18px;border-radius:50%;
  border:none;background:var(--cyan)
}
.drawer{
  position:fixed;top:64px;right:12px;
  width:min(340px,calc(100vw - 24px));
  max-height:62vh;
  overflow:auto;
  display:none;
  padding:12px
}
.drawer.open{display:block}
.sectionTitle{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px
}
.search{
  width:100%;
  padding:10px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(0,0,0,.18);
  color:var(--text);
  outline:none;
  margin-bottom:10px
}
.site{
  padding:10px 12px;
  border-radius:12px;
  border:1px solid transparent;
  background:rgba(255,255,255,.03);
  margin-bottom:8px;
  cursor:pointer
}
.site.active{
  border-color:rgba(0,207,255,.35);
  background:rgba(0,207,255,.08)
}
.site b{display:block;font-size:14px;letter-spacing:.05em}
.site small{color:var(--muted)}
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.28);
  z-index:940;
  display:none
}
.modal.open{display:block}
.loading{
  position:fixed;inset:0;z-index:1100;
  display:flex;align-items:center;justify-content:center;
  background:rgba(5,8,18,.72);
  backdrop-filter:blur(4px);
  transition:opacity .25s
}
.loading.hidden{opacity:0;pointer-events:none}
.spinner{
  width:42px;height:42px;border-radius:50%;
  border:3px solid rgba(0,207,255,.15);
  border-top-color:var(--cyan);
  animation:spin .9s linear infinite;
  margin:0 auto 12px
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:840px){
  .drawer{top:72px}
  .panel.timeline{
    left:50%;
    transform:translateX(-50%);
    width:min(780px,calc(100vw - 24px))
  }
}
.scanLine{
  position:fixed;top:0;left:0;width:3px;height:100vh;
  background:linear-gradient(to bottom,transparent,rgba(0,255,160,.06),rgba(0,255,160,.22),rgba(0,255,160,.06),transparent);
  z-index:800;pointer-events:none;display:none;filter:blur(1px)
}
</style>
</head>
<body>
<div id="map"></div>

<div class="loading" id="loading">
  <div>
    <div class="spinner"></div>
    <div style="text-align:center;color:var(--cyan);font-weight:700;letter-spacing:.12em">LOADING RADAR…</div>
  </div>
</div>

<div class="topbar">
  <div class="brand">Weather Radar</div>
  <div class="spacer"></div>
  <button class="btn" id="locBtn">📍 My Loc</button>
  <button class="btn alertOn" id="alertsBtn">⚠ Alerts</button>
  <button class="btn" id="sitesBtn">📡 Sites</button>
</div>

<div class="locCard" id="locCard"><b>Nearest radar</b><div id="locText">Auto-locating…</div></div>
<div id="status">Starting…</div>

<div class="modal" id="backdrop"></div>

<div class="panel drawer" id="drawer">
  <div class="sectionTitle">Radar Sites</div>
  <input class="search" id="search" placeholder="Search site or state…">
  <div id="siteList"></div>
</div>

<div class="fab">
  <button class="seg" id="reflBtn">REFL</button>
  <button class="seg" id="velBtn">VEL</button>
  <button class="seg" id="scanBtn">SCAN</button>
</div>

<div class="panel timeline">
  <div class="timelineRow">
    <span class="time">PAST</span>
    <button class="seg" id="playBtn">PLAY</button>
    <input id="timeSlider" type="range" min="0" max="0" value="0">
    <span class="time">NOW</span>
    <span class="time" id="frameTime">--:--</span>
  </div>
</div>

<div class="scanLine" id="scanLine"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const RADAR_SITES = [
  { id:'KARX', name:'La Crosse, WI', lat:43.8228, lon:-91.1915 },
  { id:'KMKX', name:'Milwaukee, WI', lat:42.9678, lon:-88.5506 },
  { id:'KGRB', name:'Green Bay, WI', lat:44.4986, lon:-88.1111 },
  { id:'KMPX', name:'Minneapolis, MN', lat:44.8489, lon:-93.5653 },
  { id:'KLOT', name:'Chicago, IL', lat:41.6044, lon:-88.0847 },
  { id:'KDVN', name:'Davenport, IA', lat:41.6117, lon:-90.5808 }
];

let map, radarLayer = null, alertLayer = null;
let frames = [], frameIndex = 0, playing = false, timer = null;
let currentProduct = 'reflectivity', showAlerts = true;
let myLat = null, myLon = null, currentSite = null;
let scanOn = false, scanX = 0, scanDir = 1;

const el = id => document.getElementById(id);

function setStatus(t){ el('status').textContent = t; }
function showLoading(v){ el('loading').classList.toggle('hidden', !v); }
function dist(a,b,c,d){
  const R = 3958.8;
  const x = (c-a) * Math.PI / 180;
  const y = (d-b) * Math.PI / 180;
  const s = Math.sin(x/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function initMap(){
  map = L.map('map', {
    center:[43.8,-91.2],
    zoom:7,
    zoomControl:true,
    attributionControl:false
  });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains:'abcd',
    maxZoom:18,
    attribution:'© OpenStreetMap © CARTO'
  }).addTo(map);
  L.control.attribution({
    position:'bottomleft',
    prefix:'© OpenStreetMap © CARTO | RainViewer | NWS'
  }).addTo(map);
}

async function loadRadar(){
  showLoading(true);
  setStatus('Fetching radar frames…');
  try{
    const r = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    const j = await r.json();
    frames = [...(j.radar?.past || []), ...(j.radar?.nowcast || [])];
    if(!frames.length) throw new Error('No frames');
    el('timeSlider').max = frames.length - 1;
    showFrame(Math.max(0, (j.radar?.past || []).length - 1));
    setStatus(`Radar loaded · ${frames.length} frames`);
  }catch(e){
    setStatus('Radar unavailable, retrying…');
    setTimeout(loadRadar, 8000);
  }finally{
    showLoading(false);
  }
}

function showFrame(i){
  if(!frames.length) return;
  i = Math.max(0, Math.min(frames.length - 1, i));
  frameIndex = i;
  const f = frames[i];
  const color = currentProduct === 'velocity' ? 6 : 2;
  const url = `https://tilecache.rainviewer.com${f.path}/512/{z}/{x}/{y}/${color}/1_1.png`;
  if(radarLayer) map.removeLayer(radarLayer);
  radarLayer = L.tileLayer(url, {
    tileSize:512,
    opacity:.85,
    zoomOffset:-1,
    keepBuffer:4,
    updateWhenIdle:false
  }).addTo(map);
  el('timeSlider').value = i;
  el('frameTime').textContent = new Date(f.time * 1000).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  setStatus(`${currentProduct === 'velocity' ? 'Velocity' : 'Reflectivity'} · ${el('frameTime').textContent} · ${f.time > Date.now()/1000 ? 'nowcast' : 'observed'}`);
}

function setProduct(p){
  currentProduct = p;
  el('reflBtn').classList.toggle('active', p === 'reflectivity');
  el('velBtn').classList.toggle('active', p === 'velocity');
  showFrame(frameIndex);
}

function togglePlay(){
  playing = !playing;
  el('playBtn').textContent = playing ? 'PAUSE' : 'PLAY';
  if(timer) clearInterval(timer);
  if(playing){
    timer = setInterval(() => {
      showFrame((frameIndex + 1) % frames.length);
    }, 700);
  }
}

function toggleDrawer(){
  el('drawer').classList.toggle('open');
  el('backdrop').classList.toggle('open');
  buildSites();
}

function buildSites(filter=''){
  const list = el('siteList');
  list.innerHTML = '';
  const q = filter.trim().toLowerCase();
  let sites = RADAR_SITES.filter(s => !q || s.id.toLowerCase().includes(q) || s.name.toLowerCase().includes(q));
  if(myLat != null){
    sites = sites.map(s => ({ ...s, d: dist(myLat, myLon, s.lat, s.lon) })).sort((a,b) => a.d - b.d);
  }
  sites.forEach(s => {
    const d = document.createElement('div');
    d.className = 'site' + (currentSite === s.id ? ' active' : '');
    d.innerHTML = `<b>${s.id}</b><small>${s.name}${s.d != null ? ` · ${Math.round(s.d)} mi` : ''}</small>`;
    d.onclick = () => selectSite(s);
    list.appendChild(d);
  });
  if(!sites.length) list.innerHTML = '<div style="color:var(--muted);padding:10px">No matches</div>';
}

function selectSite(s){
  currentSite = s.id;
  map.flyTo([s.lat, s.lon], 8, { duration:1.2 });
  el('locText').innerHTML = `<b>${s.id}</b> · ${s.name}`;
  setStatus(`Selected ${s.id} · ${s.name}`);
  toggleDrawer();
  refreshRadar();
}

async function goToMyLocation(){
  if(!navigator.geolocation){
    setStatus('Geolocation unavailable');
    return;
  }
  setStatus('Locating…');
  navigator.geolocation.getCurrentPosition(pos => {
    myLat = pos.coords.latitude;
    myLon = pos.coords.longitude;
    let nearest = RADAR_SITES[0], best = 1e9;
    for(const s of RADAR_SITES){
      const d = dist(myLat, myLon, s.lat, s.lon);
      if(d < best){ best = d; nearest = s; }
    }
    currentSite = nearest.id;
    el('locText').innerHTML = `<b>${nearest.id}</b> · ${nearest.name} · ${Math.round(best)} mi`;
    map.flyTo([myLat, myLon], 8, { duration:1.2 });
    L.circleMarker([myLat, myLon], {
      radius:7, fillColor:'#00cfff', color:'#fff', weight:2, fillOpacity:.95
    }).addTo(map).bindPopup('Your location');
    setStatus(`Nearest radar · ${nearest.id} · ${Math.round(best)} mi`);
    buildSites(el('search').value);
  }, () => setStatus('Location denied'), { timeout:8000 });
}

async function loadAlerts(){
  if(!showAlerts) return;
  try{
    const r = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert', {
      headers:{
        'User-Agent':'weather-radar-demo (contact: you@example.com)',
        'Accept':'application/geo+json'
      }
    });
    const j = await r.json();
    if(alertLayer) map.removeLayer(alertLayer);
    alertLayer = L.geoJSON(
      { type:'FeatureCollection', features:(j.features || []).filter(f => f.geometry) },
      {
        style:f => {
          const ev = f.properties?.event || '';
          const c = ev.includes('Tornado') ? '#ff2222' : ev.includes('Warning') ? '#ff8800' : ev.includes('Watch') ? '#ccaa00' : '#22aaff';
          return {
            color:c,
            weight:ev.includes('Warning') ? 2.5 : 1.5,
            opacity:.85,
            fillColor:c,
            fillOpacity:ev.includes('Warning') ? .18 : .10,
            dashArray:ev.includes('Watch') ? '5,5' : null
          };
        },
        onEachFeature:(f,l) => l.bindPopup(`<b>${f.properties?.event || 'Alert'}</b><br>${f.properties?.areaDesc || ''}`)
      }
    ).addTo(map);
  }catch(e){
    setStatus('Alerts unavailable');
  }
}

function refreshRadar(){
  if(timer) clearInterval(timer);
  playing = false;
  el('playBtn').textContent = 'PLAY';
  loadRadar();
  if(showAlerts) loadAlerts();
}

function toggleScan(){
  scanOn = !scanOn;
  el('scanBtn').classList.toggle('active', scanOn);
  el('scanLine').style.display = scanOn ? 'block' : 'none';
  if(scanOn) animateScan();
}

function animateScan(){
  if(!scanOn) return;
  scanX += scanDir * 3;
  if(scanX > innerWidth){ scanDir = -1; scanX = innerWidth; }
  if(scanX < 0){ scanDir = 1; scanX = 0; }
  el('scanLine').style.left = scanX + 'px';
  requestAnimationFrame(animateScan);
}

el('reflBtn').onclick = () => setProduct('reflectivity');
el('velBtn').onclick = () => setProduct('velocity');
el('playBtn').onclick = togglePlay;
el('sitesBtn').onclick = toggleDrawer;
el('backdrop').onclick = toggleDrawer;
el('locBtn').onclick = goToMyLocation;
el('alertsBtn').onclick = () => {
  showAlerts = !showAlerts;
  el('alertsBtn').classList.toggle('alertOn', showAlerts);
  if(showAlerts) loadAlerts();
  else if(alertLayer) map.removeLayer(alertLayer);
};
el('search').oninput = e => buildSites(e.target.value);
el('timeSlider').oninput = e => {
  playing = false;
  el('playBtn').textContent = 'PLAY';
  showFrame(+e.target.value);
};
el('scanBtn').onclick = toggleScan;

initMap();
loadRadar();
loadAlerts();
goToMyLocation();
setInterval(() => {
  if(!playing) refreshRadar();
}, 300000);
</script>
</body>
</html>
