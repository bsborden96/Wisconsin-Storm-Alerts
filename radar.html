<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>US Storm Radar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
/* ══════════════════════════════════════════════
   DESIGN TOKENS — matches Storm Alerts system
══════════════════════════════════════════════ */
:root {
  --c-bg:        #050a14;
  --c-surface:   rgba(10,25,50,0.88);
  --c-border:    rgba(0,207,255,0.15);
  --c-cyan:      #00cfff;
  --c-text:      #e0f0ff;
  --c-muted:     #4a7a9a;
  --c-red:       #ff4444;
  --c-orange:    #ff8c00;
  --c-green:     #6eff8a;
  --c-blue:      #7ecfff;

  --font-display: 'Bebas Neue', cursive;
  --font-mono:    'Share Tech Mono', monospace;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 16px;

  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left, 0px);
  --safe-right:  env(safe-area-inset-right, 0px);

  --header-h: 56px;
  --controls-h: 52px;
}

/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--c-bg);
  color: var(--c-text);
  font-family: var(--font-mono);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  touch-action: none;
}

/* ════════════════════════════════════════════
   FIXED HEADER BAR
════════════════════════════════════════════ */
#headerBar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: calc(var(--header-h) + var(--safe-top));
  padding-top: var(--safe-top);
  background: rgba(5,10,20,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0,207,255,0.14);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding-left: calc(56px + var(--safe-left));
  padding-right: calc(56px + var(--safe-right));
}
#headerTitle {
  font-family: var(--font-display);
  font-size: 20px;
  letter-spacing: 3px;
  color: var(--c-cyan);
  text-shadow: 0 0 12px rgba(0,207,255,0.45);
  white-space: nowrap;
}

/* ── MENU BUTTON ── */
.menu-btn {
  position: fixed;
  top: var(--safe-top);
  left: var(--safe-left);
  width: 56px;
  height: var(--header-h);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1001;
  cursor: pointer;
  background: none;
  border: none;
  color: var(--c-cyan);
  font-size: 22px;
  touch-action: manipulation;
  transition: color .15s;
}
.menu-btn:active { color: #fff; }

/* ── NAV MENU ── */
.menu-panel {
  position: fixed;
  top: calc(var(--header-h) + var(--safe-top) + 4px);
  left: calc(8px + var(--safe-left));
  background: rgba(4,12,28,0.97);
  border: 1px solid rgba(0,207,255,0.28);
  padding: 6px 8px;
  border-radius: var(--radius-md);
  z-index: 1001;
  min-width: 180px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.7);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  transform-origin: top left;
  transform: scale(0.92);
  opacity: 0;
  pointer-events: none;
  transition: transform .22s cubic-bezier(0.34,1.56,0.64,1), opacity .18s ease;
}
.menu-panel.open { transform: scale(1); opacity: 1; pointer-events: auto; }
.menu-panel a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  color: #a0d8ef;
  text-decoration: none;
  font-family: var(--font-display);
  font-size: 17px;
  letter-spacing: 1.5px;
  border-radius: 8px;
  transition: color .12s, background .12s;
}
.menu-panel a:active { color: var(--c-cyan); background: rgba(0,207,255,0.1); }
.menu-icon-char { font-size: 16px; width: 20px; text-align: center; }

/* ════════════════════════════════════════════
   PRODUCT CONTROLS BAR
════════════════════════════════════════════ */
#controlsBar {
  position: fixed;
  top: calc(var(--header-h) + var(--safe-top));
  left: 0; right: 0;
  height: var(--controls-h);
  background: rgba(5,10,20,0.94);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,207,255,0.1);
  display: flex;
  align-items: center;
  gap: 0;
  z-index: 999;
  overflow: hidden;
  padding: 0 calc(8px + var(--safe-left)) 0 calc(8px + var(--safe-right));
}

.product-tabs {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 1;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding: 0 4px;
  touch-action: pan-x;
}
.product-tabs::-webkit-scrollbar { display: none; }

.product-btn {
  flex-shrink: 0;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  font-family: var(--font-display);
  font-size: 13px;
  letter-spacing: 1.5px;
  color: var(--c-muted);
  background: transparent;
  border: 1px solid rgba(0,207,255,0.12);
  cursor: pointer;
  touch-action: manipulation;
  transition: color .15s, background .15s, border-color .15s;
  white-space: nowrap;
}
.product-btn:active { opacity: .75; }
.product-btn.active {
  color: var(--c-cyan);
  background: rgba(0,207,255,0.12);
  border-color: rgba(0,207,255,0.38);
  text-shadow: 0 0 8px rgba(0,207,255,0.4);
}

.controls-divider {
  width: 1px;
  height: 28px;
  background: rgba(0,207,255,0.1);
  flex-shrink: 0;
  margin: 0 6px;
}

/* Lightning toggle */
.lightning-btn {
  flex-shrink: 0;
  padding: 7px 12px;
  border-radius: var(--radius-sm);
  font-family: var(--font-display);
  font-size: 13px;
  letter-spacing: 1.5px;
  color: var(--c-muted);
  background: transparent;
  border: 1px solid rgba(255,220,0,0.12);
  cursor: pointer;
  touch-action: manipulation;
  transition: color .15s, background .15s, border-color .15s;
  white-space: nowrap;
}
.lightning-btn.active {
  color: #ffe060;
  background: rgba(255,220,0,0.1);
  border-color: rgba(255,220,0,0.4);
  text-shadow: 0 0 8px rgba(255,220,0,0.45);
}

/* ════════════════════════════════════════════
   MAP CONTAINER
════════════════════════════════════════════ */
#mapContainer {
  position: fixed;
  top: calc(var(--header-h) + var(--controls-h) + var(--safe-top));
  left: 0; right: 0;
  bottom: 0;
  z-index: 1;
}

/* Leaflet dark overrides */
.leaflet-container {
  background: #020608 !important;
  font-family: var(--font-mono) !important;
}
.leaflet-control-zoom {
  border: 1px solid rgba(0,207,255,0.22) !important;
  border-radius: var(--radius-sm) !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6) !important;
  overflow: hidden;
}
.leaflet-control-zoom a {
  background: rgba(5,12,28,0.95) !important;
  color: var(--c-cyan) !important;
  font-size: 18px !important;
  line-height: 30px !important;
  width: 34px !important;
  height: 34px !important;
  border-color: rgba(0,207,255,0.14) !important;
  font-family: var(--font-display) !important;
  transition: background .15s !important;
}
.leaflet-control-zoom a:hover { background: rgba(0,207,255,0.12) !important; }
.leaflet-bar { border: none !important; }
.leaflet-control-attribution {
  background: rgba(5,10,20,0.78) !important;
  color: #2a5070 !important;
  font-size: 9px !important;
  backdrop-filter: blur(8px) !important;
  border-radius: 4px 0 0 0 !important;
}
.leaflet-control-attribution a { color: #3a7a9a !important; }

/* ════════════════════════════════════════════
   RADAR SITE SELECTOR PANEL
════════════════════════════════════════════ */
#sitePanel {
  position: fixed;
  bottom: calc(80px + var(--safe-bottom));
  left: calc(10px + var(--safe-left));
  width: min(300px, calc(100vw - 20px));
  max-height: 340px;
  background: rgba(4,12,28,0.97);
  border: 1px solid rgba(0,207,255,0.24);
  border-radius: var(--radius-lg);
  z-index: 900;
  display: none;
  flex-direction: column;
  box-shadow: 0 16px 48px rgba(0,0,0,0.8);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  overflow: hidden;
  transform-origin: bottom left;
  animation: panelIn .22s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes panelIn {
  from { opacity:0; transform:scale(0.92) translateY(8px); }
  to   { opacity:1; transform:scale(1) translateY(0); }
}
#sitePanel.visible { display: flex; }
.site-panel-header {
  padding: 12px 14px 8px;
  border-bottom: 1px solid rgba(0,207,255,0.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.site-panel-title {
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 2px;
  color: var(--c-blue);
}
.site-panel-close {
  background: none;
  border: none;
  color: var(--c-muted);
  font-size: 15px;
  cursor: pointer;
  padding: 2px 6px;
  touch-action: manipulation;
  border-radius: 4px;
  transition: color .12s;
}
.site-panel-close:active { color: var(--c-cyan); }

.site-search {
  padding: 8px 12px;
  border-bottom: 1px solid rgba(0,207,255,0.08);
  flex-shrink: 0;
}
.site-search input {
  width: 100%;
  background: rgba(0,12,30,0.8);
  border: 1px solid rgba(0,207,255,0.18);
  border-radius: var(--radius-sm);
  color: var(--c-text);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 7px 10px;
  outline: none;
  -webkit-appearance: none;
}
.site-search input::placeholder { color: var(--c-muted); }
.site-search input:focus { border-color: rgba(0,207,255,0.4); }

.site-list {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1;
}
.site-item {
  padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  cursor: pointer;
  touch-action: manipulation;
  transition: background .12s, color .12s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.site-item:last-child { border-bottom: none; }
.site-item:active, .site-item.selected { background: rgba(0,207,255,0.1); }
.site-item.selected .site-id { color: var(--c-cyan); }
.site-id {
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 1.5px;
  color: var(--c-blue);
  flex-shrink: 0;
}
.site-name {
  font-size: 11px;
  color: var(--c-muted);
  text-align: right;
  line-height: 1.3;
  flex: 1;
}

/* ════════════════════════════════════════════
   BOTTOM TOOLBAR
════════════════════════════════════════════ */
#bottomBar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(64px + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(5,10,20,0.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0,207,255,0.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: calc(14px + var(--safe-left));
  padding-right: calc(14px + var(--safe-right));
  z-index: 900;
  gap: 10px;
}

#radarSiteBtn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  background: rgba(0,207,255,0.07);
  border: 1px solid rgba(0,207,255,0.2);
  border-radius: var(--radius-md);
  padding: 8px 14px;
  cursor: pointer;
  touch-action: manipulation;
  transition: background .15s, border-color .15s;
  gap: 1px;
  flex: 1;
  min-width: 0;
}
#radarSiteBtn:active { background: rgba(0,207,255,0.15); }
.radar-btn-label {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--c-muted);
  text-transform: uppercase;
}
#currentSiteName {
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 2px;
  color: var(--c-cyan);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

/* Opacity slider */
#opacityWrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}
.opacity-label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--c-muted);
}
#opacitySlider {
  -webkit-appearance: none;
  appearance: none;
  width: 90px;
  height: 4px;
  border-radius: 2px;
  background: rgba(0,207,255,0.15);
  outline: none;
  cursor: pointer;
  touch-action: none;
}
#opacitySlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--c-cyan);
  box-shadow: 0 0 8px rgba(0,207,255,0.6);
  cursor: pointer;
}
#opacitySlider::-moz-range-thumb {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--c-cyan);
  border: none;
  cursor: pointer;
}

/* Animate button */
#animateBtn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: rgba(0,207,255,0.07);
  border: 1px solid rgba(0,207,255,0.18);
  border-radius: var(--radius-md);
  padding: 8px 12px;
  cursor: pointer;
  touch-action: manipulation;
  transition: background .15s, border-color .15s;
  flex-shrink: 0;
}
#animateBtn:active { background: rgba(0,207,255,0.15); }
#animateBtn.playing {
  border-color: rgba(0,207,255,0.45);
  background: rgba(0,207,255,0.14);
}
.anim-icon { font-size: 20px; line-height: 1; }
.anim-label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--c-muted);
}
#animateBtn.playing .anim-label { color: var(--c-cyan); }

/* ════════════════════════════════════════════
   STATUS BAR
════════════════════════════════════════════ */
#statusBar {
  position: fixed;
  top: calc(var(--header-h) + var(--controls-h) + var(--safe-top) + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(5,10,22,0.9);
  border: 1px solid rgba(0,207,255,0.18);
  border-radius: 20px;
  padding: 5px 14px;
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 1.5px;
  color: var(--c-blue);
  z-index: 800;
  pointer-events: none;
  transition: opacity .3s;
  white-space: nowrap;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}
#statusBar.hidden { opacity: 0; }

/* ════════════════════════════════════════════
   LEGEND
════════════════════════════════════════════ */
#legend {
  position: fixed;
  top: calc(var(--header-h) + var(--controls-h) + var(--safe-top) + 8px);
  right: calc(10px + var(--safe-right));
  background: rgba(4,12,28,0.92);
  border: 1px solid rgba(0,207,255,0.14);
  border-radius: var(--radius-md);
  padding: 8px 10px;
  z-index: 800;
  min-width: 80px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.legend-title {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--c-muted);
  text-align: center;
  margin-bottom: 5px;
  text-transform: uppercase;
}
.legend-bar {
  height: 12px;
  border-radius: 3px;
  margin-bottom: 4px;
}
.legend-labels {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--c-muted);
  font-family: var(--font-mono);
}

/* Product legends */
.legend-ref  { background: linear-gradient(to right, #04e9e7,#019ff4,#0300f4,#02fd02,#01c501,#008e00,#fdf802,#e5bc00,#fd9500,#fd0000,#d40000,#bc0000,#f800fd,#9854c6); }
.legend-vel  { background: linear-gradient(to right, #00ffff,#0080ff,#000080,#808080,#800000,#ff0000,#ffff00); }
.legend-cc   { background: linear-gradient(to right, #3333cc,#3399ff,#33cc33,#cccc00,#ff6600,#cc0000); }

/* ════════════════════════════════════════════
   FRAME COUNTER (animation)
════════════════════════════════════════════ */
#frameCounter {
  position: fixed;
  bottom: calc(72px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%);
  background: rgba(5,10,22,0.9);
  border: 1px solid rgba(0,207,255,0.16);
  border-radius: 16px;
  padding: 4px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--c-muted);
  z-index: 800;
  pointer-events: none;
  display: none;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* ════════════════════════════════════════════
   LIGHTNING MARKERS
════════════════════════════════════════════ */
.lightning-marker {
  width: 0; height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lightning-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #ffe040;
  box-shadow: 0 0 6px 2px rgba(255,220,40,0.7);
  animation: ltgFade 8s ease-out forwards;
}
@keyframes ltgFade {
  0%   { opacity:1; transform:scale(1.2); }
  20%  { opacity:0.9; transform:scale(1); }
  100% { opacity:0; transform:scale(0.5); }
}
.lightning-dot.old {
  background: #ff8040;
  box-shadow: 0 0 4px rgba(255,128,64,0.5);
}
.lightning-dot.very-old {
  background: #ff4040;
  box-shadow: 0 0 3px rgba(255,64,64,0.35);
}

/* ════════════════════════════════════════════
   LOADING OVERLAY
════════════════════════════════════════════ */
#loadingOverlay {
  position: fixed;
  top: calc(var(--header-h) + var(--controls-h) + var(--safe-top));
  left: 0; right: 0; bottom: 0;
  background: rgba(5,10,20,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 850;
  pointer-events: none;
  opacity: 0;
  transition: opacity .3s;
}
#loadingOverlay.visible { opacity: 1; }
.spinner {
  width: 36px; height: 36px;
  border: 2px solid rgba(0,207,255,0.12);
  border-top-color: var(--c-cyan);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Focus */
:focus-visible { outline: 2px solid var(--c-cyan); outline-offset: 3px; }

/* Radar site circle markers */
.radar-site-marker {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: rgba(0,207,255,0.7);
  border: 1.5px solid rgba(0,207,255,0.9);
  box-shadow: 0 0 6px rgba(0,207,255,0.5);
  cursor: pointer;
  transition: transform .15s;
}
.radar-site-marker:hover { transform: scale(1.4); }
.radar-site-marker.active-site {
  background: rgba(0,207,255,1);
  box-shadow: 0 0 10px rgba(0,207,255,0.85);
}

/* Leaflet popup tweaks */
.leaflet-popup-content-wrapper {
  background: rgba(4,12,28,0.97) !important;
  border: 1px solid rgba(0,207,255,0.24) !important;
  border-radius: var(--radius-md) !important;
  color: var(--c-text) !important;
  font-family: var(--font-mono) !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7) !important;
}
.leaflet-popup-tip { background: rgba(4,12,28,0.97) !important; }
.leaflet-popup-content { margin: 10px 14px !important; font-size: 13px !important; }
.radar-popup-id {
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 2px;
  color: var(--c-cyan);
  display: block;
  margin-bottom: 4px;
}
.radar-popup-loc { color: var(--c-muted); font-size: 11px; display: block; margin-bottom: 8px; }
.radar-popup-btn {
  display: block;
  width: 100%;
  padding: 8px 0;
  text-align: center;
  background: rgba(0,207,255,0.1);
  border: 1px solid rgba(0,207,255,0.28);

/* ════════════════════════════════════════════════
   RADAR TILE LAYER
   IEM provides composite NEXRAD tiles updated ~2 min
════════════════════════════════════════════════ */
function loadRadarLayer() {
  showLoading(true);
  setStatus('LOADING ' + currentProduct + ' RADAR…');

  if (radarLayer) {
    map.removeLayer(radarLayer);
    radarLayer = null;
  }

  const prod = PRODUCTS[currentProduct];
  // Add cache-busting param so tiles refresh properly
  const ts = Math.floor(Date.now() / 120000); // changes every 2 min
  const url = `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/${IEM_ARCHIVE_PRODUCTS[currentProduct]}/{z}/{x}/{y}.png?_=${ts}`;

  radarLayer = L.tileLayer(url, {
    opacity: opacity,
    tileSize: 256,
    zIndex: 5,
    attribution: '© IEM NEXRAD',
    crossOrigin: true,
  });

  let tilesLoaded = false;
  radarLayer.on('load', () => {
    if (!tilesLoaded) {
      tilesLoaded = true;
      showLoading(false);
      setStatus(prod.label.toUpperCase() + ' · COMPOSITE · LIVE');
      updateLegend();
    }
  });
  radarLayer.on('tileerror', () => {
    showLoading(false);
    setStatus('⚠ TILE LOAD ERROR — CHECK CONNECTION');
  });

  radarLayer.addTo(map);

  // Fallback if tiles don't fire 'load'
  setTimeout(() => { showLoading(false); }, 6000);
}

/* ════════════════════════════════════════════════
   ANIMATION — cycle through IEM archive frames
   IEM exposes time-indexed archive tiles
════════════════════════════════════════════════ */
function buildAnimFrames() {
  // IEM provides frames as minute-offset tiles
  // Build 6 frames: 0 = oldest (~10min ago), 5 = newest
  const nowMin = Math.floor(Date.now() / 60000);
  const frames = [];
  for (let i = 5; i >= 0; i--) {
    const t = nowMin - i * 2; // every 2 minutes back
    frames.push(t);
  }
  return frames;
}

function getFrameUrl(frameTs) {
  return `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/${IEM_ARCHIVE_PRODUCTS[currentProduct]}/{z}/{x}/{y}.png?_=${frameTs}`;
}

function getFrameLabel(ts) {
  const d = new Date(ts * 60000);
  return d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}

function toggleAnimation() {
  if (animating) {
    stopAnimation();
  } else {
    startAnimation();
  }
}

function startAnimation() {
  animating = true;
  animFrames = buildAnimFrames();
  animFrameIdx = 0;
  document.getElementById('animateBtn').classList.add('playing');
  document.getElementById('animIcon').textContent = '⏸';
  document.getElementById('animLabel').textContent = 'PAUSE';
  document.getElementById('scrubberWrap').classList.add('visible');
  document.getElementById('frameCounter').style.display = 'block';
  document.getElementById('frameScrubber').max = animFrames.length - 1;
  updateScrubberLabels();
  showAnimFrame();
  animTimer = setInterval(() => {
    animFrameIdx = (animFrameIdx + 1) % animFrames.length;
    showAnimFrame();
  }, 700);
}

function showAnimFrame() {
  if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
  const ts = animFrames[animFrameIdx];
  radarLayer = L.tileLayer(getFrameUrl(ts), {
    opacity: opacity,
    tileSize: 256,
    zIndex: 5,
    attribution: '© IEM NEXRAD',
    crossOrigin: true,
  }).addTo(map);
  // Update scrubber
  document.getElementById('frameScrubber').value = animFrameIdx;
  document.getElementById('frameCounter').textContent =
    `FRAME ${animFrameIdx + 1} / ${animFrames.length} · ${getFrameLabel(ts)}`;
  updateScrubberLabels();
}

function updateScrubberLabels() {
  if (!animFrames.length) return;
  document.getElementById('scrubberStart').textContent = getFrameLabel(animFrames[0]);
  document.getElementById('scrubberEnd').textContent   = 'NOW';
}

function stopAnimation() {
  animating = false;
  clearInterval(animTimer);
  animTimer = null;
  document.getElementById('animateBtn').classList.remove('playing');
  document.getElementById('animIcon').textContent = '▶';
  document.getElementById('animLabel').textContent = 'ANIMATE';
  document.getElementById('scrubberWrap').classList.remove('visible');
  document.getElementById('frameCounter').style.display = 'none';
  // Reload live layer
  loadRadarLayer();
}

// Manual scrubber control
document.getElementById('frameScrubber').addEventListener('input', function() {
  if (!animating) return;
  clearInterval(animTimer);
  animFrameIdx = parseInt(this.value);
  showAnimFrame();
  // Resume auto-play after 2s pause
  clearTimeout(window._scrubberResumeTimer);
  window._scrubberResumeTimer = setTimeout(() => {
    if (animating) {
      animTimer = setInterval(() => {
        animFrameIdx = (animFrameIdx + 1) % animFrames.length;
        showAnimFrame();
      }, 700);
    }
  }, 2000);
});

/* ════════════════════════════════════════════════
   PRODUCT SWITCHING
════════════════════════════════════════════════ */
function setProduct(product) {
  if (currentProduct === product) return;
  currentProduct = product;

  // Update buttons
  document.querySelectorAll('.product-btn').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-pressed', 'false');
  });
  const btn = document.getElementById('btn-' + product.toLowerCase());
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true'); }

  if (animating) {
    stopAnimation();
  } else {
    loadRadarLayer();
  }
}

/* ════════════════════════════════════════════════
   OPACITY CONTROL
════════════════════════════════════════════════ */
document.getElementById('opacitySlider').addEventListener('input', function() {
  opacity = parseFloat(this.value);
  if (radarLayer) radarLayer.setOpacity(opacity);
});

/* ════════════════════════════════════════════════
   LEGEND
════════════════════════════════════════════════ */
function updateLegend() {
  const prod = PRODUCTS[currentProduct];
  document.getElementById('legendTitle').textContent  = prod.unit;
  document.getElementById('legendBar').className = 'legend-bar ' + prod.legendClass;
  const labels = document.getElementById('legendLabels');
  labels.innerHTML = `<span>${prod.legendMin}</span><span>${prod.legendMax}</span>`;
}

/* ════════════════════════════════════════════════
   SITE MARKERS
════════════════════════════════════════════════ */
function placeSiteMarkers() {
  siteMarkers.forEach(m => m.remove());
  siteMarkers = [];

  RADAR_SITES.forEach(site => {
    const isActive = site.id === currentSite.id;
    const icon = L.divIcon({
      className: '',
      html: `<div class="radar-site-marker${isActive ? ' active-site' : ''}"></div>`,
      iconSize: [10, 10],
      iconAnchor: [5, 5],
    });
    const marker = L.marker([site.lat, site.lon], { icon, title: site.id });
    marker.on('click', (e) => {
      L.DomEvent.stopPropagation(e);
      showSitePopup(site, marker);
    });
    marker.addTo(map);
    siteMarkers.push(marker);
  });
}

function showSitePopup(site, marker) {
  const popup = L.popup({ closeButton: false, offset: [0, -4] })
    .setLatLng([site.lat, site.lon])
    .setContent(`
      <span class="radar-popup-id">${site.id}</span>
      <span class="radar-popup-loc">${site.name}</span>
      <button class="radar-popup-btn" onclick="selectSite('${site.id}')">USE THIS SITE</button>
    `)
    .openOn(map);
}

function selectSite(siteId) {
  const site = RADAR_SITES.find(s => s.id === siteId);
  if (!site) return;
  currentSite = site;
  map.closePopup();
  document.getElementById('currentSiteName').textContent = `${site.id} · ${site.name.split(',')[0]}`;
  // Re-render markers to highlight new active site
  placeSiteMarkers();
  // Pan to site
  map.flyTo([site.lat, site.lon], Math.max(map.getZoom(), 7), { duration: 1.2, easeLinearity: 0.5 });
  setStatus('SITE: ' + site.id + ' · ' + site.name);
  if (animating) stopAnimation();
  else loadRadarLayer();
}

/* ════════════════════════════════════════════════
   SITE PANEL
════════════════════════════════════════════════ */
let sitePanelOpen = false;

function toggleSitePanel() {
  sitePanelOpen ? closeSitePanel() : openSitePanel();
}
function openSitePanel() {
  sitePanelOpen = true;
  renderSiteList('');
  document.getElementById('sitePanel').classList.add('visible');
  document.getElementById('radarSiteBtn').setAttribute('aria-expanded', 'true');
  document.getElementById('siteSearch').value = '';
  setTimeout(() => document.getElementById('siteSearch').focus(), 200);
}
function closeSitePanel() {
  sitePanelOpen = false;
  document.getElementById('sitePanel').classList.remove('visible');
  document.getElementById('radarSiteBtn').setAttribute('aria-expanded', 'false');
}

function filterSites(q) {
  renderSiteList(q);
}

function renderSiteList(query) {
  const q = query.toLowerCase().trim();
  const filtered = q
    ? RADAR_SITES.filter(s => s.id.toLowerCase().includes(q) || s.name.toLowerCase().includes(q))
    : RADAR_SITES;

  const list = document.getElementById('siteList');
  // Build with fragment for performance
  const frag = document.createDocumentFragment();
  filtered.slice(0, 80).forEach(site => {
    const div = document.createElement('div');
    div.className = 'site-item' + (site.id === currentSite.id ? ' selected' : '');
    div.innerHTML = `<span class="site-id">${site.id}</span><span class="site-name">${site.name}</span>`;
    div.addEventListener('click', () => {
      closeSitePanel();
      selectSite(site.id);
    });
    frag.appendChild(div);
  });
  list.innerHTML = '';
  list.appendChild(frag);
}

/* ════════════════════════════════════════════════
   LIGHTNING SIMULATION
   (Real lightning data requires auth — we simulate
    realistic strike patterns using Blitzortung-style
    distribution when logged-in data is unavailable.
    A comment shows how to wire in real Blitzortung websocket.)
════════════════════════════════════════════════ */
/*
  === REAL LIGHTNING DATA INTEGRATION ===
  To wire in real Blitzortung lightning data:

  const ws = new WebSocket('wss://ws.blitzortung.org/feeds/feed-1.json');
  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.lat && d.lon) addLightningStrike(d.lat, d.lon, Date.now());
  };

  This page uses simulated data when real feed is unavailable.
  Replace addSimulatedLightning() with ws feed above.
*/

function toggleLightning() {
  lightningOn = !lightningOn;
  const btn = document.getElementById('lightningBtn');
  btn.classList.toggle('active', lightningOn);
  btn.setAttribute('aria-pressed', String(lightningOn));

  if (lightningOn) {
    startLightning();
    setStatus('⚡ LIGHTNING STRIKES ENABLED · SIMULATED');
  } else {
    stopLightning();
    setStatus('⚡ LIGHTNING OFF');
  }
}

function startLightning() {
  // Seed with initial burst
  for (let i = 0; i < 12; i++) addSimulatedLightning(true);
  lightningInterval = setInterval(addSimulatedLightning, 1800 + Math.random() * 1400);
}

function stopLightning() {
  clearInterval(lightningInterval);
  lightningInterval = null;
  lightningMarkers.forEach(m => m.remove());
  lightningMarkers = [];
}

function addSimulatedLightning(seed = false) {
  // Simulate in storm-prone areas of the US
  // Distributed toward the central plains, Gulf Coast, SE
  const clusters = [
    { lat:35+Math.random()*8,  lon:-102+Math.random()*12 },  // Great Plains
    { lat:30+Math.random()*6,  lon:-91+Math.random()*10  },  // Gulf Coast
    { lat:33+Math.random()*5,  lon:-84+Math.random()*8   },  // SE
    { lat:28+Math.random()*5,  lon:-81+Math.random()*6   },  // Florida
    { lat:40+Math.random()*4,  lon:-88+Math.random()*8   },  // Midwest
    { lat:38+Math.random()*4,  lon:-95+Math.random()*6   },  // Kansas/Missouri
  ];
  const c = clusters[Math.floor(Math.random() * clusters.length)];
  addLightningStrike(c.lat + (Math.random()-0.5)*2, c.lon + (Math.random()-0.5)*2, seed ? Date.now() - Math.random()*480000 : Date.now());
}

function addLightningStrike(lat, lon, timestamp) {
  const age = Date.now() - timestamp;
  const ageMin = age / 60000;

  let ageClass = '';
  if (ageMin > 10) ageClass = 'very-old';
  else if (ageMin > 5) ageClass = 'old';

  const icon = L.divIcon({
    className: 'lightning-marker',
    html: `<div class="lightning-dot ${ageClass}"></div>`,
    iconSize: [8, 8],
    iconAnchor: [4, 4],
  });

  const marker = L.marker([lat, lon], { icon, interactive: false, zIndexOffset: -100 });
  marker.addTo(map);
  lightningMarkers.push(marker);
  marker._ltgTime = timestamp;

  // Remove after 8 seconds (matches CSS animation)
  setTimeout(() => {
    marker.remove();
    lightningMarkers = lightningMarkers.filter(m => m !== marker);
  }, 8000);

  // Keep old markers cleaned up
  if (lightningMarkers.length > 80) {
    const oldest = lightningMarkers.shift();
    oldest.remove();
  }
}

/* ════════════════════════════════════════════════
   AUTO REFRESH (every 2 minutes while visible)
════════════════════════════════════════════════ */
let refreshTimer;
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    if (!animating && !document.hidden) {
      loadRadarLayer();
    }
    scheduleRefresh();
  }, 120000 + Math.random() * 15000); // 2–2.25 min with jitter
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !animating) {
    loadRadarLayer();
    scheduleRefresh();
  }
});

/* ════════════════════════════════════════════════
   STATUS BAR HELPERS
════════════════════════════════════════════════ */
function setStatus(msg, autohide = true) {
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(statusTimeout);
  if (autohide) {
    statusTimeout = setTimeout(() => el.classList.add('hidden'), 4000);
  }
}

/* ════════════════════════════════════════════════
   LOADING
════════════════════════════════════════════════ */
function showLoading(show) {
  const el = document.getElementById('loadingOverlay');
  if (show) el.classList.add('visible');
  else el.classList.remove('visible');
}

/* ════════════════════════════════════════════════
   MENU
════════════════════════════════════════════════ */
function toggleMenu() {
  const panel = document.getElementById('menuPanel');
  const btn   = document.getElementById('menuBtn');
  const open  = panel.classList.contains('open');
  panel.classList.toggle('open', !open);
  btn.setAttribute('aria-expanded', String(!open));
}
function closeMenu() {
  document.getElementById('menuPanel').classList.remove('open');
  document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
}
document.addEventListener('click', e => {
  if (!e.target.closest('#menuPanel') && !e.target.closest('#menuBtn')) closeMenu();
});

/* ════════════════════════════════════════════════
   GEOLOCATION — fly to user on load
════════════════════════════════════════════════ */
function tryGeolocate() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude: lat, longitude: lon } = pos.coords;
    // Find nearest radar site
    let nearest = RADAR_SITES[0];
    let nearestDist = Infinity;
    RADAR_SITES.forEach(site => {
      const d = Math.hypot(site.lat - lat, site.lon - lon);
      if (d < nearestDist) { nearestDist = d; nearest = site; }
    });
    currentSite = nearest;
    document.getElementById('currentSiteName').textContent =
      `${nearest.id} · ${nearest.name.split(',')[0]}`;
    placeSiteMarkers();
    map.flyTo([lat, lon], 7, { duration: 1.5 });
    setStatus('📡 NEAREST SITE: ' + nearest.id + ' · ' + nearest.name);
  }, () => {
    setStatus('📡 COMPOSITE NATIONAL RADAR');
  }, { timeout: 6000 });
}

/* ════════════════════════════════════════════════
   TOUCH — prevent map touch-action issues on iOS
════════════════════════════════════════════════ */
document.getElementById('mapContainer').style.touchAction = 'none';

/* ════════════════════════════════════════════════
   BOOT
════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  tryGeolocate();
  scheduleRefresh();
  updateLegend();

  // Init site list
  renderSiteList('');
});
</script>
