<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Wisconsin Storm Alerts Radar</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #05070d;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#map {
  width: 100%;
  height: 100%;
}

.top-bar {
  position: absolute;
  top: 15px;
  left: 15px;
  z-index: 1000;
  display: flex;
  gap: 10px;
}

.control-btn {
  background: rgba(10,10,15,.85);
  color: white;
  border: 1px solid #333;
  padding: 10px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

.control-btn:hover {
  background: rgba(30,30,40,.95);
}

.status-bar {
  position: absolute;
  bottom: 20px;
  left: 20px;
  z-index: 1000;
  background: rgba(0,0,0,.7);
  color: #00ff9d;
  padding: 10px 15px;
  border-radius: 8px;
  font-size: 14px;
}

.legend {
  position: absolute;
  right: 20px;
  bottom: 20px;
  z-index: 1000;
  background: rgba(0,0,0,.7);
  padding: 12px;
  border-radius: 10px;
  color: white;
  width: 140px;
}

.legend-bar {
  height: 16px;
  width: 100%;
  border-radius: 4px;
  margin-top: 8px;

  background: linear-gradient(
    to right,
    #00ffff,
    #00ff00,
    #ffff00,
    #ff9900,
    #ff0000,
    #ff00ff
  );
}

.legend-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font-size: 12px;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="top-bar">
  <button class="control-btn" onclick="toggleAnimation()">
    Animate
  </button>

  <button class="control-btn" onclick="location.reload()">
    Refresh
  </button>

  <button class="control-btn" onclick="goHome()">
    Home
  </button>
</div>

<div class="status-bar" id="statusBar">
  LOADING RADAR...
</div>

<div class="legend">
  <div>Reflectivity</div>

  <div class="legend-bar"></div>

  <div class="legend-labels">
    <span>Light</span>
    <span>Heavy</span>
  </div>
</div>

<script>

const map = L.map('map', {
  center: [44.5, -89.5],
  zoom: 6,
  zoomControl: true
});

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }
).addTo(map);

let radarLayer;
let frames = [];
let frameIndex = 0;
let animationTimer = null;
let animating = false;

async function loadRadar() {

  try {

    document.getElementById('statusBar').innerText =
      'FETCHING RADAR FRAMES...';

    const response = await fetch(
      'https://api.rainviewer.com/public/weather-maps.json'
    );

    const data = await response.json();

    frames = data.radar.past;

    if (!frames.length) {
      throw new Error('No radar frames');
    }

    frameIndex = frames.length - 1;

    showFrame(frameIndex);

  } catch (err) {

    console.error(err);

    document.getElementById('statusBar').innerText =
      'RADAR FAILED TO LOAD';

  }
}

function showFrame(index) {

  const frame = frames[index];

  if (!frame) return;

  if (radarLayer) {
    map.removeLayer(radarLayer);
  }

  radarLayer = L.tileLayer(

    `https://tilecache.rainviewer.com${frame.path}/512/{z}/{x}/{y}/6/1_1.png`,

    {
      tileSize: 512,
      opacity: 0.85,
      zoomOffset: -1
    }

  );

  radarLayer.addTo(map);

  const time = new Date(frame.time * 1000);

  document.getElementById('statusBar').innerText =
    `RADAR LIVE • ${time.toLocaleTimeString()}`;
}

function toggleAnimation() {

  if (animating) {

    clearInterval(animationTimer);

    animating = false;

    document.getElementById('statusBar').innerText =
      'ANIMATION STOPPED';

    return;
  }

  animating = true;

  animationTimer = setInterval(() => {

    frameIndex++;

    if (frameIndex >= frames.length) {
      frameIndex = 0;
    }

    showFrame(frameIndex);

  }, 700);
}

function goHome() {
  window.location.href = 'index.html';
}

loadRadar();

</script>

</body>
</html>
