<!DOCTYPE html>
<html>
<head>
<title>Live Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:34px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:12px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:18px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

#map{
height:85vh;
width:100%;
}

.controls{
margin:10px;
}

button{
padding:10px 16px;
margin:5px;
border:none;
border-radius:6px;
background:#2563eb;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

</style>
</head>

<body>

<header>
Live Radar
</header>

<nav>
<a href="index.html">Home</a>
<a href="radar.html">Radar</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="controls">

<button onclick="setRadar('reflectivity')">Reflectivity</button>
<button onclick="setRadar('velocity')">Velocity</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map
let radarLayer

function initMap(lat,lon){

map=L.map('map').setView([lat,lon],7)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:10
}).addTo(map)

setRadar("reflectivity")

}

function setRadar(type){

if(radarLayer){
map.removeLayer(radarLayer)
}

if(type==="reflectivity"){

radarLayer=L.tileLayer(
'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q/{z}/{x}/{y}.png',
{opacity:0.7}
)

}

if(type==="velocity"){

radarLayer=L.tileLayer(
'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0u/{z}/{x}/{y}.png',
{opacity:0.7}
)

}

radarLayer.addTo(map)

}

navigator.geolocation.getCurrentPosition(pos=>{

initMap(pos.coords.latitude,pos.coords.longitude)

})

</script>

</body>
</html>
