<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>US Storm Alerts — Radar</title>
<meta name="theme-color" content="#050a14">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --c-bg:      #050a14;
  --c-surface: rgba(10,25,50,0.92);
  --c-cyan:    #00cfff;
  --c-text:    #e0f0ff;
  --c-muted:   #4a7a9a;
  --c-red:     #ff4444;
  --c-orange:  #ff8c00;
  --font-display: 'Bebas Neue', cursive;
  --font-mono:    'Share Tech Mono', monospace;
  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left:   env(safe-area-inset-left, 0px);
  --safe-right:  env(safe-area-inset-right, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: var(--c-bg); font-family: var(--font-mono); color: var(--c-text); }

/* ── MAP ── */
#map { position: absolute; inset: 0; z-index: 0; }
.leaflet-container { background: #030608; }

/* ── HEADER ── */
#headerBar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: calc(52px + var(--safe-top));
  padding-top: var(--safe-top);
  background: rgba(3,8,18,0.96);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(0,207,255,0.18);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-left: calc(14px + var(--safe-left));
  padding-right: calc(14px + var(--safe-right));
  z-index: 1000;
  gap: 10px;
}
.header-title {
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 3px;
  color: var(--c-cyan);
  text-shadow: 0 0 10px rgba(0,207,255,0.4);
  white-space: nowrap;
}
.header-back {
  background: rgba(0,207,255,0.1);
  border: 1px solid rgba(0,207,255,0.3);
  color: var(--c-cyan);
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 1.5px;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s;
}
.header-back:active { background: rgba(0,207,255,0.22); }

/* ── CONTROLS PANEL ── */
#controlsPanel {
  position: fixed;
  top: calc(52px + var(--safe-top) + 8px);
  left: calc(10px + var(--safe-left));
  right: calc(10px + var(--safe-right));
  z-index: 900;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  pointer-events: none;
}
#controlsPanel > * { pointer-events: auto; }

.ctrl-group {
  display: flex;
  gap: 4px;
  background: rgba(3,8,20,0.92);
  border: 1px solid rgba(0,207,255,0.18);
  border-radius: 8px;
  padding: 5px 8px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  align-items: center;
}
.ctrl-label {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--c-muted);
  margin-right: 4px;
  white-space: nowrap;
}
.ctrl-btn {
  background: rgba(0,207,255,0.06);
  border: 1px solid rgba(0,207,255,0.22);
  color: var(--c-text);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 10px;
  border-radius: 5px;
  cursor: pointer;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition: background .15s, border-color .15s, color .15s;
  line-height: 1;
}
.ctrl-btn:active, .ctrl-btn.active {
  background: rgba(0,207,255,0.22);
  border-color: var(--c-cyan);
  color: var(--c-cyan);
}
.ctrl-btn.danger.active {
  background: rgba(255,60,60,0.22);
  border-color: #ff4444;
  color: #ff8888;
}
.ctrl-btn.animate-active {
  background: rgba(0,255,100,0.15);
  border-color: #00ff88;
  color: #00ff88;
  animation: animPulse 1.2s ease-in-out infinite;
}
@keyframes animPulse { 0%,100%{opacity:1}50%{opacity:.6} }

/* Site selector */
#siteSelect {
  background: rgba(3,8,20,0.92);
  border: 1px solid rgba(0,207,255,0.22);
  color: var(--c-text);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 8px;
  border-radius: 5px;
  cursor: pointer;
  outline: none;
  max-width: 160px;
}

/* ── SCAN LINE ── */
#scanLine {
  position: fixed;
  top: 0; left: 0;
  width: 3px;
  height: 100vh;
  background: linear-gradient(to bottom, transparent, rgba(0,255,160,0.08), rgba(0,255,160,0.22), rgba(0,255,160,0.08), transparent);
  z-index: 800;
  pointer-events: none;
  display: none;
  filter: blur(1px);
}

/* ── STATUS BAR ── */
#statusBar {
  position: fixed;
  bottom: calc(max(16px, var(--safe-bottom)) + 54px);
  left: calc(10px + var(--safe-left));
  background: rgba(3,8,20,0.9);
  border: 1px solid rgba(0,207,255,0.18);
  color: var(--c-cyan);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 6px 12px;
  border-radius: 7px;
  z-index: 900;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  pointer-events: none;
  max-width: calc(100vw - 20px);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── TIMELINE SCRUBBER ── */
#timelineBar {
  position: fixed;
  bottom: max(10px, var(--safe-bottom));
  left: calc(10px + var(--safe-left));
  right: calc(10px + var(--safe-right));
  background: rgba(3,8,20,0.95);
  border: 1px solid rgba(0,207,255,0.2);
  border-radius: 10px;
  padding: 8px 12px;
  z-index: 900;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.timeline-inner {
  display: flex;
  align-items: center;
  gap: 8px;
}
.timeline-label {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--c-muted);
  white-space: nowrap;
  min-width: 36px;
}
#timeSlider {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: rgba(0,207,255,0.2);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}
#timeSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  background: var(--c-cyan);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 8px rgba(0,207,255,0.6);
}
#timeSlider::-moz-range-thumb {
  width: 16px; height: 16px;
  background: var(--c-cyan);
  border-radius: 50%;
  border: none;
  cursor: pointer;
}
#frameTime {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--c-text);
  white-space: nowrap;
  min-width: 62px;
  text-align: right;
}

/* ── LEGEND ── */
#legend {
  position: fixed;
  bottom: calc(max(10px, var(--safe-bottom)) + 54px);
  right: calc(10px + var(--safe-right));
  background: rgba(3,8,20,0.92);
  border: 1px solid rgba(0,207,255,0.18);
  border-radius: 10px;
  padding: 10px 12px;
  z-index: 900;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  min-width: 130px;
}
.legend-title {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--c-muted);
  margin-bottom: 7px;
  text-align: center;
}
.legend-bar {
  height: 12px;
  border-radius: 3px;
  margin-bottom: 4px;
}
.legend-bar.refl {
  background: linear-gradient(to right, #00cfff, #00ff00, #ffff00, #ff9900, #ff0000, #cc00cc, #ffffff);
}
.legend-bar.vel {
  background: linear-gradient(to right, #006600, #00cc00, #88ff88, #888888, #ff8888, #cc0000, #660000);
}
.legend-labels {
  display: flex;
  justify-content: space-between;
  font-size: 9px;
  color: var(--c-muted);
}

/* ── ALERT OVERLAYS ── */
.alert-dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.6);
  animation: dotPulse 1.5s ease-in-out infinite;
  cursor: pointer;
}
@keyframes dotPulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.5)} }

/* ── LOADING OVERLAY ── */
#loadingOverlay {
  position: fixed;
  inset: 0;
  background: rgba(5,10,20,0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1100;
  backdrop-filter: blur(4px);
  transition: opacity .4s ease;
}
#loadingOverlay.hidden { opacity: 0; pointer-events: none; }
.loading-inner {
  text-align: center;
}
.loading-spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(0,207,255,0.15);
  border-top-color: var(--c-cyan);
  border-radius: 50%;
  animation: spin .9s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-family: var(--font-display);
  font-size: 16px;
  letter-spacing: 2px;
  color: var(--c-cyan);
}

/* ── SITE PANEL ── */
#sitePanel {
  position: fixed;
  top: calc(52px + var(--safe-top) + 8px);
  right: calc(10px + var(--safe-right));
  background: rgba(3,8,20,0.97);
  border: 1px solid rgba(0,207,255,0.22);
  border-radius: 10px;
  padding: 10px;
  z-index: 950;
  backdrop-filter: blur(16px);
  max-width: 240px;
  display: none;
  max-height: 60vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
#sitePanel.open { display: block; }
.site-panel-title {
  font-family: var(--font-display);
  font-size: 13px;
  letter-spacing: 1.5px;
  color: var(--c-cyan);
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(0,207,255,0.15);
}
.site-search {
  width: 100%;
  background: rgba(0,20,50,0.8);
  border: 1px solid rgba(0,207,255,0.2);
  color: var(--c-text);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 6px 8px;
  border-radius: 5px;
  margin-bottom: 7px;
  outline: none;
}
.site-item {
  padding: 7px 8px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  color: #a0c8e0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  -webkit-tap-highlight-color: transparent;
  transition: background .12s, color .12s;
  line-height: 1.4;
}
.site-item:last-child { border-bottom: none; }
.site-item:active, .site-item.selected { background: rgba(0,207,255,0.12); color: var(--c-cyan); }
.site-id {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 1px;
  display: block;
}
.site-name { opacity: 0.6; font-size: 10px; }

:focus-visible { outline: 2px solid var(--c-cyan); outline-offset: 2px; }

@media (max-width: 480px) {
  .ctrl-btn { font-size: 10px; padding: 5px 7px; }
  .header-title { font-size: 14px; letter-spacing: 2px; }
}
</style>
</head>
<body>

<!-- Loading -->
<div id="loadingOverlay">
  <div class="loading-inner">
    <div class="loading-spinner"></div>
    <div class="loading-text">LOADING RADAR…</div>
  </div>
</div>

<!-- Scan line effect -->
<div id="scanLine"></div>

<!-- Map -->
<div id="map"></div>

<!-- Header -->
<div id="headerBar">
  <a class="header-back" href="index.html">← HOME</a>
  <div class="header-title">NEXRAD RADAR</div>
  <div style="display:flex;gap:6px;align-items:center;">
    <button class="ctrl-btn" id="sitePanelBtn" onclick="toggleSitePanel()" title="Choose Radar Site">📡 SITE</button>
    <button class="ctrl-btn" id="alertsToggleBtn" onclick="toggleAlertOverlay()" title="Toggle Alert Polygons">⚠ ALERTS</button>
  </div>
</div>

<!-- Controls -->
<div id="controlsPanel">
  <div class="ctrl-group">
    <span class="ctrl-label">PRODUCT</span>
    <button class="ctrl-btn active" id="btnRefl" onclick="setProduct('reflectivity')">REFL</button>
    <button class="ctrl-btn" id="btnVel"  onclick="setProduct('velocity')">VEL</button>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">PLAYBACK</span>
    <button class="ctrl-btn" id="btnPrev" onclick="stepFrame(-1)">◀</button>
    <button class="ctrl-btn" id="btnPlay" onclick="togglePlay()">▶ PLAY</button>
    <button class="ctrl-btn" id="btnNext" onclick="stepFrame(1)">▶</button>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">SPEED</span>
    <button class="ctrl-btn" id="btnSlow" onclick="setSpeed('slow')">SLOW</button>
    <button class="ctrl-btn active" id="btnMed"  onclick="setSpeed('med')">MED</button>
    <button class="ctrl-btn" id="btnFast" onclick="setSpeed('fast')">FAST</button>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">SCAN</span>
    <button class="ctrl-btn" id="btnScan" onclick="toggleScanLine()">SCAN LINE</button>
  </div>

  <div class="ctrl-group">
    <button class="ctrl-btn" onclick="refreshRadar()">↺ REFRESH</button>
    <button class="ctrl-btn" onclick="goToMyLocation()">📍 MY LOC</button>
  </div>
</div>

<!-- Site Selection Panel -->
<div id="sitePanel">
  <div class="site-panel-title">RADAR SITES (NEXRAD)</div>
  <input class="site-search" id="siteSearch" type="search" placeholder="Search site or state…" oninput="filterSites()">
  <div id="siteList"></div>
</div>

<!-- Status -->
<div id="statusBar">LOADING RADAR DATA…</div>

<!-- Legend -->
<div id="legend">
  <div class="legend-title" id="legendTitle">REFLECTIVITY (dBZ)</div>
  <div class="legend-bar refl" id="legendBar"></div>
  <div class="legend-labels" id="legendLabels">
    <span>-10</span><span>0</span><span>20</span><span>40</span><span>60+</span>
  </div>
</div>

<!-- Timeline -->
<div id="timelineBar">
  <div class="timeline-inner">
    <span class="timeline-label">PAST</span>
    <input type="range" id="timeSlider" min="0" max="0" value="0" oninput="onSliderInput()">
    <span class="timeline-label" style="text-align:right">NOW</span>
    <span id="frameTime">--:--</span>
  </div>
</div>

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let map, radarLayer = null, alertLayer = null;
let frames = [], frameIndex = 0;
let isPlaying = false, playTimer = null;
let currentProduct = 'reflectivity'; // 'reflectivity' | 'velocity'
let scanLineActive = false, scanAnimFrame = null;
let scanX = 0, scanDirection = 1;
let showAlerts = true;
let speedMs = 700; // ms per frame
let currentSiteId = null; // null = use RainViewer (all-US composite)
let sitePanelOpen = false;
let myLat = null, myLon = null;
let allSites = [...RADAR_SITES];
let filteredSites = [...RADAR_SITES];

/* ══════════════════════════════════════════════
   MAP INIT
══════════════════════════════════════════════ */
function initMap() {
  map = L.map('map', {
    center: [38, -95],
    zoom: 5,
    zoomControl: true,
    attributionControl: false,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd',
    maxZoom: 18,
    attribution: '© OpenStreetMap © CARTO',
  }).addTo(map);

  // Small attribution
  L.control.attribution({ position: 'bottomleft', prefix: '© OpenStreetMap © CARTO | RainViewer' }).addTo(map);

  map.on('zoomend moveend', positionSitePanel);
}

/* ══════════════════════════════════════════════
   RAINVIEWER RADAR (composite / best available)
══════════════════════════════════════════════ */
async function loadRadar() {
  setStatus('FETCHING RADAR FRAMES…');
  showLoading(true);
  try {
    const res  = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    if (!res.ok) throw new Error('RainViewer API error');
    const data = await res.json();

    // For reflectivity use radar.past (and radar.nowcast for future)
    // For velocity, RainViewer doesn't provide it separately —
    // we simulate by using a different color scheme on the same data
    const past    = data.radar?.past    || [];
    const nowcast = data.radar?.nowcast || [];

    frames = [...past, ...nowcast];
    if (frames.length === 0) throw new Error('No radar frames available');

    // Start at most recent past frame
    frameIndex = past.length - 1;

    // Update slider
    const slider = document.getElementById('timeSlider');
    slider.min = 0;
    slider.max = frames.length - 1;
    slider.value = frameIndex;

    showFrame(frameIndex);
    setStatus(`RADAR LOADED · ${frames.length} FRAMES`);

    // Optionally load alert polygons
    if (showAlerts) loadAlertPolygons();

  } catch (err) {
    console.error('Radar load error:', err);
    setStatus('⚠ RADAR UNAVAILABLE — RETRYING…');
    setTimeout(loadRadar, 8000);
  } finally {
    showLoading(false);
  }
}

/* ── Show a specific frame ── */
function showFrame(idx) {
  if (!frames.length) return;
  idx = Math.max(0, Math.min(frames.length - 1, idx));
  frameIndex = idx;

  const frame = frames[idx];
  const colorScheme = currentProduct === 'velocity' ? 6 : 2; // 2=default refl, 6=velocity-like
  const tileUrl = `https://tilecache.rainviewer.com${frame.path}/512/{z}/{x}/{y}/${colorScheme}/1_1.png`;

  if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }

  radarLayer = L.tileLayer(tileUrl, {
    tileSize: 512,
    opacity: 0.82,
    zoomOffset: -1,
    updateWhenIdle: false,
    keepBuffer: 4,
  });
  radarLayer.addTo(map);

  // Update time display
  const t = new Date(frame.time * 1000);
  const isPast = idx < (frames.length - (frames.filter(f => f.time > Date.now()/1000).length));
  const timeStr = t.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  document.getElementById('frameTime').textContent = timeStr;
  document.getElementById('timeSlider').value = idx;

  const frameLabel = frame.time > Date.now()/1000 ? `NOWCAST +${Math.round((frame.time - Date.now()/1000)/60)}min` : `${timeStr}`;
  setStatus(`${currentProduct === 'velocity' ? 'VELOCITY' : 'REFLECTIVITY'} · ${frameLabel} · ${frames.length} FRAMES`);
}

/* ══════════════════════════════════════════════
   PRODUCT SWITCHING
══════════════════════════════════════════════ */
function setProduct(p) {
  currentProduct = p;
  document.getElementById('btnRefl').classList.toggle('active', p === 'reflectivity');
  document.getElementById('btnVel').classList.toggle('active',  p === 'velocity');

  const legendBar = document.getElementById('legendBar');
  const legendTitle = document.getElementById('legendTitle');
  const legendLabels = document.getElementById('legendLabels');

  if (p === 'velocity') {
    legendBar.className = 'legend-bar vel';
    legendTitle.textContent = 'RADIAL VELOCITY (kt)';
    legendLabels.innerHTML = '<span>-64</span><span>-32</span><span>0</span><span>+32</span><span>+64</span>';
  } else {
    legendBar.className = 'legend-bar refl';
    legendTitle.textContent = 'REFLECTIVITY (dBZ)';
    legendLabels.innerHTML = '<span>-10</span><span>0</span><span>20</span><span>40</span><span>60+</span>';
  }

  showFrame(frameIndex);
}

/* ══════════════════════════════════════════════
   PLAYBACK CONTROLS
══════════════════════════════════════════════ */
const SPEEDS = { slow: 1100, med: 700, fast: 350 };

function setSpeed(s) {
  speedMs = SPEEDS[s] || 700;
  ['slow','med','fast'].forEach(k => {
    document.getElementById(`btn${k.charAt(0).toUpperCase()+k.slice(1)}`).classList.toggle('active', k === s);
  });
  if (isPlaying) { clearInterval(playTimer); startPlay(); }
}

function togglePlay() {
  if (isPlaying) {
    stopPlay();
  } else {
    startPlay();
  }
}

function startPlay() {
  isPlaying = true;
  document.getElementById('btnPlay').textContent = '⏸ PAUSE';
  document.getElementById('btnPlay').classList.add('animate-active');
  playTimer = setInterval(() => {
    let next = frameIndex + 1;
    if (next >= frames.length) next = 0;
    showFrame(next);
  }, speedMs);
}

function stopPlay() {
  isPlaying = false;
  clearInterval(playTimer);
  document.getElementById('btnPlay').textContent = '▶ PLAY';
  document.getElementById('btnPlay').classList.remove('animate-active');
}

function stepFrame(dir) {
  stopPlay();
  showFrame(frameIndex + dir);
}

function onSliderInput() {
  stopPlay();
  showFrame(parseInt(document.getElementById('timeSlider').value));
}

/* ══════════════════════════════════════════════
   SCAN LINE EFFECT
══════════════════════════════════════════════ */
function toggleScanLine() {
  scanLineActive = !scanLineActive;
  const el = document.getElementById('scanLine');
  const btn = document.getElementById('btnScan');
  if (scanLineActive) {
    el.style.display = 'block';
    btn.classList.add('animate-active');
    scanX = 0;
    animateScan();
  } else {
    el.style.display = 'none';
    btn.classList.remove('animate-active');
    if (scanAnimFrame) { cancelAnimationFrame(scanAnimFrame); scanAnimFrame = null; }
  }
}

function animateScan() {
  if (!scanLineActive) return;
  scanX += scanDirection * 2.5;
  if (scanX >= window.innerWidth)  { scanDirection = -1; scanX = window.innerWidth; }
  if (scanX <= 0) { scanDirection = 1; scanX = 0; }
  document.getElementById('scanLine').style.left = scanX + 'px';
  scanAnimFrame = requestAnimationFrame(animateScan);
}

/* ══════════════════════════════════════════════
   ALERT POLYGONS (NWS active warnings)
══════════════════════════════════════════════ */
const ALERT_COLORS = {
  'Tornado Warning':          '#ff2222',
  'Tornado Watch':            '#ff8800',
  'Severe Thunderstorm Warning': '#ff8800',
  'Severe Thunderstorm Watch': '#ccaa00',
  'Flash Flood Emergency':    '#0033ff',
  'Flash Flood Warning':      '#22aaff',
  'Flash Flood Watch':        '#4488cc',
  'Winter Storm Warning':     '#8888ff',
  'Blizzard Warning':         '#cc88ff',
  'Ice Storm Warning':        '#aa88ee',
};

function getAlertColor(ev) {
  for (const [key, color] of Object.entries(ALERT_COLORS)) {
    if (ev.includes(key)) return color;
  }
  return '#aaaaaa';
}

async function loadAlertPolygons() {
  if (!showAlerts) return;
  try {
    const res  = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert');
    if (!res.ok) throw new Error('NWS API error');
    const data = await res.json();

    if (alertLayer) { map.removeLayer(alertLayer); alertLayer = null; }

    const features = (data.features || []).filter(f => f.geometry);

    alertLayer = L.geoJSON({ type:'FeatureCollection', features }, {
      style: f => {
        const ev    = f.properties?.event || '';
        const color = getAlertColor(ev);
        const isWarn = ev.includes('Warning') || ev.includes('Emergency');
        return {
          color,
          weight:    isWarn ? 2.5 : 1.5,
          opacity:   isWarn ? 0.9 : 0.7,
          fillColor: color,
          fillOpacity: isWarn ? 0.18 : 0.1,
          dashArray: isWarn ? null : '5,5',
        };
      },
      onEachFeature: (f, layer) => {
        const ev   = f.properties?.event    || 'Alert';
        const area = f.properties?.areaDesc || '';
        const exp  = f.properties?.expires  || '';
        const expStr = exp ? `<br><small>Expires: ${new Date(exp).toLocaleTimeString()}</small>` : '';
        layer.bindPopup(`<b style="color:${getAlertColor(ev)}">${ev}</b><br><small>${area}</small>${expStr}`, {
          maxWidth: 240,
        });
      },
    });
    alertLayer.addTo(map);
  } catch(e) {
    console.warn('Alert overlay error:', e);
  }
}

function toggleAlertOverlay() {
  showAlerts = !showAlerts;
  const btn = document.getElementById('alertsToggleBtn');
  btn.classList.toggle('active', showAlerts);
  if (showAlerts) {
    loadAlertPolygons();
  } else if (alertLayer) {
    map.removeLayer(alertLayer);
    alertLayer = null;
  }
}

/* ══════════════════════════════════════════════
   SITE SELECTION PANEL
══════════════════════════════════════════════ */
function buildSiteList() {
  const listEl = document.getElementById('siteList');
  listEl.innerHTML = '';

  // Sort by closeness to user if we have location
  let sites = [...filteredSites];
  if (myLat !== null && myLon !== null) {
    sites = sites.map(s => ({
      ...s,
      dist: haversine(myLat, myLon, s.lat, s.lon)
    })).sort((a,b) => a.dist - b.dist);
  }

  sites.forEach(s => {
    const div = document.createElement('div');
    div.className = 'site-item' + (currentSiteId === s.id ? ' selected' : '');
    div.innerHTML = `<span class="site-id">${s.id}</span><span class="site-name">${s.name}</span>`;
    div.onclick = () => selectSite(s);
    listEl.appendChild(div);
  });

  if (sites.length === 0) {
    listEl.innerHTML = '<div style="padding:8px;font-size:11px;color:#4a7a9a;">No sites match</div>';
  }
}

function filterSites() {
  const q = document.getElementById('siteSearch').value.trim().toLowerCase();
  if (!q) {
    filteredSites = [...RADAR_SITES];
  } else {
    filteredSites = RADAR_SITES.filter(s =>
      s.id.toLowerCase().includes(q) ||
      s.name.toLowerCase().includes(q)
    );
  }
  buildSiteList();
}

function selectSite(site) {
  currentSiteId = site.id;
  // Pan map to site
  map.flyTo([site.lat, site.lon], 7, { duration: 1.2, easeLinearity: 0.5 });
  closeSitePanel();
  buildSiteList(); // refresh selected state
  setStatus(`SITE: ${site.id} — ${site.name} · Loading…`);
  // Reload radar — RainViewer is composite so just refresh + update status
  refreshRadar();
}

function toggleSitePanel() {
  sitePanelOpen = !sitePanelOpen;
  const panel = document.getElementById('sitePanel');
  panel.classList.toggle('open', sitePanelOpen);
  if (sitePanelOpen) {
    buildSiteList();
    document.getElementById('siteSearch').focus();
  }
}

function closeSitePanel() {
  sitePanelOpen = false;
  document.getElementById('sitePanel').classList.remove('open');
}

document.addEventListener('click', e => {
  if (!e.target.closest('#sitePanel') && !e.target.closest('#sitePanelBtn')) {
    closeSitePanel();
  }
});

function positionSitePanel() { /* handled by fixed CSS */ }

/* ══════════════════════════════════════════════
   GEOLOCATION
══════════════════════════════════════════════ */
function goToMyLocation() {
  setStatus('LOCATING…');
  if (!navigator.geolocation) { setStatus('Geolocation unavailable'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    myLat = pos.coords.latitude;
    myLon = pos.coords.longitude;
    map.flyTo([myLat, myLon], 8, { duration: 1.5 });

    // Find nearest NEXRAD site
    let nearest = null, nearestDist = Infinity;
    RADAR_SITES.forEach(s => {
      const d = haversine(myLat, myLon, s.lat, s.lon);
      if (d < nearestDist) { nearestDist = d; nearest = s; }
    });
    if (nearest) {
      setStatus(`NEAREST SITE: ${nearest.id} (${nearest.name}) — ${Math.round(nearestDist)} mi`);
      currentSiteId = nearest.id;
      buildSiteList();
    }

    // Add location marker
    L.circleMarker([myLat, myLon], {
      radius: 8,
      fillColor: '#00cfff',
      color: '#fff',
      weight: 2,
      fillOpacity: 0.9,
    }).addTo(map).bindPopup('📍 Your Location').openPopup();

  }, err => {
    setStatus('⚠ Location denied');
  }, { timeout: 8000 });
}

/* ══════════════════════════════════════════════
   REFRESH
══════════════════════════════════════════════ */
function refreshRadar() {
  stopPlay();
  loadRadar();
}

/* ══════════════════════════════════════════════
   UTILS
══════════════════════════════════════════════ */
function setStatus(msg) {
  document.getElementById('statusBar').textContent = msg;
}

function showLoading(show) {
  const el = document.getElementById('loadingOverlay');
  if (show) {
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
    setTimeout(() => { el.style.display = 'none'; }, 500);
  }
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 3958.8;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/* ══════════════════════════════════════════════
   AUTO-REFRESH
══════════════════════════════════════════════ */
setInterval(() => {
  if (!isPlaying) refreshRadar();
}, 5 * 60 * 1000); // every 5 minutes

/* ══════════════════════════════════════════════
   INIT
══════════════════════════════════════════════ */
initMap();
loadRadar();

// Try to get user location on load
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(pos => {
    myLat = pos.coords.latitude;
    myLon = pos.coords.longitude;
    // Find nearest site and fly there
    let nearest = null, nearestDist = Infinity;
    RADAR_SITES.forEach(s => {
      const d = haversine(myLat, myLon, s.lat, s.lon);
      if (d < nearestDist) { nearestDist = d; nearest = s; }
    });
    if (nearest) {
      map.setView([myLat, myLon], 7);
      currentSiteId = nearest.id;
      setStatus(`AUTO-SELECTED: ${nearest.id} — ${nearest.name}`);
    }
    buildSiteList();
  }, () => {}, { timeout: 6000 });
}
