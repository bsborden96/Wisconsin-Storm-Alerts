Checking for tornado warnings near you...
</div>

<script>

let lat
let lon

function getDirection(deg){

const dirs=["N","NE","E","SE","S","SW","W","NW"]
return dirs[Math.round(deg/45)%8]

}

async function checkTornado(){

try{

let res=await fetch(`https://api.weather.gov/alerts/active?event=Tornado Warning`)
let data=await res.json()

if(data.features.length===0){

document.getElementById("tracker").className="card safe"
document.getElementById("tracker").innerHTML=
"✔ No active tornado warnings in the United States"

return

}

let alert=data.features[0].properties

let motion=alert.parameters?.stormMotionDirection?.[0] || "Unknown"
let speed=alert.parameters?.stormMotionSpeed?.[0] || "Unknown"

let dir=getDirection(motion)

document.getElementById("tracker").className="card warning"

document.getElementById("tracker").innerHTML=`

<h2>Tornado Warning Detected</h2>

Storm Motion: ${dir} at ${speed} mph

Stay alert and monitor warnings.

`

}catch{

document.getElementById("tracker").innerHTML
