<!DOCTYPE html>
<html>
<head>
<title>Storm Environment</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:28px;
font-size:36px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:14px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:22px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.section{
max-width:700px;
margin:auto;
padding:30px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.card{
background:#111827;
padding:25px;
border-radius:12px;
}

.value{
font-size:36px;
font-weight:bold;
margin-top:5px;
}

.label{
opacity:.8;
}

</style>
</head>

<body>

<header>
Storm Environment
</header>

<nav>
<a href="index.html">Home</a>
<a href="tornado.html">Tornado Tracker</a>
<a href="environment.html">Storm Environment</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<div class="grid">

<div class="card">
<div class="label">CAPE</div>
<div id="cape" class="value">--</div>
</div>

<div class="card">
<div class="label">Wind Shear</div>
<div id="shear" class="value">--</div>
</div>

<div class="card">
<div class="label">Storm Helicity</div>
<div id="helicity" class="value">--</div>
</div>

<div class="card">
<div class="label">Lifted Index</div>
<div id="li" class="value">--</div>
</div>

</div>

</div>

<script>

let lat
let lon

async function loadEnvironment(){

try{

let point=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let pointData=await point.json()

let grid=pointData.properties.forecastGridData

let gridRes=await fetch(grid)
let data=await gridRes.json()

let cape=data.properties.convectiveAvailablePotentialEnergy?.values?.[0]?.value
let li=data.properties.liftedIndex?.values?.[0]?.value

document.getElementById("cape").innerText=Math.round(cape)+" J/kg"
document.getElementById("li").innerText=Math.round(li)

document.getElementById("shear").innerText="Loading..."
document.getElementById("helicity").innerText="Loading..."

}catch{

document.getElementById("cape").innerText="Unavailable"
document.getElementById("li").innerText="Unavailable"

}

}

navigator.geolocation.getCurrentPosition(pos=>{

lat=pos.coords.latitude
lon=pos.coords.longitude

loadEnvironment()

})

</script>

</body>
</html>
