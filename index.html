<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
    
<style>

/* BODY */
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* LOGO */
.logo{
width:300px;
max-width:96vw;
height:auto;
display:block;
margin:20px auto 10px auto;
}

/* MENU */
.menuIcon{
position:fixed;
top:20px;
left:15px;
font-size:70px;
cursor:pointer;
z-index:999999;
}

.menuPanel{
display:none;
position:fixed;
top:90px;
left:15px;
background:#111827;
border-radius:14px;
padding:20px;
z-index:999999;
min-width:220px;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:26px;
padding:14px;
font-weight:bold;
}

/* TICKER */
.tickerWrap{
background:#7a0000;
overflow:hidden;
white-space:nowrap;
padding:12px 0;
}

.ticker{
display:inline-block;
white-space:nowrap;
font-size:20px;
animation:scroll 50s linear infinite; /* 🔥 FIXED SPEED */
}

@keyframes scroll{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* SEARCH */
.searchBox{
margin:30px auto;
max-width:600px;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:22px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:260px;
overflow-y:auto;
font-size:20px;
z-index:9999;
}

.suggestions div{
padding:12px;
cursor:pointer;
}

.suggestions div:hover{
background:#374151;
}

/* LAYOUT */
.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.locationCard{
background:#111827;
padding:36px;
border-radius:14px;
}

/* RISK */
.riskBox{
margin-top:20px;
padding:20px;
border-radius:10px;
font-size:28px;
font-weight:bold;
}

.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}

/* WEATHER */
.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
margin-top:30px;
}

.weatherCard{
background:#0f172a;
padding:28px;
border-radius:12px;
}

.weatherValue{
font-size:48px;
font-weight:bold;
}

/* ALERTS */
.card{
background:#111;
padding:22px;
margin-top:16px;
border-radius:12px;
cursor:pointer;
font-size:22px;
}

</style>
</head>

<body>

<!-- MENU -->
<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html" onclick="toggleMenu()">Home</a>
<a href="tracking.html" onclick="toggleMenu()">Storm Tracker</a>
<a href="winter.html" onclick="toggleMenu()">Winter Center</a>
</div>

<!-- LOGO -->
<img src="logo.PNG" class="logo">

<!-- TICKER -->
<div class="tickerWrap">
<div id="ticker" class="ticker">⚠ Loading U.S. weather alerts…</div>
</div>

<!-- SEARCH -->
<div class="searchBox">
<input id="searchInput" placeholder="Search any US city, town, or village">
<div id="suggestions" class="suggestions"></div>
</div>

<!-- LOCATION -->
<div class="section">
<div id="locationCard" class="locationCard">Detecting location...</div>
<div id="riskLevel" class="riskBox low">Severe Weather Risk: LOW</div>
</div>

<!-- WEATHER -->
<div class="section">
<h2>Current Conditions</h2>

<div class="weatherGrid">
<div class="weatherCard">Temperature<div id="temp" class="weatherValue">--</div></div>
<div class="weatherCard">Humidity<div id="humidity" class="weatherValue">--</div></div>
<div class="weatherCard">Dew Point<div id="dew" class="weatherValue">--</div></div>
<div class="weatherCard">Wind<div id="wind" class="weatherValue">--</div></div>
</div>
</div>

<!-- ALERTS -->
<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

/* MENU */
function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

/* 🔥 LOAD TICKER IMMEDIATELY */
loadTicker()

/* GEO */
let lat, lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
refreshAll()
})

function refreshAll(){
loadLocation()
loadWeather()
loadAlerts()
}

/* SEARCH */
let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")

input.addEventListener("input", async () => {
let q=input.value.trim()
if(q.length<2){suggestions.innerHTML="";return}

let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=us&limit=8`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(place=>{
let div=document.createElement("div")
div.innerText=place.display_name

div.onclick=()=>{
lat=parseFloat(place.lat)
lon=parseFloat(place.lon)
input.value=place.display_name
suggestions.innerHTML=""
refreshAll()
}

suggestions.appendChild(div)
})
})

async function loadLocation(){
let point=await fetch(`https://api.weather.gov/points/${lat},${lon}`,{
headers:{"User-Agent":"StormApp (test@test.com)"}
})
let pointData=await point.json()

let city=pointData.properties.relativeLocation.properties.city
let state=pointData.properties.relativeLocation.properties.state

let countyRes=await fetch(pointData.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

document.getElementById("locationCard").innerHTML=
`<div style="font-size:48px;font-weight:bold;">${county} County</div>
<div style="font-size:26px;">${city}, ${state}</div>`
}

async function loadWeather(){
let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let data=await res.json()

let c=data.current

document.getElementById("temp").innerText=Math.round(c.temperature_2m)+"°F"
document.getElementById("dew").innerText=Math.round(c.dewpoint_2m)+"°F"
document.getElementById("humidity").innerText=c.relative_humidity_2m+"%"
document.getElementById("wind").innerText=Math.round(c.wind_speed_10m)+" mph"
}

async function loadAlerts(){
let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`,{
headers:{"User-Agent":"StormApp (test@test.com)"}
})
let data=await res.json()

let html=""
let risk="low"

data.features.forEach(a=>{
let e=a.properties.event

if(e.includes("Tornado")) risk="high"
else if(e.includes("Severe")) risk="medium"

html+=`<div class="card">${e}</div>`
})

document.getElementById("alerts").innerHTML=html || "No alerts"
updateRisk(risk)
}

/* 🔥 TICKER */
async function loadTicker(){

try{

let res=await fetch("https://api.weather.gov/alerts/active",{
headers:{"User-Agent":"StormApp (test@test.com)"}
})

let data=await res.json()

let items=[]

data.features.forEach(a=>{
let e=a.properties.event || ""
let area=a.properties.areaDesc || "Unknown"

if(
e.includes("Tornado") ||
e.includes("Severe Thunderstorm Warning") ||
e.includes("Watch")
){
items.push(`⚠ ${e} — ${area}`)
}
})

document.getElementById("ticker").innerText = items.length
? items.join(" • ")
: "No major alerts across the United States"

}catch(err){
document.getElementById("ticker").innerText="Error loading alerts"
}

}

function updateRisk(level){
if(level==="high"){
riskLevel.className="riskBox high"
riskLevel.innerText="Severe Weather Risk: HIGH"
}
else if(level==="medium"){
riskLevel.className="riskBox medium"
riskLevel.innerText="Severe Weather Risk: MODERATE"
}
else{
riskLevel.className="riskBox low"
riskLevel.innerText="Severe Weather Risk: LOW"
}
}

</script>

</body>
</html>
