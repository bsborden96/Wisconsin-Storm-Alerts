<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:38px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:12px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:20px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.status{
font-size:20px;
margin-top:10px;
}

.section{
max-width:650px;
margin:auto;
padding:25px;
}

.locationCard{
background:#111827;
padding:35px;
border-radius:12px;
margin-top:15px;
}

.countyName{
font-size:50px;
font-weight:bold;
}

.cityName{
font-size:28px;
margin-top:8px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:15px;
}

.weatherCard{
background:#0f172a;
padding:20px;
border-radius:10px;
}

.weatherTitle{
font-size:15px;
opacity:0.8;
}

.weatherValue{
font-size:28px;
font-weight:bold;
margin-top:5px;
}

.card{
background:#111;
padding:20px;
margin-top:15px;
border-radius:10px;
font-size:18px;
}

.tornado{background:#7a0000;}
.severe{background:#8a4b00;}
.none{background:#1f3b1f;}

.searchBox{
width:65%;
padding:12px;
font-size:18px;
border-radius:6px;
border:none;
}

.button{
padding:12px 16px;
font-size:18px;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
margin-left:8px;
}

.searchBtn{background:#2563eb;}
.locBtn{background:#16a34a;}

</style>
</head>

<body>

<header>
US Storm Alerts
<div id="status">Loading...</div>
</header>

<nav>
<a href="index.html">Home</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<input id="searchBox" class="searchBox" placeholder="Search City, Town, or County">

<button class="button searchBtn" onclick="searchLocation()">Search</button>

<button class="button locBtn" onclick="detectLocation()">Use My Location</button>

</div>

<div class="section">

<h2>Location</h2>

<div id="locationCard">Detecting location...</div>

</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="weatherCard">
<div class="weatherTitle">Temperature</div>
<div id="temp" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Humidity</div>
<div id="humidity" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Dew Point</div>
<div id="dew" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Precipitation</div>
<div id="precip" class="weatherValue">--</div>
</div>

</div>

</div>

<div class="section">

<h2>Active Alerts</h2>

<div id="alerts">Loading alerts...</div>

</div>

<script>

let lat
let lon

async function loadLocation(newLat,newLon){

lat=newLat
lon=newLon

let res=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let data=await res.json()

let city=data.properties.relativeLocation.properties.city
let state=data.properties.relativeLocation.properties.state

let countyRes=await fetch(data.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

document.getElementById("locationCard").innerHTML=
`<div class="locationCard">
<div class="countyName">${county}</div>
<div class="cityName">${city}, ${state}</div>
</div>`

loadWeather(data)
loadAlerts()

}

async function loadWeather(pointData){

let forecast=await fetch(pointData.properties.forecast)
let forecastData=await forecast.json()

let now=forecastData.properties.periods[0]

document.getElementById("temp").innerText=now.temperature+"°F"
document.getElementById("humidity").innerText="--"
document.getElementById("dew").innerText="--"
document.getElementById("precip").innerText=now.probabilityOfPrecipitation.value+"%"

}

async function loadAlerts(){

let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let html=""

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description

let style="card"

if(event.includes("Tornado Warning")) style+=" tornado"
else if(event.includes("Severe Thunderstorm Warning")) style+=" severe"
else style+=" none"

html+=`<div class="${style}">
<h3>${event}</h3>
<p>${desc}</p>
</div>`

})

if(html==="") html='<div class="card none">No active alerts</div>'

document.getElementById("alerts").innerHTML=html

let time=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})

document.getElementById("status").innerText="Last Updated: "+time

}

function detectLocation(){

navigator.geolocation.getCurrentPosition(pos=>{

loadLocation(pos.coords.latitude,pos.coords.longitude)

})

}

async function searchLocation(){

let q=document.getElementById("searchBox").value

let geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${q}&count=1`)
let geoData=await geo.json()

if(!geoData.results) return

loadLocation(
geoData.results[0].latitude,
geoData.results[0].longitude
)

}

detectLocation()

setInterval(loadAlerts,60000)

</script>

</body>
</html>
