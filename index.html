<!DOCTYPE html>
<html>

<head>

<title>Wisconsin County Alerts</title>

<style>

body{
font-family:Arial;
background:#0a0f1c;
color:white;
margin:0;
}

header{
background:#151c2c;
padding:15px;
font-size:22px;
text-align:center;
}

/* TICKER */

#tickerWrapper{
background:#111;
overflow:hidden;
border-bottom:2px solid #444;
}

#ticker{
white-space:nowrap;
color:#ffcc00;
padding:8px 0;
display:inline-block;
animation:none;
}

/* ticker animation starts after alerts load */

.scroll{
animation:tickerScroll 140s linear infinite;
}

@keyframes tickerScroll{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* DIVIDER */

.divider{
height:12px;
border-bottom:1px solid #333;
}

/* COUNTY LIST */

#container{
max-width:900px;
margin:auto;
padding:20px;
}

.county{
padding:10px;
border-bottom:1px solid #333;
background:#1f3b1f;
}

.countyName{
font-weight:bold;
}

.alert{
margin-left:10px;
}

/* ALERT COLORS */

.red{background:#5a0000;}
.orange{background:#7a3b00;}
.yellow{background:#666600;}
.blue{background:#003c66;}
.purple{background:#4a0066;}
.teal{background:#004f4f;}
.green{background:#1f3b1f;}

/* FLASHING TORNADO */

.flash{
animation:flashRed 1s infinite;
}

@keyframes flashRed{
0%{background:#5a0000;}
50%{background:#a00000;}
100%{background:#5a0000;}
}

</style>

</head>

<body>

<header>
Wisconsin County Alerts
</header>

<div id="tickerWrapper">
<div id="ticker">Loading alerts...</div>
</div>

<div class="divider"></div>

<div id="container"></div>

<script>

// COUNTY LIST

const counties = [
"Adams","Ashland","Barron","Bayfield","Brown","Buffalo","Burnett",
"Calumet","Chippewa","Clark","Columbia","Crawford","Dane","Dodge",
"Door","Douglas","Dunn","Eau Claire","Florence","Fond du Lac",
"Forest","Grant","Green","Green Lake","Iowa","Iron","Jackson",
"Jefferson","Juneau","Kenosha","Kewaunee","La Crosse","Lafayette",
"Langlade","Lincoln","Manitowoc","Marathon","Marinette","Marquette",
"Menominee","Milwaukee","Monroe","Oconto","Oneida","Outagamie",
"Ozaukee","Pepin","Pierce","Polk","Portage","Price","Racine",
"Richland","Rock","Rusk","Sauk","Sawyer","Shawano","Sheboygan",
"St Croix","Taylor","Trempealeau","Vernon","Vilas","Walworth",
"Washburn","Washington","Waukesha","Waupaca","Waushara",
"Winnebago","Wood"
]

const container=document.getElementById("container")

counties.forEach(c=>{

let div=document.createElement("div")
div.className="county green"
div.id=c

div.innerHTML=`
<div class="countyName">${c} County</div>
<div class="alerts"></div>
`

container.appendChild(div)

})

function loadAlerts(){

// reset counties

counties.forEach(c=>{
let county=document.getElementById(c)
county.className="county green"
county.querySelector(".alerts").innerHTML=""
})

fetch("https://api.weather.gov/alerts/active?area=WI")

.then(r=>r.json())

.then(data=>{

let tickerSet=new Set()

data.features.forEach(alert=>{

let event=alert.properties.event
let areas=alert.properties.areaDesc.split(";")

let emoji="⚠️"
let color="teal"
let flash=false

if(event.includes("Tornado Warning")){
emoji="🌪"
color="red"
flash=true
}

else if(event.includes("Severe Thunderstorm Warning")){
emoji="⛈"
color="orange"
}

else if(event.includes("Winter Storm Warning")){
emoji="❄️"
color="blue"
}

else if(event.includes("Wind Warning")){
emoji="💨"
color="yellow"
}

else if(event.includes("Watch")){
emoji="👀"
color="purple"
}

else if(event.includes("Advisory")){
emoji="📢"
color="teal"
}

areas.forEach(a=>{

let countyName=a.trim().replace(" County","")

let county=document.getElementById(countyName)

if(county){

let alertText=`${emoji} ${event}`

let existing=[...county.querySelectorAll(".alert")].map(e=>e.innerText)

if(!existing.includes(alertText)){

county.className="county "+color

if(flash) county.classList.add("flash")

county.querySelector(".alerts").innerHTML+=
`<div class="alert">${alertText}</div>`

tickerSet.add(`${emoji} ${event} - ${countyName} County`)

}

}

})

})

// update ticker

let ticker=document.getElementById("ticker")

ticker.innerText=[...tickerSet].join("   |   ")

ticker.classList.remove("scroll")
void ticker.offsetWidth
ticker.classList.add("scroll")

})

}

loadAlerts()

setInterval(loadAlerts,60000)

</script>

</body>

</html>
