<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'Share Tech Mono',monospace;
background:#050a14;
color:#e0f0ff;
text-align:center;
overflow-x:hidden;
min-height:100vh;
}

/* LIVE BACKGROUND */

#bgCanvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
pointer-events:none;
}

body>*:not(#bgCanvas){
position:relative;
z-index:1;
}

/* LOGO */

.logo{
width:280px;
max-width:90vw;
margin:24px auto 0;
display:block;
filter:drop-shadow(0 0 18px rgba(0,200,255,0.55));
}

/* MENU */

.menuIcon{
position:fixed;
top:14px;
left:14px;
font-size:46px;
z-index:9999;
cursor:pointer;
color:#00cfff;
text-shadow:0 0 10px #00cfff88;
line-height:1;
}

.menuPanel{
display:none;
position:fixed;
top:72px;
left:14px;
background:rgba(5,15,30,0.96);
border:1px solid #00cfff44;
padding:12px 18px;
border-radius:10px;
z-index:9999;
}

.menuPanel a{
display:block;
padding:9px 6px;
color:#a0d8ef;
text-decoration:none;
font-family:'Bebas Neue',cursive;
font-size:18px;
letter-spacing:1px;
}

.menuPanel a:hover{
color:#00cfff;
}

/* POPUP */

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:linear-gradient(135deg,#5a0000,#8a0000);
color:white;
padding:28px 24px;
border-radius:14px;
width:88%;
max-width:420px;
z-index:99999;
display:none;
box-shadow:0 0 40px rgba(255,40,40,0.8);
text-align:left;
border:1px solid rgba(255,80,80,0.4);
font-family:'Share Tech Mono',monospace;
}

.popupClose{
position:absolute;
top:10px;
right:14px;
font-size:22px;
cursor:pointer;
color:#ffaaaa;
}

.popupTitle{
font-family:'Bebas Neue',cursive;
font-size:28px;
color:#ff6060;
letter-spacing:2px;
margin-bottom:8px;
}

/* TICKER */

.tickerWrap{
background:linear-gradient(90deg,#5a0000,#7a0000,#5a0000);
overflow:hidden;
width:100%;
padding:8px 0;
border-top:1px solid #ff444455;
border-bottom:1px solid #ff444455;
}

.tickerTrack{
display:inline-block;
white-space:nowrap;
animation:scroll 120s linear infinite;
min-width:max-content;
padding-right:120px;
font-family:'Bebas Neue',cursive;
font-size:17px;
letter-spacing:1px;
color:#ffcccc;
will-change:transform;
}

@keyframes scroll{
0%{
transform:translateX(100%);
}
100%{
transform:translateX(-100%);
}
}

/* SEARCH */

.searchBox{
margin:14px auto;
width:100%;
max-width:480px;
display:flex;
justify-content:center;
position:relative;
padding:0 12px;
}

.searchBox input{
width:100%;
padding:11px 14px;
font-size:16px;
border-radius:8px;
border:1px solid #00cfff44;
background:rgba(0,20,40,0.85);
color:#e0f0ff;
font-family:'Share Tech Mono',monospace;
outline:none;
}

.searchBox input::placeholder{
color:#4a7a9a;
}

.searchBox input:focus{
border-color:#00cfff88;
box-shadow:0 0 10px #00cfff22;
}

.suggestions{
position:absolute;
top:100%;
left:12px;
right:12px;
background:rgba(5,20,40,0.97);
border:1px solid #00cfff33;
border-radius:8px;
max-height:220px;
overflow-y:auto;
z-index:9999;
text-align:left;
}

.suggestions div{
padding:10px 14px;
cursor:pointer;
color:#a0d8ef;
font-size:13px;
border-bottom:1px solid #ffffff0a;
}

.suggestions div:hover{
background:#0a1f35;
}

/* SECTIONS */

.section{
padding:14px 14px;
max-width:960px;
margin:auto;
}

/* LOCATION */

.locationCard{
background:rgba(10,25,50,0.8);
border:1px solid #00cfff22;
padding:16px 20px;
border-radius:12px;
font-family:'Bebas Neue',cursive;
font-size:22px;
letter-spacing:1px;
color:#7ecfff;
text-shadow:0 0 10px #00cfff44;
}

/* RISK BOX */

.riskBox{
margin-top:12px;
padding:18px 20px;
border-radius:12px;
font-family:'Bebas Neue',cursive;
font-size:26px;
letter-spacing:2px;
cursor:pointer;
border:1px solid transparent;
transition:all 0.3s;
}

.low{
background:linear-gradient(135deg,#0d2b0d,#1a3d1a);
border-color:#2d6b2d55;
color:#6eff8a;
}

.medium{
background:linear-gradient(135deg,#3d2000,#5a3000);
border-color:#ff990055;
color:#ffbb44;
}

.high{
background:linear-gradient(135deg,#3d0000,#600000);
border-color:#ff222255;
color:#ff6666;
animation:pulseRed 2s ease-in-out infinite;
}

@keyframes pulseRed{
0%,100%{
box-shadow:0 0 10px #ff000044;
}
50%{
box-shadow:0 0 28px #ff000088;
}
}

.weatherDetails{
opacity:0;
max-height:0;
overflow:hidden;
transition:opacity 0.3s,max-height 0.4s;
text-align:left;
font-size:14px;
}

.active .weatherDetails{
opacity:1;
max-height:900px;
margin-top:12px;
}

.soundingTitle{
border-bottom:1px solid rgba(0,207,255,0.25);
padding-bottom:6px;
margin-bottom:10px;
font-family:'Bebas Neue',cursive;
font-size:18px;
letter-spacing:1px;
color:#7ecfff;
display:block;
width:100%;
}

h2{
font-family:'Bebas Neue',cursive;
font-size:26px;
letter-spacing:2px;
color:#7ecfff;
margin-bottom:12px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.weatherCard{
background:rgba(5,20,45,0.85);
border:1px solid #00cfff18;
padding:16px;
border-radius:12px;
cursor:pointer;
font-family:'Bebas Neue',cursive;
font-size:20px;
letter-spacing:1px;
color:#a0cce0;
}

.weatherCard .val{
font-size:32px;
margin:4px 0;
color:#e0f0ff;
}

.alertCard{
margin-top:10px;
padding:16px;
border-radius:12px;
text-align:left;
cursor:pointer;
border:1px solid transparent;
}

.alertTornado{
background:linear-gradient(135deg,#3d0000,#5a0000);
border-color:#ff333355;
color:#ffaaaa;
}

.alertSevere{
background:linear-gradient(135deg,#3d2000,#5a3000);
border-color:#ff990055;
color:#ffd09a;
}

.alertOther{
background:rgba(10,25,50,0.85);
border-color:#00cfff18;
color:#a0cce0;
}

.riskItem{
display:flex;
justify-content:space-between;
padding:4px 0;
border-bottom:1px solid #ffffff08;
}

footer{
padding:20px;
font-size:11px;
color:#2a4a6a;
}

</style>
</head>

<body>

<canvas id="bgCanvas"></canvas>

<div id="popup" class="popup">
<div class="popupClose" id="popupClose">✖</div>
<div class="popupTitle" id="popupTitle">⚠ ALERT</div>
<div id="popupText"></div>
</div>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<img src="logo.PNG" class="logo">

<div class="tickerWrap">
<div id="tickerContent" class="tickerTrack">
Loading alerts...
</div>
</div>

<div class="searchBox">
<input id="searchInput" placeholder="🔍 Search US city...">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="section">

<div id="locationCard" class="locationCard">
Locating...
</div>

<div id="riskLevel" class="riskBox low" onclick="toggleCard(this)">

Severe Weather Risk:
<span id="riskText">LOW</span>

</div>

</div>

<script>

function toggleCard(card){

document.querySelectorAll('.weatherCard,.riskBox,.alertCard').forEach(c=>{

if(c!==card){
c.classList.remove('active')
}

})

card.classList.toggle('active')

}

function toggleMenu(){

let m=document.getElementById('menuPanel')

m.style.display=
m.style.display==='block'
?'none'
:'block'

}

let lat=43
let lon=-88

navigator.geolocation.getCurrentPosition(p=>{

lat=p.coords.latitude
lon=p.coords.longitude

loadAll()

},()=>loadAll())

function loadAll(){

loadTicker()
loadAlerts()

}

async function loadTicker(){

try{

let r=await fetch('https://api.weather.gov/alerts/active')

let d=await r.json()

let parts=[]

d.features.forEach(a=>{

let ev=a.properties.event||''
let area=a.properties.areaDesc||''

if(
ev.includes('Tornado') ||
ev.includes('Severe')
){

parts.push(`⚡ ${ev}: ${area}`)

}

})

document.getElementById('tickerContent').innerText=
parts.length
? parts.join('   •   ')
: 'No major severe weather alerts nationwide'

}catch(e){}

}

async function loadAlerts(){

try{

let r=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)

let d=await r.json()

let risk='low'

d.features.forEach(a=>{

let ev=a.properties.event||''

if(ev.includes('Tornado Warning')){
risk='high'
}

else if(
ev.includes('Tornado Watch') ||
ev.includes('Severe Thunderstorm Warning')
){

if(risk!=='high'){
risk='medium'
}

}

})

let riskEl=document.getElementById('riskLevel')
let riskTxt=document.getElementById('riskText')

if(risk==='high'){

riskTxt.innerText='HIGH'
riskEl.className='riskBox high'

}

else if(risk==='medium'){

riskTxt.innerText='MODERATE'
riskEl.className='riskBox medium'

}

else{

riskTxt.innerText='LOW'
riskEl.className='riskBox low'

}

}catch(e){}

}

/* BACKGROUND */

(function(){

const canvas=document.getElementById('bgCanvas')
const ctx=canvas.getContext('2d')

let W,H
let drops=[]

let raining=false
let severity='low'

function resize(){

W=canvas.width=window.innerWidth
H=canvas.height=window.innerHeight

}

window.addEventListener('resize',resize)

resize()

function initRain(count){

drops=[]

for(let i=0;i<count;i++){

drops.push({
x:Math.random()*W,
y:Math.random()*H,
len:8+Math.random()*12,
speed:5+Math.random()*8
})

}

}

initRain(100)

function draw(){

ctx.clearRect(0,0,W,H)

let grad=ctx.createLinearGradient(0,0,0,H)

if(severity==='high'){
grad.addColorStop(0,'#2a0000')
}
else if(severity==='medium'){
grad.addColorStop(0,'#2a1800')
}
else{
grad.addColorStop(0,'#001020')
}

grad.addColorStop(1,'#000')

ctx.fillStyle=grad
ctx.fillRect(0,0,W,H)

if(raining){

drops.forEach(d=>{

d.y+=d.speed

if(d.y>H){

d.y=-20
d.x=Math.random()*W

}

ctx.beginPath()

ctx.moveTo(d.x,d.y)
ctx.lineTo(d.x-1,d.y+d.len)

ctx.strokeStyle='rgba(100,180,255,0.25)'
ctx.stroke()

})

}

requestAnimationFrame(draw)

}

draw()

window.setRain=function(v){
raining=v
}

window.setSeverity=function(v){
severity=v
}

})()

setInterval(loadAll,30000)

</script>

</body>
</html>
