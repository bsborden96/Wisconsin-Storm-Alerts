<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

header{
background:#151c2c;
padding:15px;
text-align:center;
font-size:26px;
font-weight:bold;
}

header.severe{
background:#8b0000;
}

#statusBar{
text-align:center;
padding:6px;
font-size:14px;
color:#ccc;
}

#tickerWrapper{
margin-top:8px;
background:#111;
border-top:2px solid #444;
border-bottom:2px solid #444;
overflow:hidden;
}

#tickerTrack{
display:inline-block;
white-space:nowrap;
animation:scrollTicker 180s linear infinite;
}

#ticker{
padding:10px;
color:#ffcc00;
font-weight:bold;
}

@keyframes scrollTicker{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

.panel{
background:#111;
margin:12px;
padding:15px;
border-radius:8px;
}

.panel h2{
margin-top:0;
}

.alertList{
line-height:1.6;
}

#countyGrid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:8px;
}

.county{
padding:8px;
border-radius:6px;
cursor:pointer;
text-align:center;
font-weight:bold;
}

.green{background:#1f3b1f;}
.orange{background:#7a3b00;}
.red{background:#8b0000;}
.blue{background:#003c66;}
.yellow{background:#666600;}
.purple{background:#4a0066;}
.teal{background:#004f4f;}

.flash{
animation:flashAlert 1s infinite;
}

@keyframes flashAlert{
0%{background:#8b0000;}
50%{background:#300000;}
100%{background:#8b0000;}
}

</style>
</head>

<body>

<header id="header">Wisconsin Storm Alerts</header>

<div id="statusBar">
Alerts: <span id="alertCount">0</span> |
Last Updated: <span id="lastUpdated">--</span>
</div>

<div id="tickerWrapper">
<div id="tickerTrack">
<div id="ticker">Loading Wisconsin alerts...</div>
</div>
</div>

<div class="panel">
<h2>⚠ Warnings</h2>
<div id="warnings" class="alertList">None</div>
</div>

<div class="panel">
<h2>👀 Watches</h2>
<div id="watches" class="alertList">None</div>
</div>

<div class="panel">
<h2>📢 Advisories</h2>
<div id="advisories" class="alertList">None</div>
</div>

<div class="panel">
<h2>County Status</h2>
<div id="countyGrid"></div>
</div>

<div class="panel">
<h2>Alert Details</h2>
<div id="alertText">Click a county to view alerts.</div>
</div>

<audio id="alertSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">
</audio>

<script>

const counties=[
"Adams","Ashland","Barron","Bayfield","Brown","Buffalo","Burnett",
"Calumet","Chippewa","Clark","Columbia","Crawford","Dane","Dodge",
"Door","Douglas","Dunn","Eau Claire","Florence","Fond du Lac",
"Forest","Grant","Green","Green Lake","Iowa","Iron","Jackson",
"Jefferson","Juneau","Kenosha","Kewaunee","La Crosse","Lafayette",
"Langlade","Lincoln","Manitowoc","Marathon","Marinette","Marquette",
"Menominee","Milwaukee","Monroe","Oconto","Oneida","Outagamie",
"Ozaukee","Pepin","Pierce","Polk","Portage","Price","Racine",
"Richland","Rock","Rusk","Sauk","Sawyer","Shawano","Sheboygan",
"St Croix","Taylor","Trempealeau","Vernon","Vilas","Walworth",
"Washburn","Washington","Waukesha","Waupaca","Waushara",
"Winnebago","Wood"
]

const grid=document.getElementById("countyGrid")
let countyAlerts={}
let previousAlerts=0

counties.forEach(c=>{
let div=document.createElement("div")
div.className="county green"
div.id=c
div.innerText=c
div.onclick=()=>showCounty(c)
grid.appendChild(div)
})

function showCounty(name){

let alerts=countyAlerts[name]

if(!alerts){
document.getElementById("alertText").innerHTML=name+" County<br>No active alerts."
return
}

let html="<b>"+name+" County</b><br><br>"

alerts.forEach(a=>{
html+="<b>"+a.event+"</b><br>"+a.description+"<hr>"
})

document.getElementById("alertText").innerHTML=html
}

async function loadAlerts(){

let response=await fetch("https://api.weather.gov/alerts/active?area=WI")
let data=await response.json()

let warnings=[]
let watches=[]
let advisories=[]
let ticker=[]
let count=0

counties.forEach(c=>{
document.getElementById(c).className="county green"
})

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description
let areas=alert.properties.areaDesc.split(";")

areas.forEach(a=>{

let county=a.trim()

if(counties.includes(county)){

count++

ticker.push(event+" - "+county)

if(event.includes("Warning")) warnings.push(event+" - "+county)
else if(event.includes("Watch")) watches.push(event+" - "+county)
else advisories.push(event+" - "+county)

if(!countyAlerts[county]) countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
description:desc
})

if(event.includes("Tornado Warning")){
document.getElementById(county).className="county red flash"
}else if(event.includes("Severe Thunderstorm Warning")){
document.getElementById(county).className="county orange"
}else{
document.getElementById(county).className="county teal"
}

}

})

})

document.getElementById("warnings").innerHTML=warnings.join("<br>")||"None"
document.getElementById("watches").innerHTML=watches.join("<br>")||"None"
document.getElementById("advisories").innerHTML=advisories.join("<br>")||"None"

document.getElementById("ticker").innerText=ticker.join(" | ")||"No active alerts"

document.getElementById("alertCount").innerText=count
document.getElementById("lastUpdated").innerText=new Date().toLocaleTimeString()

if(count>previousAlerts){
document.getElementById("alertSound").play()
}

previousAlerts=count

}

loadAlerts()
setInterval(loadAlerts,60000)

</script>

</body>
</html>
