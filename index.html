<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:32px;
font-size:40px;
font-weight:bold;
}

/* TICKER */

.ticker-wrap{
width:100%;
background:#7f1d1d;
overflow:hidden;
height:42px;
display:flex;
align-items:center;
}

.ticker{
white-space:nowrap;
animation:tickerScroll 60s linear infinite;
font-size:20px;
font-weight:bold;
padding-left:100%;
}

@keyframes tickerScroll{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

/* NAV */

nav{
background:#0f1424;
padding:14px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:22px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

/* PAGE */

.section{
max-width:700px;
margin:auto;
padding:28px;
}

.section h2{
font-size:32px;
}

/* LOCATION */

.locationCard{
background:#111827;
padding:38px;
border-radius:12px;
margin-top:15px;
}

.countyName{
font-size:64px;
font-weight:bold;
}

.cityName{
font-size:38px;
margin-top:8px;
}

/* WEATHER */

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:22px;
}

.weatherCard{
background:#0f172a;
padding:22px;
border-radius:10px;
}

.weatherTitle{
font-size:18px;
opacity:0.8;
}

.weatherValue{
font-size:44px;
font-weight:bold;
margin-top:6px;
}

.updateTime{
margin-top:10px;
font-size:18px;
opacity:0.8;
}

/* ALERT CARDS */

.card{
background:#111;
padding:20px;
margin-top:12px;
border-radius:10px;
font-size:18px;
}

.tornado{background:#7a0000;}
.severe{background:#8a4b00;}
.none{background:#1f3b1f;}

/* SEARCH */

.searchBox{
width:65%;
padding:14px;
font-size:20px;
border-radius:6px;
border:none;
}

.suggestions{
background:#1e293b;
margin:auto;
width:65%;
border-radius:6px;
text-align:left;
}

.suggestion{
padding:12px;
cursor:pointer;
border-bottom:1px solid #334155;
font-size:18px;
}

.suggestion:hover{
background:#334155;
}

.button{
padding:14px 18px;
font-size:20px;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
margin-left:8px;
}

.locBtn{background:#16a34a;}

</style>
</head>

<body>

<header>
US Storm Alerts
<div id="status">Loading...</div>
</header>

<div class="ticker-wrap">
<div id="alertTicker" class="ticker">
Loading national severe alerts...
</div>
</div>

<nav>
<a href="index.html">Home</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<input id="searchBox" class="searchBox" placeholder="Search City or Town" oninput="getSuggestions()">

<button class="button locBtn" onclick="detectLocation()">Use My Location</button>

<div id="suggestions" class="suggestions"></div>

</div>

<div class="section">
<h2>Location</h2>
<div id="locationCard">Detecting location...</div>
</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="weatherCard">
<div class="weatherTitle">Temperature</div>
<div id="temp" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Dew Point</div>
<div id="dew" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Humidity</div>
<div id="humidity" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Wind</div>
<div id="wind" class="weatherValue">--</div>
</div>

</div>

<div id="conditionsTime" class="updateTime"></div>

</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

let lat
let lon

async function loadLocation(newLat,newLon){

lat=newLat
lon=newLon

let point=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let pointData=await point.json()

let city=pointData.properties.relativeLocation.properties.city
let state=pointData.properties.relativeLocation.properties.state

let countyRes=await fetch(pointData.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

document.getElementById("locationCard").innerHTML=
`<div class="locationCard">
<div class="countyName">${county} County</div>
<div class="cityName">${city}, ${state}</div>
</div>`

loadWeather()
loadAlerts()

}

async function loadWeather(){

let res=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`
)

let data=await res.json()

let c=data.current

document.getElementById("temp").innerText=Math.round(c.temperature_2m)+"°F"
document.getElementById("dew").innerText=Math.round(c.dewpoint_2m)+"°F"
document.getElementById("humidity").innerText=c.relative_humidity_2m+"%"
document.getElementById("wind").innerText=Math.round(c.wind_speed_10m)+" mph"

let time=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
document.getElementById("conditionsTime").innerText="Conditions Updated: "+time

}

async function loadAlerts(){

let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let html=""

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description

let style="card"

if(event.includes("Tornado Warning")) style+=" tornado"
else if(event.includes("Severe Thunderstorm Warning")) style+=" severe"
else style+=" none"

html+=`<div class="${style}">
<h3>${event}</h3>
<p>${desc}</p>
</div>`

})

if(html==="") html='<div class="card none">No active alerts</div>'

document.getElementById("alerts").innerHTML=html

let time=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
document.getElementById("status").innerText="Alerts Updated: "+time

}

async function loadNationalAlerts(){

try{

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let alerts=[]

data.features.forEach(alert=>{

let event=alert.properties.event
let area=alert.properties.areaDesc

if(event==="Tornado Warning"){
alerts.unshift(`🌪 ${event} — ${area}`)
}
else if(event==="Severe Thunderstorm Warning"){
alerts.push(`⚡ ${event} — ${area}`)
}
else if(event==="Flash Flood Warning"){
alerts.push(`🌊 ${event} — ${area}`)
}
else if(event==="Blizzard Warning"){
alerts.push(`❄ ${event} — ${area}`)
}

})

if(alerts.length===0){
document.getElementById("alertTicker").innerText="No major severe weather alerts across the United States."
return
}

document.getElementById("alertTicker").innerText=alerts.join(" • ")

}catch{

document.getElementById("alertTicker").innerText="Unable to load national alerts."

}

}
