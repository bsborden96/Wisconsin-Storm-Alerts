<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

.logo{
width:280px;
margin:20px auto;
display:block;
}

/* MENU */
.menuIcon{
position:fixed;
top:15px;
left:15px;
font-size:50px;
z-index:9999;
cursor:pointer;
}

.menuPanel{
display:none;
position:fixed;
top:80px;
left:15px;
background:#111827;
padding:15px;
border-radius:10px;
z-index:9999;
}

.menuPanel a{
display:block;
padding:10px;
color:white;
text-decoration:none;
}

/* CONTAINER */
.container{
max-width:600px;
margin:auto;
width:92%;
}

/* TICKER */
.tickerWrap{
background:#7a0000;
overflow:hidden;
padding:10px 0;
}

.ticker{
white-space:nowrap;
display:inline-block;
animation:scroll 70s linear infinite;
font-size:18px;
}

@keyframes scroll{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* SEARCH */
.searchBox{
margin-top:10px;
position:relative;
}

.searchBox input{
width:100%;
padding:12px;
font-size:18px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:200px;
overflow-y:auto;
}

/* CARDS */
.section{
padding:20px;
max-width:1000px;
margin:auto;
}

.locationCard{
background:#111827;
padding:20px;
border-radius:10px;
}

.riskBox{
margin-top:10px;
padding:15px;
border-radius:10px;
font-size:22px;
font-weight:bold;
}

.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.weatherCard{
background:#0f172a;
padding:15px;
border-radius:10px;
}

.card{
margin-top:10px;
padding:15px;
border-radius:10px;
text-align:left;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="#">Home</a>
<a href="#">Storm Tracker</a>
<a href="#">Winter Center</a>
</div>

<img src="logo.PNG" class="logo">

<div class="container">

<div class="tickerWrap">
<div id="ticker" class="ticker">⚠ Loading alerts…</div>
</div>

<div class="searchBox">
<input id="searchInput" placeholder="Search US city">
<div id="suggestions"></div>
</div>

</div>

<div class="section">
<div id="locationCard" class="locationCard">Loading location...</div>
<div id="riskLevel" class="riskBox low">Severe Weather Risk: LOW</div>
</div>

<div class="section">
<h2>Current Conditions</h2>
<div class="weatherGrid">
<div class="weatherCard">Temp <div id="temp">--</div></div>
<div class="weatherCard">Humidity <div id="humidity">--</div></div>
<div class="weatherCard">Dew <div id="dew">--</div></div>
<div class="weatherCard">Wind <div id="wind">--</div></div>
</div>
</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

/* MENU */
function toggleMenu(){
let m=document.getElementById("menuPanel")
m.style.display = m.style.display==="block"?"none":"block"
}

/* 🔥 FAST STATIC TICKER FIRST */
document.getElementById("ticker").innerText =
"⚠ Monitoring U.S. severe weather — Live updates loading..."

setTimeout(loadTicker,1000)

/* 🔥 TICKER */
async function loadTicker(){

try{
let r=await fetch("https://api.weather.gov/alerts/active")
let d=await r.json()

let arr=d.features.map(a=>{
let e=a.properties.event||""
let score=0

if(e.includes("Tornado")) score=3
else if(e.includes("Severe")) score=2

return {text:`⚠ ${e} — ${a.properties.areaDesc}`,score}
})

arr.sort((a,b)=>b.score-a.score)

let top=arr.slice(0,6).map(a=>a.text)

document.getElementById("ticker").innerText =
top.join(" • ") || "No major alerts"

}catch{
document.getElementById("ticker").innerText =
"Unable to load alerts"
}

}

/* GEO (WITH COUNTY) */
let lat=43, lon=-88

navigator.geolocation.getCurrentPosition(p=>{
lat=p.coords.latitude
lon=p.coords.longitude
loadAll()
},()=>loadAll())

function loadAll(){
loadLocation()
loadWeather()
loadAlerts()
}

/* LOCATION WITH COUNTY */
async function loadLocation(){

try{
let p=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let d=await p.json()

let city=d.properties.relativeLocation.properties.city
let state=d.properties.relativeLocation.properties.state

let countyRes=await fetch(d.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

document.getElementById("locationCard").innerHTML =
`<b>${county} County</b><br>${city}, ${state}`

}catch{
document.getElementById("locationCard").innerText =
"Location unavailable"
}

}

/* WEATHER */
async function loadWeather(){
let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let d=await r.json()

let c=d.current
temp.innerText=Math.round(c.temperature_2m)+"°F"
dew.innerText=Math.round(c.dewpoint_2m)+"°F"
humidity.innerText=c.relative_humidity_2m+"%"
wind.innerText=Math.round(c.wind_speed_10m)+" mph"
}

/* ALERTS + RISK */
async function loadAlerts(){

let r=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let d=await r.json()

let html=""
let risk="low"

d.features.slice(0,5).forEach(a=>{
let e=a.properties.event

if(e.includes("Tornado")) risk="high"
else if(e.includes("Severe")) risk="medium"

let bg=e.includes("Tornado")?"#7a0000":
e.includes("Severe")?"#8a4b00":"#1f2937"

html+=`<div class="card" style="background:${bg}">
<b>${e}</b><br>${a.properties.areaDesc}
</div>`
})

alerts.innerHTML = html || "No alerts"

/* 🔥 FIXED RISK BOX */
let riskBox=document.getElementById("riskLevel")

if(risk==="high"){
riskBox.className="riskBox high"
riskBox.innerText="Severe Weather Risk: HIGH"
}
else if(risk==="medium"){
riskBox.className="riskBox medium"
riskBox.innerText="Severe Weather Risk: MODERATE"
}
else{
riskBox.className="riskBox low"
riskBox.innerText="Severe Weather Risk: LOW"
}

}

</script>

</body>
</html>
