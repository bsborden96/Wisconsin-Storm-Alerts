<!DOCTYPE html>
<html>

<head>

<title>Wisconsin Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

header{
background:#151c2c;
padding:15px;
text-align:center;
font-size:26px;
font-weight:bold;
}

/* TICKER */

#tickerWrapper{
margin-top:10px;
background:#111;
border-top:2px solid #444;
border-bottom:2px solid #444;
overflow:hidden;
}

#tickerTrack{
display:inline-block;
white-space:nowrap;
animation:scrollTicker 180s linear infinite;
}

#ticker{
padding:10px;
color:#ffcc00;
font-weight:bold;
}

@keyframes scrollTicker{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* DASHBOARD */

#dashboard{
display:flex;
flex-direction:column;
padding:15px;
gap:15px;
}

/* PANELS */

.panel{
background:#111;
padding:15px;
border-radius:8px;
}

.panel h2{
margin-top:0;
}

/* COUNTY GRID */

#countyGrid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:8px;
}

.county{
padding:8px;
border-radius:6px;
cursor:pointer;
text-align:center;
font-weight:bold;
}

/* COLORS */

.green{background:#1f3b1f;}
.orange{background:#7a3b00;}
.red{background:#8b0000;}
.blue{background:#003c66;}
.yellow{background:#666600;}
.purple{background:#4a0066;}
.teal{background:#004f4f;}

</style>

</head>

<body>

<header>Wisconsin Storm Alerts</header>

<div id="tickerWrapper">
<div id="tickerTrack">
<div id="ticker">Loading Wisconsin weather alerts...</div>
</div>
</div>

<div id="dashboard">

<div class="panel">
<h2>County Status</h2>
<div id="countyGrid"></div>
</div>

<div class="panel">
<h2>Alert Details</h2>
<div id="alertText">Click a county to view alerts.</div>
</div>

</div>

<script>

const counties=[
"Adams","Ashland","Barron","Bayfield","Brown","Buffalo","Burnett",
"Calumet","Chippewa","Clark","Columbia","Crawford","Dane","Dodge",
"Door","Douglas","Dunn","Eau Claire","Florence","Fond du Lac",
"Forest","Grant","Green","Green Lake","Iowa","Iron","Jackson",
"Jefferson","Juneau","Kenosha","Kewaunee","La Crosse","Lafayette",
"Langlade","Lincoln","Manitowoc","Marathon","Marinette","Marquette",
"Menominee","Milwaukee","Monroe","Oconto","Oneida","Outagamie",
"Ozaukee","Pepin","Pierce","Polk","Portage","Price","Racine",
"Richland","Rock","Rusk","Sauk","Sawyer","Shawano","Sheboygan",
"St Croix","Taylor","Trempealeau","Vernon","Vilas","Walworth",
"Washburn","Washington","Waukesha","Waupaca","Waushara",
"Winnebago","Wood"
]

const grid=document.getElementById("countyGrid")
let countyAlerts={}

/* BUILD COUNTY GRID */

counties.forEach(c=>{
let div=document.createElement("div")
div.className="county green"
div.id=c
div.innerText=c
div.onclick=()=>showCounty(c)
grid.appendChild(div)
})

function getColor(event){

if(event.includes("Tornado Warning"))return"red"
if(event.includes("Severe Thunderstorm Warning"))return"orange"
if(event.includes("Winter Storm Warning"))return"blue"
if(event.includes("Wind Warning"))return"yellow"
if(event.includes("Watch"))return"purple"

return"teal"

}

function getEmoji(event){

if(event.includes("Tornado"))return"🌪"
if(event.includes("Severe Thunderstorm"))return"⛈"
if(event.includes("Winter Storm"))return"❄️"
if(event.includes("Wind"))return"💨"
if(event.includes("Watch"))return"👀"

return"📢"

}

function showCounty(name){

let alerts=countyAlerts[name]

if(!alerts){

document.getElementById("alertText").innerHTML=
"<b>"+name+" County</b><br>No active alerts."

return

}

let html="<b>"+name+" County</b><br><br>"

alerts.forEach(a=>{
html+=`
<b>${getEmoji(a.event)} ${a.event}</b><br>
${a.headline}<br><br>
${a.description}<hr>
`
})

document.getElementById("alertText").innerHTML=html

}

/* LOAD ALERTS */

async function loadAlerts(){

try{

countyAlerts={}

let response=await fetch("https://api.weather.gov/alerts/active?area=WI")

let data=await response.json()

let tickerSet=new Set()

counties.forEach(c=>{
document.getElementById(c).className="county green"
})

data.features.forEach(alert=>{

let event=alert.properties.event
let headline=alert.properties.headline
let desc=alert.properties.description

let areas=alert.properties.areaDesc.split(";")

areas.forEach(area=>{

let county=area.trim()

if(counties.includes(county)){

if(!countyAlerts[county])
countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
headline:headline,
description:desc
})

document.getElementById(county).className="county "+getColor(event)

tickerSet.add(`${getEmoji(event)} ${event} - ${county} County`)

}

})

})

document.getElementById("ticker").innerText=
tickerSet.size?[...tickerSet].join("   |   "):"No active alerts for Wisconsin"

}catch(err){

document.getElementById("ticker").innerText="Unable to load alerts from NWS"

}

}

loadAlerts()

setInterval(loadAlerts,60000)

</script>

</body>

</html>
