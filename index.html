<!DOCTYPE html>
<html>

<head>

<title>Wisconsin Weather Alerts</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

/* HEADER */

header{
background:#151c2c;
padding:15px;
text-align:center;
font-size:22px;
}

/* TICKER */

#tickerWrapper{
background:#111;
border-bottom:2px solid #444;
overflow:hidden;
white-space:nowrap;
}

#ticker{
display:inline-block;
padding:8px;
color:#ffcc00;
animation:scrollTicker 40s linear infinite;
}

@keyframes scrollTicker{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* LAYOUT */

#layout{
display:flex;
height:calc(100vh - 90px);
}

#map{
flex:2;
}

#panel{
flex:1;
background:#111;
padding:20px;
overflow:auto;
border-left:2px solid #333;
}

</style>

</head>

<body>

<header>Wisconsin Weather Alerts</header>

<div id="tickerWrapper">
<div id="ticker">Loading alerts...</div>
</div>

<div id="layout">

<div id="map"></div>

<div id="panel">
<h2>Alert Details</h2>
<div id="alertText">Click a county to view alerts.</div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([44.5,-89.5],7)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map)

let countyAlerts={}
let countiesLayer

function getColor(event){

if(event.includes("Tornado Warning")) return "#8b0000"
if(event.includes("Severe Thunderstorm Warning")) return "#ff7b00"
if(event.includes("Winter Storm Warning")) return "#0055aa"
if(event.includes("Wind Warning")) return "#999900"
if(event.includes("Watch")) return "#660099"
return "#008080"

}

function getEmoji(event){

if(event.includes("Tornado")) return "🌪"
if(event.includes("Severe Thunderstorm")) return "⛈"
if(event.includes("Winter Storm")) return "❄️"
if(event.includes("Wind")) return "💨"
if(event.includes("Watch")) return "👀"
return "📢"

}

/* LOAD COUNTY MAP */

fetch("https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/wisconsin-counties.geojson")

.then(r=>r.json())

.then(data=>{

countiesLayer = L.geoJSON(data,{

style:function(){
return{
color:"#888",
weight:1,
fillColor:"#1f3b1f",
fillOpacity:0.7
}
},

onEachFeature:function(feature,layer){

layer.on("click",function(){

let name=feature.properties.name
let alerts=countyAlerts[name]

if(!alerts){

document.getElementById("alertText").innerHTML=
"<b>"+name+" County</b><br>No active alerts."

return

}

let html="<b>"+name+" County</b><br><br>"

alerts.forEach(a=>{

html+=`
<b>${getEmoji(a.event)} ${a.event}</b><br>
${a.headline}<br><br>
${a.description}<hr>
`

})

document.getElementById("alertText").innerHTML=html

})

}

}).addTo(map)

/* LOAD ALERTS AFTER MAP IS READY */

loadAlerts()
setInterval(loadAlerts,60000)

})

function loadAlerts(){

countyAlerts={}

fetch("https://api.weather.gov/alerts/active?area=WI")

.then(r=>r.json())

.then(data=>{

let ticker=[]

data.features.forEach(alert=>{

let event=alert.properties.event
let headline=alert.properties.headline
let desc=alert.properties.description

let areas=alert.properties.areaDesc.split(";")

areas.forEach(a=>{

let county=a.trim().replace(" County","")

if(!countyAlerts[county])
countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
headline:headline,
description:desc
})

ticker.push(`${getEmoji(event)} ${event} - ${county} County`)

})

})

/* COLOR COUNTIES */

countiesLayer.eachLayer(layer=>{

let name=layer.feature.properties.name

if(countyAlerts[name]){

layer.setStyle({
fillColor:getColor(countyAlerts[name][0].event),
fillOpacity:0.8
})

}

else{

layer.setStyle({
fillColor:"#1f3b1f"
})

}

})

/* UPDATE TICKER */

document.getElementById("ticker").innerText=ticker.join("   |   ")

})

}

</script>

</body>

</html>
