<style>

font-family:Arial;

}

}

.orange{fill:#8a4b00}
.red{fill:#7a0000}

.flash{
animation:flash 1s infinite;
}

@keyframes flash{
0%{opacity:1}
50%{opacity:0.4}
100%{opacity:1}
}

#details{
background:#111;
padding:15px;
border-radius:6px;
margin-top:20px;
}

</style>

<div class="section">

<h2>Alert Details</h2>
<div id="details">Click a county to view alert information.</div>

</div>

<script>

let countyAlerts={}

async function loadAlerts(){

countyAlerts={}

let response=await fetch("https://api.weather.gov/alerts/active?area=WI")
let data=await response.json()

let warningGroups={}

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description
let areas=alert.properties.areaDesc.split(";")

areas.forEach(a=>{

let county=a.trim()

if(!countyAlerts[county]) countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
description:desc
})

})

if(event.includes("Warning")){
if(!warningGroups[event]) warningGroups[event]=[]
warningGroups[event].push(...areas)
}

})

let warningsHTML=""

for(let event in warningGroups){

let counties=[...new Set(warningGroups[event])].join(" • ")

warningsHTML+=`
<div class="warningCard">
<b>${event}</b><br>
${counties}
</div>
`

}

document.getElementById("warnings").innerHTML =
warningsHTML || "No active warnings."

colorCounties()

}

function colorCounties(){

document.querySelectorAll(".county").forEach(c=>{

c.classList.remove("green","orange","red","flash")

let alerts=countyAlerts[c.id]

if(!alerts) return

alerts.forEach(a=>{

if(a.event.includes("Tornado Warning")){
c.classList.add("red","flash")
}
else if(a.event.includes("Severe Thunderstorm Warning")){
c.classList.add("orange")
}
else{
c.classList.add("green")
}

})

})

}

document.querySelectorAll(".county").forEach(c=>{

c.addEventListener("click",()=>{

let alerts=countyAlerts[c.id]

if(!alerts){
document.getElementById("details").innerHTML="No alerts for "+c.id+" County."
return
}

let html="<b>"+c.id+" County</b><br><br>"

alerts.forEach(a=>{
html+="<b>"+a.event+"</b><br>"+a.description+"<hr>"
})

document.getElementById("details").innerHTML=html

})

})

loadAlerts()
setInterval(loadAlerts,60000)

</script>
