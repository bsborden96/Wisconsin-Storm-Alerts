<!DOCTYPE html>
<html>
<head>
<title>Lightning Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:32px;
font-size:36px;
font-weight:bold;
}

/* HAMBURGER MENU */

.menuIcon{
position:absolute;
top:20px;
left:20px;
font-size:34px;
cursor:pointer;
}

.menuPanel{
display:none;
position:absolute;
top:70px;
left:20px;
background:#111827;
border-radius:10px;
padding:10px;
text-align:left;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:22px;
padding:10px 14px;
}

.menuPanel a:hover{
background:#1f2937;
border-radius:6px;
}

#map{
height:80vh;
width:100%;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">🏠 Home</a>
<a href="lightning.html">⚡ Lightning Tracker</a>
<a href="tracking.html">🌩 Storm Tracker</a>
</div>

<header>Lightning Tracker</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

let map
let userLat
let userLon
let markers=[]

navigator.geolocation.getCurrentPosition(pos=>{

userLat=pos.coords.latitude
userLon=pos.coords.longitude

map=L.map("map").setView([userLat,userLon],7)

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map)

L.marker([userLat,userLon]).addTo(map).bindPopup("Your Location")

loadLightning()

})

function distance(lat1,lon1,lat2,lon2){

let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=Math.sin(dLat/2)**2+
Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)**2

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))
return (R*c)*0.621371

}

async function loadLightning(){

markers.forEach(m=>map.removeLayer(m))
markers=[]

try{

let res=await fetch("https://data.blitzortung.org/live_lightning.json")
let strikes=await res.json()

strikes.slice(0,300).forEach(s=>{

let lat=s[1]
let lon=s[2]

let miles=distance(userLat,userLon,lat,lon)

if(miles<100){

let marker=L.circleMarker([lat,lon],{
radius:6,
color:"yellow",
fillColor:"yellow",
fillOpacity:0.9
}).addTo(map)

marker.bindPopup("⚡ Lightning Strike<br>"+Math.round(miles)+" miles away")

markers.push(marker)

}

})

}catch{
console.log("Lightning data unavailable")
}

}

setInterval(loadLightning,30000)

</script>

</body>
</html>
