<!DOCTYPE html>
<html>

<head>

<title>Wisconsin Alerts Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
font-family:Arial;
background:#0a0f1c;
color:white;
margin:0;
}

header{
background:#151c2c;
padding:15px;
font-size:22px;
text-align:center;
}

/* TICKER */

#tickerWrapper{
background:#111;
border-bottom:2px solid #444;
overflow:hidden;
}

#tickerTrack{
display:inline-block;
white-space:nowrap;
animation:tickerScroll 30s linear infinite;
}

#ticker{
color:#ffcc00;
padding:8px;
display:inline-block;
}

@keyframes tickerScroll{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* LAYOUT */

#main{
display:flex;
flex-wrap:wrap;
}

#map{
height:500px;
flex:1;
min-width:400px;
}

#container{
flex:1;
min-width:350px;
max-height:500px;
overflow:auto;
padding:20px;
}

/* COUNTY LIST */

.county{
padding:10px;
border-bottom:1px solid #333;
background:#1f3b1f;
}

.countyName{
font-weight:bold;
}

.alert{
margin-left:10px;
}

/* COLORS */

.red{background:#5a0000;}
.orange{background:#7a3b00;}
.yellow{background:#666600;}
.blue{background:#003c66;}
.purple{background:#4a0066;}
.teal{background:#004f4f;}
.green{background:#1f3b1f;}

/* FLASHING TORNADO */

.flash{
animation:flashRed 1s infinite;
}

@keyframes flashRed{
0%{background:#5a0000;}
50%{background:#a00000;}
100%{background:#5a0000;}
}

</style>

</head>

<body>

<header>Wisconsin Alerts Dashboard</header>

<div id="tickerWrapper">
<div id="tickerTrack">
<div id="ticker">Loading alerts...</div>
</div>
</div>

<div id="main">

<div id="map"></div>

<div id="container"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAP */

var map = L.map('map').setView([44.5,-89.5],7)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map)

/* LOAD WI COUNTY GEOJSON */

var countyLayer

fetch("https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/wisconsin-counties.geojson")

.then(r=>r.json())

.then(data=>{

countyLayer = L.geoJSON(data,{
style:{
color:"#888",
weight:1,
fillColor:"#1f3b1f",
fillOpacity:0.7
}
}).addTo(map)

})

/* COUNTY LIST */

const counties=[
"Adams","Ashland","Barron","Bayfield","Brown","Buffalo","Burnett",
"Calumet","Chippewa","Clark","Columbia","Crawford","Dane","Dodge",
"Door","Douglas","Dunn","Eau Claire","Florence","Fond du Lac",
"Forest","Grant","Green","Green Lake","Iowa","Iron","Jackson",
"Jefferson","Juneau","Kenosha","Kewaunee","La Crosse","Lafayette",
"Langlade","Lincoln","Manitowoc","Marathon","Marinette","Marquette",
"Menominee","Milwaukee","Monroe","Oconto","Oneida","Outagamie",
"Ozaukee","Pepin","Pierce","Polk","Portage","Price","Racine",
"Richland","Rock","Rusk","Sauk","Sawyer","Shawano","Sheboygan",
"St Croix","Taylor","Trempealeau","Vernon","Vilas","Walworth",
"Washburn","Washington","Waukesha","Waupaca","Waushara",
"Winnebago","Wood"
]

const container=document.getElementById("container")

counties.forEach(c=>{

let div=document.createElement("div")
div.className="county green"
div.id=c

div.innerHTML=`
<div class="countyName">${c} County</div>
<div class="alerts"></div>
`

container.appendChild(div)

})

function getColor(event){

if(event.includes("Tornado Warning")) return "red"
if(event.includes("Severe Thunderstorm Warning")) return "orange"
if(event.includes("Winter Storm Warning")) return "blue"
if(event.includes("Wind Warning")) return "yellow"
if(event.includes("Watch")) return "purple"
return "teal"

}

function getEmoji(event){

if(event.includes("Tornado")) return "🌪"
if(event.includes("Severe Thunderstorm")) return "⛈"
if(event.includes("Winter Storm")) return "❄️"
if(event.includes("Wind")) return "💨"
if(event.includes("Watch")) return "👀"
return "📢"

}

function loadAlerts(){

/* RESET */

counties.forEach(c=>{
let county=document.getElementById(c)
county.className="county green"
county.querySelector(".alerts").innerHTML=""
})

fetch("https://api.weather.gov/alerts/active?area=WI")

.then(r=>r.json())

.then(data=>{

let tickerSet=new Set()

data.features.forEach(alert=>{

let event=alert.properties.event
let areas=alert.properties.areaDesc.split(";")

let color=getColor(event)
let emoji=getEmoji(event)

areas.forEach(a=>{

let countyName=a.trim().replace(" County","")

let county=document.getElementById(countyName)

if(county){

let alertText=`${emoji} ${event}`

let existing=[...county.querySelectorAll(".alert")].map(e=>e.innerText)

if(!existing.includes(alertText)){

county.className="county "+color

if(event.includes("Tornado Warning"))
county.classList.add("flash")

county.querySelector(".alerts").innerHTML+=
`<div class="alert">${alertText}</div>`

tickerSet.add(`${emoji} ${event} - ${countyName} County`)

}

}

})

})

let tickerText=[...tickerSet].join("   |   ")

document.getElementById("ticker").innerText=tickerText

/* ADJUST SPEED */

let speed=Math.max(15,tickerText.length/6)

document.getElementById("tickerTrack").style.animation=
`tickerScroll ${speed}s linear infinite`

})

}

loadAlerts()

setInterval(loadAlerts,60000)

</script>

</body>

</html>
