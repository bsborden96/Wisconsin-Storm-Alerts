<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
    
<style>

/* BODY */
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* LOGO */
.logo{
width:300px;
max-width:96vw;
height:auto;
display:block;
margin:20px auto 10px auto;
}

/* MENU */
.menuIcon{
position:fixed;
top:20px;
left:15px;
font-size:70px;
cursor:pointer;
z-index:999999;
}

.menuPanel{
display:none;
position:fixed;
top:90px;
left:15px;
background:#111827;
border-radius:14px;
padding:20px;
z-index:999999;
min-width:220px;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:26px;
padding:14px;
font-weight:bold;
}

/* CONTAINER (ALIGNS TICKER + SEARCH) */
.container{
max-width:600px;
margin:auto;
width:92%;
}

/* TICKER */
.tickerWrap{
background:#7a0000;
overflow:hidden;
white-space:nowrap;
padding:12px 0;
margin-top:10px;
}

.ticker{
display:inline-block;
white-space:nowrap;
font-size:20px;
animation:scroll 80s linear infinite;
}

@keyframes scroll{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* SEARCH */
.searchBox{
margin:20px auto;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:22px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:260px;
overflow-y:auto;
font-size:20px;
z-index:9999;
}

/* LAYOUT */
.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.locationCard{
background:#111827;
padding:30px;
border-radius:14px;
}

/* RISK */
.riskBox{
margin-top:20px;
padding:20px;
border-radius:10px;
font-size:26px;
font-weight:bold;
}

.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}

/* WEATHER */
.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:30px;
}

.weatherCard{
background:#0f172a;
padding:24px;
border-radius:12px;
}

.weatherValue{
font-size:40px;
font-weight:bold;
}

/* ALERTS */
.card{
padding:20px;
margin-top:16px;
border-radius:12px;
font-size:20px;
text-align:left;
}

</style>
</head>

<body>

<!-- MENU -->
<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<!-- LOGO -->
<img src="logo.PNG" class="logo">

<!-- TOP UI -->
<div class="container">

<div class="tickerWrap">
<div id="ticker" class="ticker">⚠ Loading U.S. weather alerts…</div>
</div>

<div class="searchBox">
<input id="searchInput" placeholder="Search any US city">
<div id="suggestions" class="suggestions"></div>
</div>

</div>

<!-- LOCATION -->
<div class="section">
<div id="locationCard" class="locationCard">Loading location...</div>
<div id="riskLevel" class="riskBox low">Severe Weather Risk: LOW</div>
</div>

<!-- WEATHER -->
<div class="section">
<h2>Current Conditions</h2>
<div class="weatherGrid">
<div class="weatherCard">Temp<div id="temp" class="weatherValue">--</div></div>
<div class="weatherCard">Humidity<div id="humidity" class="weatherValue">--</div></div>
<div class="weatherCard">Dew<div id="dew" class="weatherValue">--</div></div>
<div class="weatherCard">Wind<div id="wind" class="weatherValue">--</div></div>
</div>
</div>

<!-- ALERTS -->
<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

/* MENU */
function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

/* 🔥 INSTANT TICKER LOAD */
loadTicker()

/* GEO WITH FALLBACK */
let lat=43.0
let lon=-88.7

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
refreshAll()
},()=>{
refreshAll()
})

function refreshAll(){
loadLocation()
loadWeather()
loadAlerts()
}

/* LOCATION */
async function loadLocation(){
try{
let point=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let data=await point.json()

let city=data.properties.relativeLocation.properties.city
let state=data.properties.relativeLocation.properties.state

let countyRes=await fetch(data.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

locationCard.innerHTML=
`<div style="font-size:40px;font-weight:bold;">${county} County</div>
<div style="color:#aaa;">${city}, ${state}</div>`

}catch{
locationCard.innerHTML="Location unavailable"
}
}

/* WEATHER */
async function loadWeather(){
let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let data=await res.json()

let c=data.current

temp.innerText=Math.round(c.temperature_2m)+"°F"
dew.innerText=Math.round(c.dewpoint_2m)+"°F"
humidity.innerText=c.relative_humidity_2m+"%"
wind.innerText=Math.round(c.wind_speed_10m)+" mph"
}

/* ALERTS (CLEAN + SORTED) */
async function loadAlerts(){

let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let arr=data.features

arr.sort((a,b)=>{
if(a.properties.event.includes("Tornado")) return -1
if(b.properties.event.includes("Tornado")) return 1
if(a.properties.event.includes("Severe")) return -1
if(b.properties.event.includes("Severe")) return 1
return 0
})

let html=""

arr.slice(0,6).forEach(a=>{

let e=a.properties.event
let area=a.properties.areaDesc

let bg="#1f2937"

if(e.includes("Tornado")) bg="#7a0000"
else if(e.includes("Severe")) bg="#8a4b00"

html+=`
<div class="card" style="background:${bg}">
<b>${e}</b><br>
<span style="color:#ccc">${area}</span>
</div>
`

})

alerts.innerHTML=html || "No alerts nearby"

}

/* 🔥 TICKER (FAST + SMART) */
async function loadTicker(){

let tickerEl=document.getElementById("ticker")

let cached=localStorage.getItem("tickerCache")
if(cached) tickerEl.innerText=cached

try{

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let arr=data.features.map(a=>{
let e=a.properties.event||""
let desc=(a.properties.description||"").toLowerCase()

let score=0
if(desc.includes("particularly dangerous situation")) score=5
else if(e.includes("Tornado Warning")) score=4
else if(e.includes("Tornado Watch")) score=3
else if(e.includes("Severe")) score=2

return {
text:`⚠ ${e} — ${a.properties.areaDesc}`,
score
}
})

arr.sort((a,b)=>b.score-a.score)

let top=arr.slice(0,8).map(a=>a.text)

let final=top.length
? top.join(" • ")
: "No major alerts across the United States"

tickerEl.innerText=final
localStorage.setItem("tickerCache",final)

}catch{
tickerEl.innerText="Error loading alerts"
}
}

setInterval(loadTicker,60000)

</script>

</body>
</html>
