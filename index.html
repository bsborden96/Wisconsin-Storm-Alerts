<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* HEADER */

header{
background:#151c2c;
padding:40px;
}

.headerContent{
display:flex;
align-items:center;
justify-content:center;
gap:22px;
}

.logo{
height:200px;
}

.titleText{
font-size:65px;
font-weight:bold;
}

/* 🔥 ARROW BUTTON */

.menuArrow{
display:inline-block;
background:#111827;
color:white;
font-size:40px;
padding:12px 20px;
border-radius:12px;
cursor:pointer;
margin:20px auto;
}

/* 🔥 MENU */

.menuOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
z-index:30000;
}

.menuOverlay.show{
display:block;
}

.menuPanel{
position:fixed;
top:0;
left:-320px;
width:300px;
height:100%;
background:#111827;
padding:30px 20px;
transition:left 0.3s ease;
z-index:30001;
}

.menuPanel.open{
left:0;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:40px;
padding:18px;
font-weight:bold;
border-bottom:1px solid #222;
}

/* TICKER */

.tickerWrap{
background:#7a0000;
padding:12px;
overflow:hidden;
}

.ticker{
white-space:nowrap;
animation:scroll 25s linear infinite;
display:inline-block;
}

@keyframes scroll{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* LAYOUT */

.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
padding:24px;
border-radius:12px;
margin-top:20px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

.weatherValue{
font-size:40px;
}

</style>
</head>

<body>

<!-- MENU -->
<div id="menuOverlay" class="menuOverlay" onclick="closeMenu()"></div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<header>
<div class="headerContent">
<img src="/Wisconsin-Storm-Alerts/logo.PNG" class="logo">
<span class="titleText">US Storm Alerts</span>
</div>
</header>

<div class="tickerWrap">
<span id="ticker" class="ticker">Loading alerts...</span>
</div>

<div class="section">

<div id="locationCard" class="card">Detecting location...</div>

<div id="riskLevel" class="card">Risk: LOW</div>

</div>

<!-- 🔥 ARROW HERE (ONLY MENU BUTTON) -->
<div class="menuArrow" onclick="toggleMenu()">➤ Menu</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="card">
Temp
<div id="temp" class="weatherValue">--</div>
</div>

<div class="card">
Humidity
<div id="humidity" class="weatherValue">--</div>
</div>

<div class="card">
Dew
<div id="dew" class="weatherValue">--</div>
</div>

<div class="card">
Wind
<div id="wind" class="weatherValue">--</div>
</div>

</div>

</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts" class="card">Loading alerts...</div>
</div>

<script>

/* MENU */

function toggleMenu(){
document.getElementById("menuPanel").classList.toggle("open")
document.getElementById("menuOverlay").classList.toggle("show")
}

function closeMenu(){
document.getElementById("menuPanel").classList.remove("open")
document.getElementById("menuOverlay").classList.remove("show")
}

/* LOCATION */

let lat, lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadWeather()
loadAlerts()
loadTicker()
})

/* WEATHER */

async function loadWeather(){
let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let data=await res.json()
let c=data.current

document.getElementById("temp").innerText=Math.round(c.temperature_2m)+"°F"
document.getElementById("dew").innerText=Math.round(c.dewpoint_2m)+"°F"
document.getElementById("humidity").innerText=c.relative_humidity_2m+"%"
document.getElementById("wind").innerText=Math.round(c.wind_speed_10m)+" mph"
}

/* ALERTS */

async function loadAlerts(){
let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let html=""

if(data.features.length===0){
html="No active alerts"
}else{
data.features.forEach(a=>{
html+=`${a.properties.event}<br>`
})
}

document.getElementById("alerts").innerHTML=html
}

/* TICKER */

async function loadTicker(){
let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let txt=""

data.features.slice(0,10).forEach(a=>{
txt += a.properties.event + " • "
})

if(txt==="") txt="No active alerts"

document.getElementById("ticker").innerText=txt
}

</script>

</body>
</html>
