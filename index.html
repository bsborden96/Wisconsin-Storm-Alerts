<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:22px;
font-size:28px;
font-weight:bold;
}

.section{
max-width:650px;
margin:auto;
padding:25px;
}

.card{
background:#111;
padding:20px;
margin-top:15px;
border-radius:8px;
}

.tornado{
background:#7a0000;
}

.severe{
background:#8a4b00;
}

.none{
background:#1f3b1f;
}

.locationCity{
font-size:18px;
opacity:0.8;
margin-top:6px;
}

</style>
</head>

<body>

<header>Wisconsin Storm Alerts</header>

<div class="section">

<h2>Your Location</h2>
<div id="county" class="card">Detecting your location...</div>

</div>

<div class="section">

<h2>Active Alerts</h2>
<div id="alerts">Checking alerts...</div>

</div>

<script>

let userCounty=""
let userCity=""

/* DETECT LOCATION */

async function detectLocation(){

if(!navigator.geolocation){
document.getElementById("county").innerText="Location unavailable"
return
}

navigator.geolocation.getCurrentPosition(async position=>{

let lat=position.coords.latitude
let lon=position.coords.longitude

let res=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let data=await res.json()

/* GET CITY */

userCity=data.properties.relativeLocation.properties.city

/* GET COUNTY */

let countyURL=data.properties.county

let countyRes=await fetch(countyURL)
let countyData=await countyRes.json()

userCounty=countyData.properties.name.replace(" County","")

document.getElementById("county").innerHTML=
"<b>"+userCounty+" County</b><div class='locationCity'>"+userCity+"</div>"

loadAlerts()

})

}

/* LOAD ALERTS */

async function loadAlerts(){

let response=await fetch("https://api.weather.gov/alerts/active?area=WI")
let data=await response.json()

let html=""

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description
let areas=alert.properties.areaDesc

if(areas.includes(userCounty)){

let style="card"

if(event.includes("Tornado Warning")){
style+=" tornado"
}
else if(event.includes("Severe Thunderstorm Warning")){
style+=" severe"
}
else{
style+=" none"
}

html+=`
<div class="${style}">
<h3>${event}</h3>
<p>${desc}</p>
</div>
`

}

})

if(html===""){
html='<div class="card none">No active alerts for your county.</div>'
}

document.getElementById("alerts").innerHTML=html

}

detectLocation()

setInterval(loadAlerts,60000)

</script>

</body>
</html>
