<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:38px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:12px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:20px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.status{
font-size:22px;
margin-top:10px;
opacity:0.9;
}

.section{
max-width:650px;
margin:auto;
padding:25px;
}

.locationCard{
background:#111827;
padding:40px;
border-radius:12px;
margin-top:15px;
}

.countyName{
font-size:56px;
font-weight:bold;
}

.cityName{
font-size:32px;
margin-top:10px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:15px;
}

.weatherCard{
background:#0f172a;
padding:20px;
border-radius:10px;
}

.weatherTitle{
font-size:16px;
opacity:0.8;
}

.weatherValue{
font-size:30px;
font-weight:bold;
margin-top:5px;
}

.windCard{
grid-column:1/3;
}

.card{
background:#111;
padding:24px;
margin-top:18px;
border-radius:10px;
font-size:20px;
}

.tornado{
background:#7a0000;
}

.severe{
background:#8a4b00;
}

.none{
background:#1f3b1f;
}

.reportCard{
background:#0f172a;
padding:18px;
margin-top:12px;
border-radius:8px;
font-size:18px;
}

@media (max-width:600px){

header{font-size:44px;}
.status{font-size:26px;}
.countyName{font-size:64px;}
.cityName{font-size:36px;}

}

</style>
</head>

<body>

<header>

US Storm Alerts
<div id="status" class="status">Loading...</div>

</header>

<nav>

<a href="index.html">Home</a>
<a href="reports.html">Storm Reports</a>

</nav>

<div class="section">

<h2>Your Location</h2>
<div id="county">Detecting your location...</div>

</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="weatherCard">
<div class="weatherTitle">Temperature</div>
<div id="temp" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Dew Point</div>
<div id="dew" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Humidity</div>
<div id="humidity" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Precipitation</div>
<div id="precip" class="weatherValue">--</div>
</div>

<div class="weatherCard windCard">
<div class="weatherTitle">Wind</div>
<div id="wind" class="weatherValue">--</div>
</div>

</div>

</div>

<div class="section">

<h2>Active Alerts</h2>
<div id="alerts">Checking alerts...</div>

</div>

<div class="section">

<h2>Recent Storm Reports</h2>
<div id="reports">Loading reports...</div>

</div>

<script>

let userCounty=""
let userCity=""
let userState=""
let stationsURL=""

function safe(v){
return v==null ? 0 : v
}

function getCardinal(deg){

if(deg==null) return ""

const dirs=["N","NE","E","SE","S","SW","W","NW"]

return dirs[Math.round(deg/45)%8]

}

async function detectLocation(){

navigator.geolocation.getCurrentPosition(async position=>{

let lat=position.coords.latitude
let lon=position.coords.longitude

let res=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let data=await res.json()

userCity=data.properties.relativeLocation.properties.city
userState=data.properties.relativeLocation.properties.state

stationsURL=data.properties.observationStations

let countyURL=data.properties.county

let countyRes=await fetch(countyURL)
let countyData=await countyRes.json()

userCounty=countyData.properties.name.replace(" County","")

document.getElementById("county").innerHTML=
"<div class='locationCard'><div class='countyName'>"+userCounty+" County</div><div class='cityName'>"+userCity+", "+userState+"</div></div>"

loadWeather()
loadAlerts()
loadReports()

})

}

async function loadWeather(){

let stationsRes=await fetch(stationsURL)
let stations=await stationsRes.json()

let station=stations.features[0].id

let obsRes=await fetch(station+"/observations/latest")
let obs=await obsRes.json()

let tempC=safe(obs.properties.temperature.value)
let dewC=safe(obs.properties.dewpoint.value)

let tempF=Math.round((tempC*9/5)+32)
let dewF=Math.round((dewC*9/5)+32)

let humidity=Math.round(safe(obs.properties.relativeHumidity.value))

let windSpeed=safe(obs.properties.windSpeed.value)
windSpeed=Math.round(windSpeed*2.237)

let windGust=safe(obs.properties.windGust.value)
windGust=Math.round(windGust*2.237)

let windDir=getCardinal(obs.properties.windDirection.value)

let precip=safe(obs.properties.precipitationLastHour.value)
let precipIn=(precip*0.03937).toFixed(2)

document.getElementById("temp").innerText=tempF+"°F"
document.getElementById("dew").innerText=dewF+"°F"
document.getElementById("humidity").innerText=humidity+"%"
document.getElementById("precip").innerText=precipIn+" in"

let windText = windSpeed + " mph " + windDir

if(windGust>0){
windText += " (gust " + windGust + ")"
}

document.getElementById("wind").innerText = windText

}

async function loadAlerts(){

let response=await fetch("https://api.weather.gov/alerts/active")
let data=await response.json()

let html=""

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description
let areas=alert.properties.areaDesc

if(areas && areas.includes(userCounty)){

let style="card"

if(event.includes("Tornado Warning")) style+=" tornado"
else if(event.includes("Severe Thunderstorm Warning")) style+=" severe"
else style+=" none"

html+=`
<div class="${style}">
<h3>${event}</h3>
<p>${desc}</p>
</div>
`

}

})

if(html===""){
html='<div class="card none">No active alerts for your county.</div>'
}

document.getElementById("alerts").innerHTML=html

updateTime()

}

async function loadReports(){

let response=await fetch("https://www.spc.noaa.gov/climo/reports/today_wind.csv")

let text=await response.text()

let rows=text.split("\n")

let html=""

rows.forEach(row=>{

let cols=row.split(",")

let location=cols[5]
let time=cols[0]

if(location && location.includes(userState)){

html+=`
<div class="reportCard">
💨 Wind Report<br>
${location}<br>
${time}
</div>
`

}

})

if(html===""){
html="No recent storm reports in your area."
}

document.getElementById("reports").innerHTML=html

}

function updateTime(){

let now=new Date()
let time=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})

document.getElementById("status").innerText="Last Updated: "+time

}

detectLocation()

setInterval(loadAlerts,60000)
setInterval(loadWeather,300000)

</script>

</body>
</html>
