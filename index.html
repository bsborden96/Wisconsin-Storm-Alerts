<!DOCTYPE html>
<html>

<head>

<title>Wisconsin Storm Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

#ticker{
background:#111;
color:#ffcc00;
padding:8px;
font-weight:bold;
white-space:nowrap;
overflow:hidden;
}

#navbar{
background:#151c2c;
padding:10px;
display:flex;
gap:20px;
}

#navbar a{
color:white;
text-decoration:none;
font-weight:bold;
}

#controls{
padding:10px;
text-align:center;
}

button{
padding:8px;
margin:5px;
background:#2c3e50;
border:none;
color:white;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#e74c3c;
}

#map{
height:85vh;
}

</style>

</head>

<body>

<div id="ticker">
Loading Wisconsin alerts...
</div>

<div id="navbar">
<a href="#">Home</a>
<a href="#">Radar</a>
<a href="#">Alerts</a>
<a href="#">About</a>
</div>

<div id="controls">

<button onclick="setRadar('reflectivity')">Reflectivity</button>
<button onclick="setRadar('velocity')">Velocity</button>
<button onclick="setRadar('correlation')">Correlation</button>

<button onclick="toggleReports()">Storm Reports</button>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([44.5,-89.5],7)

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
attribution:'© OpenStreetMap'
}).addTo(map)

var radarLayer

function setRadar(type){

if(radarLayer){
map.removeLayer(radarLayer)
}

if(type==="reflectivity"){

radarLayer = L.tileLayer(
'https://tilecache.rainviewer.com/v2/radar/nowcast/256/{z}/{x}/{y}/2/1_1.png',
{opacity:0.7}
)

}

else{

alert("Velocity and Correlation radar require a dedicated radar server and will be added later.")

return

}

radarLayer.addTo(map)

}

setRadar("reflectivity")


// ALERT TICKER

fetch("https://api.weather.gov/alerts/active?area=WI")
.then(r=>r.json())
.then(data=>{

let alerts=data.features.map(a=>a.properties.event+" - "+a.properties.areaDesc)

document.getElementById("ticker").innerText=alerts.join("   |   ")

})



// WARNING POLYGONS

fetch("https://api.weather.gov/alerts/active?area=WI")
.then(r=>r.json())
.then(data=>{

data.features.forEach(alert=>{

if(alert.geometry){

let color="yellow"

if(alert.properties.event.includes("Tornado")) color="red"
if(alert.properties.event.includes("Severe")) color="orange"

L.geoJSON(alert.geometry,{
style:{
color:color,
weight:2,
fillOpacity:0.25
}
}).addTo(map)

}

})

})



// STORM REPORTS

var reportsLayer
var reportsVisible=false

function toggleReports(){

if(reportsVisible){

map.removeLayer(reportsLayer)
reportsVisible=false
return

}

fetch("https://mesonet.agron.iastate.edu/geojson/lsr.php?sts=1")

.then(r=>r.json())

.then(data=>{

reportsLayer=L.geoJSON(data,{
pointToLayer:(feature,latlng)=>L.circleMarker(latlng,{
radius:6,
color:"white",
fillColor:"cyan",
fillOpacity:0.8
})
}).addTo(map)

reportsVisible=true

})

}

</script>

</body>

</html>
