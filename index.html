<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:38px;
font-weight:bold;
}

.ticker-wrap{
width:100%;
background:#7f1d1d;
overflow:hidden;
height:40px;
display:flex;
align-items:center;
}

.ticker{
white-space:nowrap;
animation:tickerScroll 60s linear infinite;
font-size:20px;
font-weight:bold;
padding-left:100%;
}

@keyframes tickerScroll{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

nav{
background:#0f1424;
padding:14px;
display:flex;
justify-content:center;
gap:30px;
align-items:center;
}

nav a{
color:white;
text-decoration:none;
font-size:18px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.dropdown{
position:relative;
display:inline-block;
}

.dropbtn{
background:#0f1424;
color:white;
border:none;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.dropdown-content{
display:none;
position:absolute;
background:#1f2937;
min-width:200px;
border-radius:6px;
overflow:hidden;
z-index:1;
}

.dropdown-content a{
color:white;
padding:12px;
text-decoration:none;
display:block;
}

.dropdown-content a:hover{
background:#374151;
}

.dropdown:hover .dropdown-content{
display:block;
}

.section{
max-width:700px;
margin:auto;
padding:25px;
}

.locationCard{
background:#111827;
padding:35px;
border-radius:12px;
margin-top:15px;
}

.countyName{
font-size:56px;
font-weight:bold;
}

.cityName{
font-size:34px;
margin-top:6px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-top:20px;
}

.weatherCard{
background:#0f172a;
padding:20px;
border-radius:10px;
}

.weatherTitle{
font-size:16px;
opacity:.8;
}

.weatherValue{
font-size:40px;
font-weight:bold;
margin-top:5px;
}

.card{
background:#111;
padding:18px;
margin-top:12px;
border-radius:10px;
font-size:18px;
}

.tornado{background:#7a0000;}
.severe{background:#8a4b00;}
.none{background:#1f3b1f;}

.searchBox{
width:65%;
padding:12px;
font-size:18px;
border-radius:6px;
border:none;
}

.suggestions{
background:#1e293b;
margin:auto;
width:65%;
border-radius:6px;
text-align:left;
}

.suggestion{
padding:10px;
cursor:pointer;
border-bottom:1px solid #334155;
}

.suggestion:hover{
background:#334155;
}

.button{
padding:12px 16px;
font-size:18px;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
margin-left:8px;
}

.locBtn{background:#16a34a;}

</style>
</head>

<body>

<header>
US Storm Alerts
<div id="status">Loading...</div>
</header>

<div class="ticker-wrap">
<div id="alertTicker" class="ticker">
Loading national severe alerts...
</div>
</div>

<nav>

<a href="index.html">Home</a>

<div class="dropdown">
<button class="dropbtn">Storm Tools ▼</button>
<div class="dropdown-content">
<a href="tornado.html">Tornado Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="environment.html">Storm Environment</a>
<a href="lightning.html">Lightning Tracker</a>
</div>
</div>

<div class="dropdown">
<button class="dropbtn">Alerts ▼</button>
<div class="dropdown-content">
<a href="reports.html">Storm Reports</a>
<a href="severe.html">Severe Alerts</a>
</div>
</div>

</nav>

<div class="section">

<input id="searchBox" class="searchBox" placeholder="Search City or Town" oninput="getSuggestions()">
<button class="button locBtn" onclick="detectLocation()">Use My Location</button>

<div id="suggestions" class="suggestions"></div>

</div>

<div class="section">
<h2>Location</h2>
<div id="locationCard">Detecting location...</div>
</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="weatherCard">
<div class="weatherTitle">Temperature</div>
<div id="temp" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Dew Point</div>
<div id="dew" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Humidity</div>
<div id="humidity" class="weatherValue">--</div>
</div>

</div>

</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

let lat
let lon

async function loadLocation(newLat,newLon){

lat=newLat
lon=newLon

let point=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let pointData=await point.json()

let city=pointData.properties.relativeLocation.properties.city
let state=pointData.properties.relativeLocation.properties.state

let countyRes=await fetch(pointData.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

document.getElementById("locationCard").innerHTML=
`<div class="locationCard">
<div class="countyName">${county} County</div>
<div class="cityName">${city}, ${state}</div>
</div>`

loadWeather()
loadAlerts()

}

async function loadWeather(){

let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m&temperature_unit=fahrenheit`)
let data=await res.json()

let c=data.current

document.getElementById("temp").innerText=Math.round(c.temperature_2m)+"°F"
document.getElementById("dew").innerText=Math.round(c.dewpoint_2m)+"°F"
document.getElementById("humidity").innerText=c.relative_humidity_2m+"%"

}

async function loadAlerts(){

let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let html=""

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description

let style="card"

if(event.includes("Tornado Warning")) style+=" tornado"
else if(event.includes("Severe Thunderstorm Warning")) style+=" severe"
else style+=" none"

html+=`<div class="${style}">
<h3>${event}</h3>
<p>${desc}</p>
</div>`

})

if(html==="") html='<div class="card none">No active alerts</div>'

document.getElementById("alerts").innerHTML=html

}

async function loadNationalAlerts(){

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let alerts=[]

data.features.forEach(alert=>{

let event=alert.properties.event
let area=alert.properties.areaDesc

if(event==="Tornado Warning"){
alerts.unshift(`🌪 ${event} — ${area}`)
}
else if(event==="Severe Thunderstorm Warning"){
alerts.push(`⚡ ${event} — ${area}`)
}

})

if(alerts.length===0){
document.getElementById("alertTicker").innerText="No major severe alerts across the United States."
return
}

document.getElementById("alertTicker").innerText=alerts.join(" • ")

}

function detectLocation(){
navigator.geolocation.getCurrentPosition(pos=>{
loadLocation(pos.coords.latitude,pos.coords.longitude)
})
}

detectLocation()
loadNationalAlerts()
setInterval(loadNationalAlerts,300000)

</script>

</body>
</html>
