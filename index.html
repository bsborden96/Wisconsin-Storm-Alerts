<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* HEADER */

header{
background:#151c2c;
padding:30px;
font-size:38px;
font-weight:bold;
}

.status{
font-size:22px;
margin-top:10px;
opacity:0.9;
}

/* SECTION */

.section{
max-width:650px;
margin:auto;
padding:25px;
}

/* LOCATION */

.locationCard{
background:#111827;
padding:40px;
border-radius:12px;
margin-top:15px;
}

.countyName{
font-size:56px;
font-weight:bold;
}

.cityName{
font-size:32px;
margin-top:10px;
}

/* WEATHER GRID */

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:15px;
}

.weatherCard{
background:#0f172a;
padding:20px;
border-radius:10px;
}

.weatherTitle{
font-size:16px;
opacity:0.8;
}

.weatherValue{
font-size:30px;
font-weight:bold;
margin-top:5px;
}

.windCard{
grid-column:1/3;
}

/* ALERT CARDS */

.card{
background:#111;
padding:24px;
margin-top:18px;
border-radius:10px;
font-size:20px;
}

.tornado{
background:#7a0000;
}

.severe{
background:#8a4b00;
}

.none{
background:#1f3b1f;
}

/* MOBILE */

@media (max-width:600px){

header{font-size:44px;}
.status{font-size:26px;}
.countyName{font-size:64px;}
.cityName{
