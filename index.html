<!DOCTYPE html>
<html>

<head>

<title>Wisconsin Alerts Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

header{
background:#151c2c;
padding:15px;
text-align:center;
font-size:22px;
}

/* TICKER */

#tickerWrapper{
background:#111;
overflow:hidden;
border-bottom:2px solid #444;
white-space:nowrap;
}

#ticker{
display:inline-block;
padding:8px;
color:#ffcc00;
animation:scrollTicker 40s linear infinite;
}

@keyframes scrollTicker{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* LAYOUT */

#layout{
display:flex;
height:calc(100vh - 90px);
}

#map{
flex:2;
}

#panel{
flex:1;
background:#111;
padding:20px;
overflow:auto;
border-left:2px solid #333;
}

.leaflet-container{
background:#0a0f1c;
}

</style>

</head>

<body>

<header>Wisconsin Alerts Dashboard</header>

<div id="tickerWrapper">
<div id="ticker">Loading alerts...</div>
</div>

<div id="layout">

<div id="map"></div>

<div id="panel">
<h2>County Alerts</h2>
<div id="alertText">Click a county to view alerts.</div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map',{
zoomControl:false,
attributionControl:false
})

let countyAlerts={}
let countiesLayer

function getColor(event){

if(event.includes("Tornado Warning")) return "#8b0000"
if(event.includes("Severe Thunderstorm Warning")) return "#ff7b00"
if(event.includes("Winter Storm Warning")) return "#0055aa"
if(event.includes("Wind Warning")) return "#999900"
if(event.includes("Watch")) return "#660099"
return "#008080"

}

function getEmoji(event){

if(event.includes("Tornado")) return "🌪"
if(event.includes("Severe Thunderstorm")) return "⛈"
if(event.includes("Winter Storm")) return "❄️"
if(event.includes("Wind")) return "💨"
if(event.includes("Watch")) return "👀"
return "📢"

}

/* LOAD REAL WI COUNTY SHAPES */

fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/counties-10m.json")

.then(r=>r.json())

.then(data=>{

let counties = topojson.feature(data,data.objects.counties).features

let wi = counties.filter(c => c.id.startsWith("55"))

countiesLayer = L.geoJSON(wi,{

style:{
color:"#777",
weight:1,
fillColor:"#0a0f1c",
fillOpacity:0.8
},

onEachFeature:function(feature,layer){

let fips=feature.id
let countyName

const mapNames={
"55025":"Dane",
"55079":"Milwaukee",
"55009":"Brown"
}

countyName=mapNames[fips] || "Unknown"

layer.on("click",function(){

let alerts=countyAlerts[countyName]

if(!alerts){

document.getElementById("alertText").innerHTML=
"<b>"+countyName+" County</b><br>No active alerts."

return

}

let html="<b>"+countyName+" County</b><br><br>"

alerts.forEach(a=>{

html+=`
<b>${getEmoji(a.event)} ${a.event}</b><br>
${a.headline}<br><br>
${a.description}<hr>
`

})

document.getElementById("alertText").innerHTML=html

})

}

}).addTo(map)

map.fitBounds(countiesLayer.getBounds())

loadAlerts()
setInterval(loadAlerts,60000)

})

/* LOAD ALERTS */

function loadAlerts(){

countyAlerts={}

fetch("https://api.weather.gov/alerts/active?area=WI")

.then(r=>r.json())

.then(data=>{

let ticker=[]

data.features.forEach(alert=>{

let event=alert.properties.event
let headline=alert.properties.headline
let desc=alert.properties.description

let areas=alert.properties.areaDesc.split(";")

areas.forEach(a=>{

let county=a.trim().replace(" County","")

if(!countyAlerts[county])
countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
headline:headline,
description:desc
})

ticker.push(`${getEmoji(event)} ${event} - ${county} County`)

})

})

document.getElementById("ticker").innerText=ticker.join("   |   ")

})

}

</script>

<script src="https://unpkg.com/topojson-client@3"></script>

</body>

</html>
