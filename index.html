<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

/* HEADER */

header{
background:#151c2c;
padding:16px;
text-align:center;
font-size:26px;
font-weight:bold;
}

nav{
background:#0f1424;
text-align:center;
padding:10px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.section{
max-width:1100px;
margin:auto;
padding:20px;
}

/* WARNING CARDS */

#warnings{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
}

.warningCard{
background:#7a0000;
padding:12px;
border-radius:6px;
}

/* MAP */

#map{
max-width:700px;
margin:auto;
}

/* DETAILS */

#details{
background:#111;
padding:15px;
border-radius:6px;
margin-top:20px;
}

/* COUNTY COLORS */

.green{fill:#1f3b1f!important}
.orange{fill:#8a4b00!important}
.red{fill:#7a0000!important}

/* FLASH TORNADO */

.flash{
animation:flash 1s infinite;
}

@keyframes flash{
0%{opacity:1}
50%{opacity:0.5}
100%{opacity:1}
}

</style>
</head>

<body>

<header>Wisconsin Storm Alerts</header>

<nav>
<a href="index.html">Alerts</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<h2>Active Warnings</h2>
<div id="warnings">Loading alerts...</div>

</div>

<div class="section">

<h2>Wisconsin County Map</h2>

<div id="map">

<object id="wiMap"
type="image/svg+xml"
data="https://upload.wikimedia.org/wikipedia/commons/2/22/Wisconsin_counties_map.svg"
width="700">
</object>

</div>

</div>

<div class="section">

<h2>Alert Details</h2>

<div id="details">
Click a county to view alert information.
</div>

</div>

<script>

let countyAlerts={}

const mapObject=document.getElementById("wiMap")

/* LOAD ALERT DATA */

async function loadAlerts(){

countyAlerts={}

let response=await fetch("https://api.weather.gov/alerts/active?area=WI")

let data=await response.json()

let warningGroups={}

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description
let areas=alert.properties.areaDesc.split(";")

areas.forEach(a=>{

let county=a.trim()

if(!countyAlerts[county]) countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
description:desc
})

})

if(event.includes("Warning")){

if(!warningGroups[event]){
warningGroups[event]=[]
}

warningGroups[event].push(...areas)

}

})

/* BUILD WARNING CARDS */

let warningsHTML=""

for(let event in warningGroups){

let counties=[...new Set(warningGroups[event])].join(" • ")

warningsHTML+=`
<div class="warningCard">
<b>${event}</b><br>
${counties}
</div>
`

}

document.getElementById("warnings").innerHTML=
warningsHTML || "No active warnings."

}

/* COLOR COUNTIES ON MAP */

mapObject.addEventListener("load",()=>{

const svgDoc=mapObject.contentDocument

svgDoc.querySelectorAll("path").forEach(p=>{

let county=p.getAttribute("id")

p.style.cursor="pointer"

p.addEventListener("click",()=>{

let alerts=countyAlerts[county]

if(!alerts){
document.getElementById("details").innerHTML="No alerts for "+county+" County."
return
}

let html="<b>"+county+" County</b><br><br>"

alerts.forEach(a=>{
html+="<b>"+a.event+"</b><br>"+a.description+"<hr>"
})

document.getElementById("details").innerHTML=html

})

})

/* APPLY ALERT COLORS */

setInterval(()=>{

svgDoc.querySelectorAll("path").forEach(p=>{

let county=p.getAttribute("id")

p.classList.remove("green","orange","red","flash")

let alerts=countyAlerts[county]

if(!alerts) return

alerts.forEach(a=>{

if(a.event.includes("Tornado Warning")){
p.classList.add("red","flash")
}
else if(a.event.includes("Severe Thunderstorm Warning")){
p.classList.add("orange")
}
else{
p.classList.add("green")
}

})

})

},2000)

})

loadAlerts()

setInterval(loadAlerts,60000)

</script>

</body>
</html>
