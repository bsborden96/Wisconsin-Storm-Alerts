<!DOCTYPE html>
<html>

<head>

<title>Wisconsin County Alerts</title>

<style>

body{
font-family:Arial;
background:#0a0f1c;
color:white;
margin:0;
}

header{
background:#151c2c;
padding:15px;
font-size:22px;
text-align:center;
}

/* TICKER */

#tickerWrapper{
background:#111;
border-bottom:2px solid #444;
overflow:hidden;
}

#ticker{
color:#ffcc00;
padding:8px;
white-space:nowrap;
display:inline-block;
animation:scrollTicker 35s linear infinite;
}

@keyframes scrollTicker{
0% {transform:translateX(100%)}
100% {transform:translateX(-100%)}
}

/* PAGE BREAK */

.divider{
height:15px;
background:#0a0f1c;
border-bottom:1px solid #333;
}

/* COUNTY LIST */

#container{
max-width:900px;
margin:auto;
padding:20px;
}

.county{
padding:10px;
border-bottom:1px solid #333;
background:#1f3b1f;
}

.countyName{
font-weight:bold;
}

.alert{
margin-left:10px;
}

/* COLORS */

.red{background:#5a0000;}
.orange{background:#7a3b00;}
.yellow{background:#666600;}
.blue{background:#003c66;}
.green{background:#1f3b1f;}

</style>

</head>

<body>

<header>
Wisconsin County Alerts
</header>

<div id="tickerWrapper">
<div id="ticker">Loading alerts...</div>
</div>

<div class="divider"></div>

<div id="container"></div>

<script>

// COUNTY LIST

const counties = [
"Adams","Ashland","Barron","Bayfield","Brown","Buffalo","Burnett",
"Calumet","Chippewa","Clark","Columbia","Crawford","Dane","Dodge",
"Door","Douglas","Dunn","Eau Claire","Florence","Fond du Lac",
"Forest","Grant","Green","Green Lake","Iowa","Iron","Jackson",
"Jefferson","Juneau","Kenosha","Kewaunee","La Crosse","Lafayette",
"Langlade","Lincoln","Manitowoc","Marathon","Marinette","Marquette",
"Menominee","Milwaukee","Monroe","Oconto","Oneida","Outagamie",
"Ozaukee","Pepin","Pierce","Polk","Portage","Price","Racine",
"Richland","Rock","Rusk","Sauk","Sawyer","Shawano","Sheboygan",
"St Croix","Taylor","Trempealeau","Vernon","Vilas","Walworth",
"Washburn","Washington","Waukesha","Waupaca","Waushara",
"Winnebago","Wood"
]

const container=document.getElementById("container")

counties.forEach(c=>{

let div=document.createElement("div")
div.className="county green"
div.id=c

div.innerHTML=`
<div class="countyName">${c} County</div>
<div class="alerts"></div>
`

container.appendChild(div)

})


// LOAD ALERTS

function loadAlerts(){

// reset counties

counties.forEach(c=>{
let county=document.getElementById(c)
county.className="county green"
county.querySelector(".alerts").innerHTML=""
})

fetch("https://api.weather.gov/alerts/active?area=WI")

.then(r=>r.json())

.then(data=>{

let tickerSet = new Set()

data.features.forEach(alert=>{

let event=alert.properties.event
let areas=alert.properties.areaDesc.split(";")

let emoji="⚠️"
let color="yellow"

if(event.includes("Tornado")){
emoji="🌪"
color="red"
}

if(event.includes("Severe Thunderstorm")){
emoji="⛈"
color="orange"
}

if(event.includes("High Wind")){
emoji="💨"
color="yellow"
}

if(event.includes("Winter Storm")){
emoji="❄️"
color="blue"
}

areas.forEach(a=>{

let countyName=a.trim().replace(" County","")

let county=document.getElementById(countyName)

if(county){

let alertText=`${emoji} ${event}`

// prevent duplicates

let existing=[...county.querySelectorAll(".alert")].map(e=>e.innerText)

if(!existing.includes(alertText)){

county.className="county "+color

county.querySelector(".alerts").innerHTML+=
`<div class="alert">${alertText}</div>`

tickerSet.add(`${emoji} ${event} - ${countyName} County`)

}

}

})

})

// update ticker

document.getElementById("ticker").innerText=[...tickerSet].join("   |   ")

})

}

loadAlerts()

// refresh every minute

setInterval(loadAlerts,60000)

</script>

</body>

</html>
