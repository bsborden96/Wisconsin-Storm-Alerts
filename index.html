<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

header{
background:#151c2c;
padding:15px;
text-align:center;
font-size:26px;
font-weight:bold;
transition:0.3s;
}

header.severe{
background:#8b0000;
}

nav{
background:#0f1424;
text-align:center;
padding:10px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

#statusBar{
text-align:center;
padding:6px;
font-size:14px;
color:#ccc;
}

#warningBanner{
background:#5a0000;
padding:10px;
text-align:center;
font-weight:bold;
display:none;
}

#tickerWrapper{
background:#111;
border-top:2px solid #444;
border-bottom:2px solid #444;
overflow:hidden;
}

#tickerTrack{
display:inline-block;
white-space:nowrap;
animation:scrollTicker 240s linear infinite;
}

#ticker{
padding:10px;
color:#ffcc00;
font-weight:bold;
}

@keyframes scrollTicker{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

.panel{
background:#111;
margin:12px;
padding:15px;
border-radius:8px;
}

#countyGrid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
gap:8px;
}

.county{
padding:8px;
border-radius:6px;
cursor:pointer;
text-align:center;
font-weight:bold;
position:relative;
}

.county:hover::after{
content:attr(data-alerts);
position:absolute;
bottom:110%;
left:50%;
transform:translateX(-50%);
background:#000;
padding:4px 8px;
font-size:12px;
border-radius:4px;
white-space:nowrap;
}

.green{background:#1f3b1f;}
.orange{background:#7a3b00;}
.red{background:#8b0000;}
.teal{background:#004f4f;}

.flash{
animation:flashAlert 1s infinite;
}

@keyframes flashAlert{
0%{background:#8b0000;}
50%{background:#300000;}
100%{background:#8b0000;}
}

#countySelect{
padding:8px;
margin-bottom:10px;
font-size:14px;
}

</style>
</head>

<body>

<header id="header">Wisconsin Storm Alerts</header>

<nav>
<a href="index.html">Alerts</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div id="statusBar">
Alerts: <span id="alertCount">0</span> |
Last Updated: <span id="lastUpdated">--</span>
</div>

<div id="warningBanner"></div>

<div id="tickerWrapper">
<div id="tickerTrack">
<div id="ticker">Loading Wisconsin alerts...</div>
</div>
</div>

<div class="panel">

<h2>Your County Alerts</h2>

<select id="countySelect"></select>

<div id="localAlerts">
Select a county to see local alerts.
</div>

</div>

<div class="panel">
<h2>County Status</h2>
<div id="countyGrid"></div>
</div>

<div class="panel">
<h2>Alert Details</h2>
<div id="alertText">Click a county to view alerts.</div>
</div>

<audio id="alertSound">
<source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3">
</audio>

<script>

const counties=[
"Adams","Ashland","Barron","Bayfield","Brown","Buffalo","Burnett",
"Calumet","Chippewa","Clark","Columbia","Crawford","Dane","Dodge",
"Door","Douglas","Dunn","Eau Claire","Florence","Fond du Lac",
"Forest","Grant","Green","Green Lake","Iowa","Iron","Jackson",
"Jefferson","Juneau","Kenosha","Kewaunee","La Crosse","Lafayette",
"Langlade","Lincoln","Manitowoc","Marathon","Marinette","Marquette",
"Menominee","Milwaukee","Monroe","Oconto","Oneida","Outagamie",
"Ozaukee","Pepin","Pierce","Polk","Portage","Price","Racine",
"Richland","Rock","Rusk","Sauk","Sawyer","Shawano","Sheboygan",
"St Croix","Taylor","Trempealeau","Vernon","Vilas","Walworth",
"Washburn","Washington","Waukesha","Waupaca","Waushara",
"Winnebago","Wood"
]

const grid=document.getElementById("countyGrid")
const countySelect=document.getElementById("countySelect")

let countyAlerts={}
let previousAlerts=0

counties.forEach(c=>{

let div=document.createElement("div")
div.className="county green"
div.id=c
div.innerText=c
div.dataset.alerts="No alerts"
div.onclick=()=>showCounty(c)
grid.appendChild(div)

let option=document.createElement("option")
option.value=c
option.text=c+" County"
countySelect.appendChild(option)

})

countySelect.addEventListener("change",updateLocalAlerts)

function showCounty(name){

let alerts=countyAlerts[name]

if(!alerts){
document.getElementById("alertText").innerHTML=name+" County<br>No active alerts."
return
}

let html="<b>"+name+" County</b><br><br>"

alerts.forEach(a=>{
html+="<b>"+a.event+"</b><br>"+a.description+"<hr>"
})

document.getElementById("alertText").innerHTML=html
}

function updateLocalAlerts(){

let county=countySelect.value
let alerts=countyAlerts[county]

if(!alerts){

document.getElementById("localAlerts").innerHTML=
"No active alerts for "+county+" County."

return
}

let html=""

alerts.forEach(a=>{
html+="<b>"+a.event+"</b><br>"
})

document.getElementById("localAlerts").innerHTML=html

}

async function loadAlerts(){

countyAlerts={}

let response=await fetch("https://api.weather.gov/alerts/active?area=WI")
let data=await response.json()

let ticker=[]
let warnings=[]
let count=0

counties.forEach(c=>{
document.getElementById(c).className="county green"
document.getElementById(c).dataset.alerts="No alerts"
})

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description
let areas=alert.properties.areaDesc.split(";")

areas.forEach(a=>{

let county=a.trim()

if(counties.includes(county)){

count++

ticker.push(event+" - "+county)

if(event.includes("Warning")) warnings.push(event+" - "+county)

if(!countyAlerts[county]) countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
description:desc
})

let box=document.getElementById(county)

box.dataset.alerts=event

if(event.includes("Tornado Warning")){
box.className="county red flash"
}else if(event.includes("Severe Thunderstorm Warning")){
box.className="county orange"
}else{
box.className="county teal"
}

}

})

})

document.getElementById("ticker").innerText=ticker.join(" | ")||"No active alerts"
document.getElementById("alertCount").innerText=count
document.getElementById("lastUpdated").innerText=new Date().toLocaleTimeString()

let banner=document.getElementById("warningBanner")

if(warnings.length){
banner.style.display="block"
banner.innerText="⚠ ACTIVE WARNINGS: "+warnings.join(" | ")
document.getElementById("header").classList.add("severe")
}else{
banner.style.display="none"
document.getElementById("header").classList.remove("severe")
}

if(count>previousAlerts){
document.getElementById("alertSound").play()
}

previousAlerts=count

updateLocalAlerts()

}

loadAlerts()
setInterval(loadAlerts,60000)

</script>

</body>
</html>
