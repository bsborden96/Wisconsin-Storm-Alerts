<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:32px;
font-size:40px;
font-weight:bold;
}

/* MENU */

.menuIcon{
position:absolute;
top:18px;
left:18px;
font-size:52px;
cursor:pointer;
z-index:10000;
}

.menuPanel{
display:none;
position:absolute;
top:95px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
text-align:left;
z-index:10000;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:28px;
padding:16px;
font-weight:bold;
}

.menuPanel a:hover{
background:#1f2937;
border-radius:8px;
}

/* TICKER */

.tickerWrap{
background:#7a0000;
overflow:hidden;
white-space:nowrap;
padding:12px 0;
}

.ticker{
display:inline-block;
white-space:nowrap;
font-size:22px;
position:relative;
left:100%;
animation:scrollTicker 50s linear infinite;
}

@keyframes scrollTicker{
0%{left:100%}
100%{left:-100%}
}

/* SEARCH */

.searchBox{
margin:30px auto;
max-width:600px;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:22px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
text-align:left;
border-radius:8px;
max-height:260px;
overflow-y:auto;
font-size:20px;
}

.suggestions div{
padding:12px;
cursor:pointer;
}

.suggestions div:hover{
background:#374151;
}

/* LAYOUT */

.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.locationCard{
background:#111827;
padding:36px;
border-radius:14px;
}

.countyName{
font-size:52px;
font-weight:bold;
}

.cityName{
font-size:30px;
}

/* WEATHER */

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
margin-top:30px;
}

.weatherCard{
background:#0f172a;
padding:28px;
border-radius:12px;
}

.weatherValue{
font-size:48px;
font-weight:bold;
}

/* ALERTS */

.card{
background:#111;
padding:22px;
margin-top:16px;
border-radius:12px;
cursor:pointer;
font-size:22px;
}

.tornado{background:#7a0000}
.severe{background:#8a4b00}
.none{background:#1f3b1f}

.alertDetail{
display:none;
margin-top:10px;
font-size:18px;
text-align:left;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<header>US Storm Alerts</header>

<div class="tickerWrap">
<span id="ticker" class="ticker">Loading severe alerts across the United States...</span>
</div>

<div class="searchBox">
<input id="searchInput" placeholder="Search any US city or county">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="section">
<div id="locationCard" class="locationCard">Detecting location...</div>
</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="weatherCard">
Temperature
<div id="temp" class="weatherValue">--</div>
</div>

<div class="weatherCard">
Humidity
<div id="humidity" class="weatherValue">--</div>
</div>

<div class="weatherCard">
Dew Point
<div id="dew" class="weatherValue">--</div>
</div>

<div class="weatherCard">
Wind
<div id="wind" class="weatherValue">--</div>
</div>

</div>

</div>

<div class="section">

<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>

</div>

<script>

/* MENU */

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

let lat
let lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
refreshAll()
})

function refreshAll(){
loadLocation()
loadWeather()
loadAlerts()
}

/* SEARCH */

let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")

input.addEventListener("input",async()=>{

let q=input.value

if(q.length<2){
suggestions.innerHTML=""
return
}

let res=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${q}&count=15`)
let data=await res.json()

suggestions.innerHTML=""

if(!data.results) return

data.results.forEach(place=>{

let div=document.createElement("div")

div.innerText=`${place.name}, ${place.admin1}`

div.onclick=()=>{
selectLocation(place.latitude,place.longitude,place.name)
}

suggestions.appendChild(div)

})

})

input.addEventListener("keydown",async(e)=>{

if(e.key==="Enter"){

let q=input.value

let res=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${q}&count=1`)
let data=await res.json()

if(data.results && data.results.length>0){

let place=data.results[0]

selectLocation(place.latitude,place.longitude,place.name)

}

}

})

function selectLocation(newLat,newLon,name){

lat=newLat
lon=newLon

suggestions.innerHTML=""
input.value=name

refreshAll()

}

/* LOCATION */

async function loadLocation(){

let res=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let data=await res.json()

let city=data.properties.relativeLocation.properties.city
let state=data.properties.relativeLocation.properties.state

let countyRes=await fetch(data.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

document.getElementById("locationCard").innerHTML=
`<div class="countyName">${county} County</div>
<div class="cityName">${city}, ${state}</div>`

}

/* WEATHER */

async function loadWeather(){

let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let data=await res.json()

let c=data.current

temp.innerText=Math.round(c.temperature_2m)+"°F"
dew.innerText=Math.round(c.dewpoint_2m)+"°F"
humidity.innerText=c.relative_humidity_2m+"%"
wind.innerText=Math.round(c.wind_speed_10m)+" mph"

}

/* ALERTS */

async function loadAlerts(){

let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let html=""

data.features.forEach((alert,i)=>{

let e=alert.properties.event
let style="card"

if(e.includes("Tornado")) style+=" tornado"
else if(e.includes("Severe")) style+=" severe"
else style+=" none"

html+=`
<div class="${style}" onclick="toggleAlert(${i})">
<b>${e}</b><br>${alert.properties.areaDesc}
<div id="detail${i}" class="alertDetail">${alert.properties.description}</div>
</div>
`

})

if(html===""){
html='<div class="card none">No active alerts</div>'
}

alerts.innerHTML=html

}

function toggleAlert(i){
let el=document.getElementById("detail"+i)
el.style.display=(el.style.display==="block")?"none":"block"
}

/* TICKER */

async function loadTicker(){

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let text=""

data.features.forEach(a=>{

let e=a.properties.event

if(
e.includes("Tornado Warning")||
e.includes("Severe Thunderstorm Warning")||
e.includes("Tornado Watch")||
e.includes("Severe Thunderstorm Watch")
){
text+=`⚠ ${e} — ${a.properties.areaDesc} • `
}

})

if(text===""){
text="No active tornado or severe thunderstorm alerts across the United States • "
}

document.getElementById("ticker").innerText=text

}

loadTicker()

</script>

</body>
</html>
