<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:16px;
font-size:26px;
font-weight:bold;
}

#map{
max-width:700px;
margin:30px auto;
}

.county{
fill:#333;
stroke:#111;
stroke-width:1;
cursor:pointer;
}

.county:hover{
fill:#555;
}

</style>
</head>

<body>

<header>Wisconsin Storm Alerts</header>

<h2>Wisconsin Map</h2>

<div id="map">

<svg viewBox="0 0 300 400">

<!-- Wisconsin outline -->

<path d="M80 20 L200 20 L230 60 L230 150 L250 250 L200 350 L100 360 L70 300 L60 200 L70 120 Z"
fill="#222" stroke="#555" stroke-width="2"/>

<!-- Example counties -->

<rect id="Douglas" class="county" x="90" y="40" width="40" height="25"/>
<rect id="Bayfield" class="county" x="140" y="40" width="40" height="25"/>

<rect id="Burnett" class="county" x="90" y="80" width="40" height="25"/>
<rect id="Washburn" class="county" x="140" y="80" width="40" height="25"/>
<rect id="Sawyer" class="county" x="190" y="80" width="40" height="25"/>

<rect id="Polk" class="county" x="90" y="120" width="40" height="25"/>
<rect id="Barron" class="county" x="140" y="120" width="40" height="25"/>
<rect id="Rusk" class="county" x="190" y="120" width="40" height="25"/>

</svg>

</div>

</body>
</html>
