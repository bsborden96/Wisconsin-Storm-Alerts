<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:32px;
font-size:40px;
font-weight:bold;
}

/* MENU */

.menuIcon{
position:absolute;
left:15px;
top:15px;
font-size:34px;
cursor:pointer;
}

.menuPanel{
display:none;
position:absolute;
top:70px;
left:15px;
background:#111827;
border-radius:10px;
padding:10px;
text-align:left;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:22px;
padding:10px 14px;
}

.menuPanel a:hover{
background:#1f2937;
border-radius:6px;
}

/* TICKER */

.tickerWrap{
background:#7a0000;
overflow:hidden;
white-space:nowrap;
padding:12px 0;
}

.ticker{
display:inline-block;
white-space:nowrap;
font-size:22px;
animation:scrollTicker 60s linear infinite;
}

@keyframes scrollTicker{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* WEATHER */

.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
margin-top:30px;
}

.weatherCard{
background:#0f172a;
padding:28px;
border-radius:12px;
}

.weatherTitle{
font-size:22px;
opacity:.8;
}

.weatherValue{
font-size:52px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="lightning.html">⚡ Lightning Tracker</a>
<a href="tracking.html">🌩 Storm Tracker</a>
</div>

<header>US Storm Alerts</header>

<div class="tickerWrap">
<span id="ticker" class="ticker">Loading severe alerts...</span>
</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="weatherCard">
<div class="weatherTitle">Temperature</div>
<div id="temp" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Dew Point</div>
<div id="dew" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Humidity</div>
<div id="humidity" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Wind</div>
<div id="wind" class="weatherValue">--</div>
</div>

</div>

</div>

<script>

function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

/* WEATHER */

navigator.geolocation.getCurrentPosition(async pos=>{

let lat=pos.coords.latitude
let lon=pos.coords.longitude

let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let data=await res.json()

let c=data.current

temp.innerText=Math.round(c.temperature_2m)+"°F"
dew.innerText=Math.round(c.dewpoint_2m)+"°F"
humidity.innerText=c.relative_humidity_2m+"%"
wind.innerText=Math.round(c.wind_speed_10m)+" mph"

})

/* TICKER */

async function loadTicker(){

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let text=""
let count=0

data.features.forEach(a=>{
let e=a.properties.event
if(e.includes("Tornado")||e.includes("Severe Thunderstorm")){
text+=`⚠ ${e} — ${a.properties.areaDesc} • `
count++
}
})

if(count===0){
text="No active tornado or severe thunderstorm warnings in the United States"
}

ticker.innerText=text

}

loadTicker()

</script>

</body>
</html>
