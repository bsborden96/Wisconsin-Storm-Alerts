<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

.logo{
width:300px;
max-width:96vw;
margin:20px auto 10px auto;
display:block;
}

/* MENU */
.menuIcon{
position:fixed;
top:20px;
left:15px;
font-size:60px;
z-index:999999;
cursor:pointer;
}

.menuPanel{
display:none;
position:fixed;
top:90px;
left:15px;
background:#111827;
padding:20px;
border-radius:14px;
z-index:999999;
}

.menuPanel a{
display:block;
font-size:24px;
padding:12px;
color:white;
text-decoration:none;
}

/* CONTAINER */
.container{
max-width:600px;
margin:auto;
width:92%;
}

/* TICKER */
.tickerWrap{
background:#7a0000;
overflow:hidden;
padding:10px 0;
}

.ticker{
white-space:nowrap;
display:inline-block;
animation:scroll 80s linear infinite;
font-size:18px;
}

@keyframes scroll{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* SEARCH */
.searchBox{
margin-top:15px;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:20px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:250px;
overflow-y:auto;
z-index:9999;
text-align:left;
}

.suggestions div{
padding:12px;
cursor:pointer;
}

.suggestions div:hover{
background:#374151;
}

/* CARDS */
.section{
padding:25px;
max-width:1000px;
margin:auto;
}

.locationCard{
background:#111827;
padding:25px;
border-radius:12px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

.weatherCard{
background:#0f172a;
padding:20px;
border-radius:10px;
}

.weatherValue{
font-size:36px;
}

.card{
margin-top:12px;
padding:16px;
border-radius:10px;
text-align:left;
}

.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<img src="logo.PNG" class="logo">

<div class="container">

<div class="tickerWrap">
<div id="ticker" class="ticker">⚠ Loading U.S. weather alerts…</div>
</div>

<div class="searchBox">
<input id="searchInput" placeholder="Search US city">
<div id="suggestions" class="suggestions"></div>
</div>

</div>

<div class="section">
<div id="locationCard" class="locationCard">Loading location...</div>
<div id="riskLevel" class="card low">Severe Weather Risk: LOW</div>
</div>

<div class="section">
<h2>Current Conditions</h2>
<div class="weatherGrid">
<div class="weatherCard">Temp<div id="temp" class="weatherValue">--</div></div>
<div class="weatherCard">Humidity<div id="humidity" class="weatherValue">--</div></div>
<div class="weatherCard">Dew<div id="dew" class="weatherValue">--</div></div>
<div class="weatherCard">Wind<div id="wind" class="weatherValue">--</div></div>
</div>
</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

/* MENU */
function toggleMenu(){
let p=document.getElementById("menuPanel")
p.style.display = p.style.display==="block" ? "none":"block"
}

/* 🔥 TICKER (BULLETPROOF) */
async function loadTicker(){

let el=document.getElementById("ticker")

el.innerText="⚠ Loading U.S. weather alerts…"

let cache=localStorage.getItem("tickerCache")
if(cache) el.innerText=cache

try{
let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let arr=data.features.map(a=>{
let e=a.properties.event||""
let desc=(a.properties.description||"").toLowerCase()

let score=0
if(desc.includes("particularly dangerous situation")) score=5
else if(e.includes("Tornado Warning")) score=4
else if(e.includes("Tornado Watch")) score=3
else if(e.includes("Severe")) score=2

return {text:`⚠ ${e} — ${a.properties.areaDesc}`,score}
})

arr.sort((a,b)=>b.score-a.score)

let top=arr.slice(0,8).map(a=>a.text)

let final=top.length?top.join(" • "):"No major alerts across the United States"

el.innerText=final
localStorage.setItem("tickerCache",final)

}catch{
if(!cache) el.innerText="Unable to load alerts"
}

}

loadTicker()
setInterval(loadTicker,60000)

/* GEO */
let lat=43, lon=-88

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
refreshAll()
},()=>refreshAll())

function refreshAll(){
loadLocation()
loadWeather()
loadAlerts()
}

/* LOCATION */
async function loadLocation(){
try{
let p=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let d=await p.json()

let city=d.properties.relativeLocation.properties.city
let state=d.properties.relativeLocation.properties.state

locationCard.innerHTML=`<b>${city}, ${state}</b>`
}catch{
locationCard.innerText="Location unavailable"
}
}

/* WEATHER */
async function loadWeather(){
let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let d=await r.json()

let c=d.current
temp.innerText=Math.round(c.temperature_2m)+"°F"
dew.innerText=Math.round(c.dewpoint_2m)+"°F"
humidity.innerText=c.relative_humidity_2m+"%"
wind.innerText=Math.round(c.wind_speed_10m)+" mph"
}

/* ALERTS */
async function loadAlerts(){
let r=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let d=await r.json()

let html=""

d.features.slice(0,6).forEach(a=>{
let e=a.properties.event
let bg=e.includes("Tornado")?"#7a0000":e.includes("Severe")?"#8a4b00":"#1f2937"

html+=`<div class="card" style="background:${bg}"><b>${e}</b><br>${a.properties.areaDesc}</div>`
})

alerts.innerHTML=html||"No alerts"
}

/* 🔥 FIXED SEARCH */
let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")

input.addEventListener("input", async ()=>{
let q=input.value.trim()

if(q.length<2){
suggestions.innerHTML=""
return
}

try{
let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=us&limit=5`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(p=>{
let div=document.createElement("div")
div.innerText=p.display_name

div.onclick=()=>{
lat=parseFloat(p.lat)
lon=parseFloat(p.lon)
input.value=p.display_name
suggestions.innerHTML=""
refreshAll()
}

suggestions.appendChild(div)
})

}catch{
suggestions.innerHTML=""
}

})

</script>

</body>
</html>
