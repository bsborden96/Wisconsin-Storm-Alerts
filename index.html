<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:38px;
font-weight:bold;
}

/* NAV BAR */

nav{
background:#0f1424;
padding:16px;
display:flex;
justify-content:center;
gap:30px;
}

nav a{
color:white;
text-decoration:none;
font-size:20px;
font-weight:bold;
}

nav a:hover{
color:#60a5fa;
}

/* CONTENT */

.section{
max-width:900px;
margin:auto;
padding:25px;
}

.locationCard{
background:#111827;
padding:30px;
border-radius:12px;
}

.countyName{
font-size:48px;
font-weight:bold;
}

.cityName{
font-size:26px;
margin-top:6px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-top:20px;
}

.weatherCard{
background:#0f172a;
padding:20px;
border-radius:10px;
}

.weatherTitle{
font-size:16px;
opacity:.8;
}

.weatherValue{
font-size:34px;
font-weight:bold;
margin-top:5px;
}

/* ALERTS */

.card{
background:#111;
padding:18px;
margin-top:12px;
border-radius:10px;
font-size:18px;
}

.tornado{
background:#7a0000;
}

.severe{
background:#8a4b00;
}

.none{
background:#1f3b1f;
}

</style>
</head>

<body>

<header>
US Storm Alerts
</header>

<nav>

<a href="index.html">Home</a>
<a href="tornado.html">Tornado Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="environment.html">Storm Environment</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="reports.html">Storm Reports</a>
<a href="severe.html">Severe Alerts</a>

</nav>

<div class="section">

<div id="lastUpdated">
Last Updated: --
</div>

</div>

<div class="section">

<div id="locationCard" class="locationCard">
Detecting location...
</div>

</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="weatherCard">
<div class="weatherTitle">Temperature</div>
<div id="temp" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Dew Point</div>
<div id="dew" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Humidity</div>
<div id="humidity" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Wind</div>
<div id="wind" class="weatherValue">--</div>
</div>

</div>

</div>

<div class="section">

<h2>Active Alerts</h2>

<div id="alerts">Loading alerts...</div>

</div>

<script>

let lat
let lon

navigator.geolocation.getCurrentPosition(pos=>{

lat=pos.coords.latitude
lon=pos.coords.longitude

loadLocation()
loadWeather()
loadAlerts()

})

async function loadLocation(){

try{

let point=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let pointData=await point.json()

let city=pointData.properties.relativeLocation.properties.city
let state=pointData.properties.relativeLocation.properties.state

let countyRes=await fetch(pointData.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

document.getElementById("locationCard").innerHTML=

`<div class="countyName">${county} County</div>
<div class="cityName">${city}, ${state}</div>`

}catch{

document.getElementById("locationCard").innerHTML="Location unavailable"

}

}

async function loadWeather(){

try{

let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)

let data=await res.json()

let c=data.current

document.getElementById("temp").innerText=Math.round(c.temperature_2m)+"°F"
document.getElementById("dew").innerText=Math.round(c.dewpoint_2m)+"°F"
document.getElementById("humidity").innerText=c.relative_humidity_2m+"%"

document.getElementById("wind").innerText=Math.round(c.wind_speed_10m)+" mph"

}catch{

document.getElementById("wind").innerText="Unavailable"

}

}

async function loadAlerts(){

try{

let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let html=""

data.features.forEach(alert=>{

let event=alert.properties.event

let style="card"

if(event.includes("Tornado Warning")) style+=" tornado"
else if(event.includes("Severe Thunderstorm Warning")) style+=" severe"
else style+=" none"

html+=`
<div class="${style}">
<b>${event}</b><br>
${alert.properties.areaDesc}
</div>
`

})

if(html==="") html='<div class="card none">No active alerts</div>'

document.getElementById("alerts").innerHTML=html

document.getElementById("lastUpdated").innerText =
"Last Updated: " + new Date().toLocaleTimeString()

}catch{

document.getElementById("alerts").innerHTML="Unable to load alerts."

}

}

</script>

</body>
</html>
