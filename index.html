<!DOCTYPE html>
<html>

<head>

<title>Wisconsin Alerts Dashboard</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

header{
background:#151c2c;
padding:15px;
text-align:center;
font-size:22px;
}

/* TICKER */

#tickerWrapper{
background:#111;
overflow:hidden;
border-bottom:2px solid #444;
white-space:nowrap;
}

#ticker{
display:inline-block;
padding:8px;
color:#ffcc00;
animation:scrollTicker 35s linear infinite;
}

@keyframes scrollTicker{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* LAYOUT */

#layout{
display:flex;
height:calc(100vh - 90px);
}

#map{
flex:2;
display:flex;
align-items:center;
justify-content:center;
}

#panel{
flex:1;
background:#111;
padding:20px;
overflow:auto;
border-left:2px solid #333;
}

/* SVG */

svg{
width:90%;
max-width:700px;
}

/* COUNTIES */

.county{
fill:#0a0f1c;
stroke:#777;
stroke-width:1;
cursor:pointer;
transition:0.2s;
}

.county:hover{
fill:#333;
}

/* ALERT COLORS */

.red{fill:#8b0000;}
.orange{fill:#ff7b00;}
.blue{fill:#0055aa;}
.yellow{fill:#999900;}
.purple{fill:#660099;}
.teal{fill:#008080;}

.flash{
animation:flash 1s infinite;
}

@keyframes flash{
0%{opacity:1}
50%{opacity:0.4}
100%{opacity:1}
}

/* LEGEND */

#legend{
position:absolute;
left:20px;
bottom:20px;
background:#111;
padding:10px;
border:1px solid #444;
font-size:14px;
}

</style>

</head>

<body>

<div id="layout">

<script>

/* ALERT STORAGE */

let countyAlerts={}

/* COLORS */

function getColor(event){
if(event.includes("Tornado Warning")) return "red"
if(event.includes("Severe Thunderstorm Warning")) return "orange"
if(event.includes("Winter Storm Warning")) return "blue"
if(event.includes("Wind Warning")) return "yellow"
if(event.includes("Watch")) return "purple"
return "teal"
}

function getEmoji(event){
if(event.includes("Tornado")) return "🌪"
if(event.includes("Severe Thunderstorm")) return "⛈"
if(event.includes("Winter Storm")) return "❄️"
if(event.includes("Wind")) return "💨"
if(event.includes("Watch")) return "👀"
return "📢"
}

/* COUNTY CLICK */

document.querySelectorAll(".county").forEach(c=>{

c.addEventListener("click",()=>{

let county=c.id
let alerts=countyAlerts[county]

if(!alerts){
document.getElementById("alertText").innerHTML=
"<b>"+county+" County</b><br>No active alerts."
return
}

let html="<b>"+county+" County</b><br><br>"

alerts.forEach(a=>{
html+=`
<b>${getEmoji(a.event)} ${a.event}</b><br>
${a.headline}<br><br>
${a.description}<hr>
`
})

document.getElementById("alertText").innerHTML=html

})

})

/* LOAD ALERTS */

function loadAlerts(){

countyAlerts={}

fetch("https://api.weather.gov/alerts/active?area=WI")

.then(r=>r.json())

.then(data=>{

let ticker=[]

document.querySelectorAll(".county").forEach(c=>{
c.className="county"
})

data.features.forEach(alert=>{

let event=alert.properties.event
let headline=alert.properties.headline
let desc=alert.properties.description

let areas=alert.properties.areaDesc.split(";")

areas.forEach(a=>{

let county=a.trim().replace(" County","")

if(!countyAlerts[county])
countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
headline:headline,
description:desc
})

let shape=document.getElementById(county)

if(shape){
shape.classList.add(getColor(event))
if(event.includes("Tornado Warning"))
shape.classList.add("flash")
}

ticker.push(`${getEmoji(event)} ${event} - ${county} County`)

})

})

document.getElementById("ticker").innerText=ticker.join("   |   ")

})

}

loadAlerts()
setInterval(loadAlerts,60000)

</script>
