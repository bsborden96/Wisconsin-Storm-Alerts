<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

header{
background:#151c2c;
padding:16px;
text-align:center;
font-size:26px;
font-weight:bold;
}

nav{
background:#0f1424;
text-align:center;
padding:10px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.section{
max-width:1100px;
margin:auto;
padding:20px;
}

/* WARNING CARDS */

#warnings{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
}

.warningCard{
background:#7a0000;
padding:12px;
border-radius:6px;
}

/* MAP */

#map{
max-width:700px;
margin:auto;
}

.county{
fill:#333;
stroke:#111;
stroke-width:1;
cursor:pointer;
}

.green{fill:#1f3b1f}
.orange{fill:#8a4b00}
.red{fill:#7a0000}

.flash{
animation:flash 1s infinite;
}

@keyframes flash{
0%{opacity:1}
50%{opacity:0.5}
100%{opacity:1}
}

/* DETAILS */

#details{
background:#111;
padding:15px;
border-radius:6px;
margin-top:20px;
}

</style>
</head>

<body>

<header>Wisconsin Storm Alerts</header>

<nav>
<a href="index.html">Alerts</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<h2>Active Warnings</h2>
<div id="warnings">Loading alerts...</div>

</div>

<div class="section">

<h2>Your County</h2>
<div id="userCounty">Detecting your location...</div>
<div id="localAlerts">Checking alerts...</div>

</div>

<div class="section">

<h2>Wisconsin Map</h2>

<div id="map">

<!-- Simplified Wisconsin county SVG -->
<svg viewBox="0 0 600 700">

<rect id="Dane" class="county" x="250" y="450" width="40" height="30"/>
<rect id="Rock" class="county" x="250" y="500" width="40" height="30"/>
<rect id="Milwaukee" class="county" x="360" y="470" width="40" height="30"/>
<rect id="Brown" class="county" x="320" y="250" width="40" height="30"/>
<rect id="Douglas" class="county" x="120" y="50" width="40" height="30"/>
<rect id="La Crosse" class="county" x="200" y="400" width="40" height="30"/>

</svg>

</div>

</div>

<div class="section">

<h2>Alert Details</h2>
<div id="details">Click a county to see alert information.</div>

</div>

<script>

let countyAlerts={}

/* CLICK COUNTY */

document.querySelectorAll(".county").forEach(c=>{

c.addEventListener("click",()=>{

let name=c.id
let alerts=countyAlerts[name]

if(!alerts){
document.getElementById("details").innerHTML="No alerts for "+name+" County."
return
}

let html="<b>"+name+" County</b><br><br>"

alerts.forEach(a=>{
html+="<b>"+a.event+"</b><br>"+a.description+"<hr>"
})

document.getElementById("details").innerHTML=html

})

})

/* LOAD ALERTS */

async function loadAlerts(){

countyAlerts={}

let response=await fetch("https://api.weather.gov/alerts/active?area=WI")
let data=await response.json()

let warningGroups={}

document.querySelectorAll(".county").forEach(c=>{
c.setAttribute("class","county")
})

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description
let areas=alert.properties.areaDesc.split(";")

areas.forEach(a=>{

let county=a.trim()

let shape=document.getElementById(county)

if(shape){

if(!countyAlerts[county]) countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
description:desc
})

if(event.includes("Tornado Warning")){
shape.classList.add("red","flash")
}
else if(event.includes("Severe Thunderstorm Warning")){
shape.classList.add("orange")
}
else{
shape.classList.add("green")
}

}

})

if(event.includes("Warning")){

if(!warningGroups[event]){
warningGroups[event]=[]
}

warningGroups[event].push(...areas)

}

})

let warningsHTML=""

for(let event in warningGroups){

let counties=[...new Set(warningGroups[event])].join(" • ")

warningsHTML+=`
<div class="warningCard">
<b>${event}</b><br>
${counties}
</div>
`

}

document.getElementById("warnings").innerHTML=
warningsHTML || "No active warnings."

}

/* LOCATION DETECTION */

function detectLocation(){

if(!navigator.geolocation) return

navigator.geolocation.getCurrentPosition(async pos=>{

let lat=pos.coords.latitude
let lon=pos.coords.longitude

let res=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let data=await res.json()

let county=data.properties.relativeLocation.properties.city

document.getElementById("userCounty").innerHTML="<b>Your County:</b> "+county

})

}

loadAlerts()
detectLocation()

setInterval(loadAlerts,60000)

</script>

</body>
</html>
