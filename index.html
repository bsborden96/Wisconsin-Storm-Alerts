<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

header{
background:#151c2c;
padding:16px;
text-align:center;
font-size:26px;
font-weight:bold;
}

nav{
background:#0f1424;
text-align:center;
padding:10px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.section{
max-width:1100px;
margin:auto;
padding:20px;
}

/* WARNING CARDS */

#warnings{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
}

.warningCard{
background:#7a0000;
padding:12px;
border-radius:6px;
}

/* MAP */

#map{
max-width:700px;
margin:auto;
}

.county{
fill:#333;
stroke:#111;
stroke-width:1;
cursor:pointer;
}

/* ALERT COLORS */

.green{fill:#1f3b1f!important}
.orange{fill:#8a4b00!important}
.red{fill:#7a0000!important}

/* FLASH */

.flash{
animation:flash 1s infinite;
}

@keyframes flash{
0%{opacity:1}
50%{opacity:0.4}
100%{opacity:1}
}

/* DETAILS */

#details{
background:#111;
padding:15px;
border-radius:6px;
margin-top:20px;
}

</style>
</head>

<body>

<header>Wisconsin Storm Alerts</header>

<nav>
<a href="index.html">Alerts</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<h2>Active Warnings</h2>
<div id="warnings">Loading alerts...</div>

</div>

<div class="section">

<h2>Wisconsin County Map</h2>

<div id="map">

<!-- Simplified Wisconsin county layout -->
<svg viewBox="0 0 500 600">

<!-- NORTH -->

<rect id="Douglas" class="county" x="120" y="40" width="70" height="40"/>
<rect id="Bayfield" class="county" x="200" y="40" width="70" height="40"/>

<rect id="Burnett" class="county" x="120" y="100" width="70" height="40"/>
<rect id="Washburn" class="county" x="200" y="100" width="70" height="40"/>
<rect id="Sawyer" class="county" x="280" y="100" width="70" height="40"/>

<rect id="Polk" class="county" x="120" y="160" width="70" height="40"/>
<rect id="Barron" class="county" x="200" y="160" width="70" height="40"/>
<rect id="Rusk" class="county" x="280" y="160" width="70" height="40"/>

<!-- CENTRAL -->

<rect id="Chippewa" class="county" x="200" y="220" width="70" height="40"/>
<rect id="Clark" class="county" x="280" y="220" width="70" height="40"/>
<rect id="Marathon" class="county" x="360" y="220" width="70" height="40"/>

<rect id="Wood" class="county" x="280" y="280" width="70" height="40"/>

<!-- SOUTH CENTRAL -->

<rect id="Sauk" class="county" x="200" y="340" width="70" height="40"/>
<rect id="Columbia" class="county" x="280" y="340" width="70" height="40"/>

<rect id="Dane" class="county" x="200" y="400" width="70" height="40"/>
<rect id="Jefferson" class="county" x="280" y="400" width="70" height="40"/>

<!-- SOUTH -->

<rect id="Rock" class="county" x="200" y="460" width="70" height="40"/>
<rect id="Walworth" class="county" x="280" y="460" width="70" height="40"/>

<!-- EAST -->

<rect id="Fond du Lac" class="county" x="360" y="340" width="70" height="40"/>
<rect id="Washington" class="county" x="360" y="400" width="70" height="40"/>
<rect id="Milwaukee" class="county" x="360" y="460" width="70" height="40"/>
<rect id="Racine" class="county" x="360" y="520" width="70" height="40"/>
<rect id="Kenosha" class="county" x="360" y="560" width="70" height="40"/>

</svg>

</div>

</div>

<div class="section">

<h2>Alert Details</h2>

<div id="details">
Click a county to view alert information.
</div>

</div>

<script>

let countyAlerts={}

/* LOAD ALERTS */

async function loadAlerts(){

countyAlerts={}

let response=await fetch("https://api.weather.gov/alerts/active?area=WI")
let data=await response.json()

let warningGroups={}

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description
let areas=alert.properties.areaDesc.split(";")

areas.forEach(a=>{

let county=a.trim()

if(!countyAlerts[county]) countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
description:desc
})

})

if(event.includes("Warning")){

if(!warningGroups[event]){
warningGroups[event]=[]
}

warningGroups[event].push(...areas)

}

})

/* BUILD WARNING CARDS */

let warningsHTML=""

for(let event in warningGroups){

let counties=[...new Set(warningGroups[event])].join(" • ")

warningsHTML+=`
<div class="warningCard">
<b>${event}</b><br>
${counties}
</div>
`

}

document.getElementById("warnings").innerHTML =
warningsHTML || "No active warnings."

colorCounties()

}

/* COLOR COUNTIES */

function colorCounties(){

document.querySelectorAll(".county").forEach(c=>{

c.classList.remove("green","orange","red","flash")

let county=c.id
let alerts=countyAlerts[county]

if(!alerts) return

alerts.forEach(a=>{

if(a.event.includes("Tornado Warning")){
c.classList.add("red","flash")
}
else if(a.event.includes("Severe Thunderstorm Warning")){
c.classList.add("orange")
}
else{
c.classList.add("green")
}

})

})

}

/* CLICK COUNTY */

document.querySelectorAll(".county").forEach(c=>{

c.addEventListener("click",()=>{

let county=c.id
let alerts=countyAlerts[county]

if(!alerts){
document.getElementById("details").innerHTML="No alerts for "+county+" County."
return
}

let html="<b>"+county+" County</b><br><br>"

alerts.forEach(a=>{
html+="<b>"+a.event+"</b><br>"+a.description+"<hr>"
})

document.getElementById("details").innerHTML=html

})

})

loadAlerts()
setInterval(loadAlerts,60000)

</script>

</body>
</html>
