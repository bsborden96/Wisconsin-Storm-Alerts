<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* HEADER */

header{
background:#151c2c;
padding:40px;
position:relative;
z-index:1;
}

.headerContent{
display:flex;
align-items:center;
justify-content:center;
gap:22px;
}

.logo{
height:200px;
}

.titleText{
font-size:65px;
font-weight:bold;
}

/* 🔥 ARROW (NOW INLINE, NOT FIXED) */

.menuArrow{
display:inline-block;
background:#111827;
color:white;
font-size:42px;
padding:12px 18px;
border-radius:12px;
cursor:pointer;
margin:20px auto;
}

/* OVERLAY */

.menuOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
z-index:30000;
}

.menuOverlay.show{
display:block;
}

/* SLIDE MENU */

.menuPanel{
position:fixed;
top:0;
left:-320px;
width:300px;
height:100%;
background:#111827;
padding:30px 20px;
transition:left 0.3s ease;
z-index:30001;
}

.menuPanel.open{
left:0;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:50px;
padding:18px;
font-weight:bold;
border-bottom:1px solid #222;
}

/* TICKER */

.tickerWrap{
background:#7a0000;
overflow:hidden;
white-space:nowrap;
padding:12px 0;
}

.ticker{
display:inline-block;
font-size:22px;
position:relative;
left:100%;
animation:scrollTicker 30s linear infinite;
}

@keyframes scrollTicker{
0%{left:100%}
100%{left:-100%}
}

/* SEARCH */

.searchBox{
margin:30px auto;
max-width:600px;
}

.searchBox input{
width:100%;
padding:14px;
font-size:22px;
border-radius:8px;
border:none;
}

/* LAYOUT */

.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.locationCard{
background:#111827;
padding:36px;
border-radius:14px;
}

.riskBox{
margin-top:20px;
padding:20px;
border-radius:10px;
font-size:28px;
font-weight:bold;
}

.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
margin-top:30px;
}

.weatherCard{
background:#0f172a;
padding:28px;
border-radius:12px;
}

.weatherValue{
font-size:48px;
font-weight:bold;
}

.card{
background:#111;
padding:22px;
margin-top:16px;
border-radius:12px;
font-size:22px;
}

</style>
</head>

<body>

<!-- OVERLAY -->
<div id="menuOverlay" class="menuOverlay" onclick="closeMenu()"></div>

<!-- MENU -->
<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<header>
<div class="headerContent">
<img src="/Wisconsin-Storm-Alerts/logo.PNG" class="logo">
<span class="titleText">US Storm Alerts</span>
</div>
</header>

<div class="tickerWrap">
<span id="ticker" class="ticker">Loading severe alerts...</span>
</div>

<div class="searchBox">
<input placeholder="Search any US city">
</div>

<div class="section">
<div id="locationCard" class="locationCard">Detecting location...</div>
<div id="riskLevel" class="riskBox low">Severe Weather Risk: LOW</div>
</div>

<!-- 🔥 ARROW NOW HERE -->
<div class="menuArrow" onclick="toggleMenu()">☰ Menu</div>

<div class="section">
<h2>Current Conditions</h2>

<div class="weatherGrid">
<div class="weatherCard">Temp<div id="temp" class="weatherValue">--</div></div>
<div class="weatherCard">Humidity<div id="humidity" class="weatherValue">--</div></div>
<div class="weatherCard">Dew<div id="dew" class="weatherValue">--</div></div>
<div class="weatherCard">Wind<div id="wind" class="weatherValue">--</div></div>
</div>

</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

function toggleMenu(){
document.getElementById("menuPanel").classList.toggle("open")
document.getElementById("menuOverlay").classList.toggle("show")
}

function closeMenu(){
document.getElementById("menuPanel").classList.remove("open")
document.getElementById("menuOverlay").classList.remove("show")
}

let lat, lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
loadWeather()
loadAlerts()
})

async function loadWeather(){
let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let data=await res.json()
let c=data.current

temp.innerText=Math.round(c.temperature_2m)+"°F"
dew.innerText=Math.round(c.dewpoint_2m)+"°F"
humidity.innerText=c.relative_humidity_2m+"%"
wind.innerText=Math.round(c.wind_speed_10m)+" mph"
}

async function loadAlerts(){
let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let html=""
data.features.forEach(a=>{
html+=`<div class="card">${a.properties.event}<br>${a.properties.areaDesc}</div>`
})

alerts.innerHTML = html || "No active alerts"
}

async function loadTicker(){
let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let txt=""
data.features.slice(0,10).forEach(a=>{
txt += a.properties.event + " • "
})

ticker.innerText = txt || "No active alerts"
}

loadTicker()

</script>

</body>
</html>
