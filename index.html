<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:36px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:12px;
}

.section{
max-width:700px;
margin:auto;
padding:25px;
}

.alertBanner{
position:fixed;
top:0;
left:0;
width:100%;
padding:18px;
font-size:22px;
font-weight:bold;
display:none;
z-index:9999;
}

.tornadoBanner{background:#8b0000;}
.severeBanner{background:#b45309;}
.watchBanner{background:#92400e;}

.locationCard{
background:#111827;
padding:35px;
border-radius:12px;
margin-top:15px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;
}

.weatherCard{
background:#0f172a;
padding:18px;
border-radius:10px;
}

.searchBox{
width:65%;
padding:12px;
font-size:18px;
border-radius:6px;
border:none;
}

.suggestions{
background:#1e293b;
margin:auto;
width:65%;
border-radius:6px;
text-align:left;
}

.suggestion{
padding:10px;
cursor:pointer;
border-bottom:1px solid #334155;
}

.suggestion:hover{
background:#334155;
}

.card{
background:#111;
padding:18px;
margin-top:12px;
border-radius:10px;
}

</style>
</head>

<body>

<div id="alertBanner" class="alertBanner"></div>

<header>
US Storm Alerts
<div id="status">Loading...</div>
</header>

<div class="section">

<input id="searchBox" class="searchBox" placeholder="Search City or Town" oninput="getSuggestions()">

<div id="suggestions" class="suggestions"></div>

</div>

<div class="section">
<h2>Location</h2>
<div id="locationCard"></div>
</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="weatherCard">
Temperature
<div id="temp"></div>
</div>

<div class="weatherCard">
Dew Point
<div id="dew"></div>
</div>

<div class="weatherCard">
Humidity
<div id="humidity"></div>
</div>

<div class="weatherCard">
Wind
<div id="wind"></div>
</div>

</div>

</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts"></div>
</div>

<audio id="tornadoSound" src="https://www.soundjay.com/misc/sounds/siren-01.mp3"></audio>
<audio id="severeSound" src="https://www.soundjay.com/button/sounds/beep-07.mp3"></audio>
<audio id="watchSound" src="https://www.soundjay.com/button/sounds/beep-09.mp3"></audio>

<script>

let lat
let lon
let lastAlerts=[]

async function loadLocation(newLat,newLon){

lat=newLat
lon=newLon

let point=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let pointData=await point.json()

let city=pointData.properties.relativeLocation.properties.city
let state=pointData.properties.relativeLocation.properties.state

let countyRes=await fetch(pointData.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

document.getElementById("locationCard").innerHTML=
`<div class="locationCard">
<b>${county}</b><br>${city}, ${state}
</div>`

loadWeather()
loadAlerts()

}

async function loadWeather(){

let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)

let data=await res.json()
let c=data.current

document.getElementById("temp").innerText=Math.round(c.temperature_2m)+"°F"
document.getElementById("dew").innerText=Math.round(c.dewpoint_2m)+"°F"
document.getElementById("humidity").innerText=c.relative_humidity_2m+"%"
document.getElementById("wind").innerText=Math.round(c.wind_speed_10m)+" mph"

}

function triggerAlert(type,event){

let banner=document.getElementById("alertBanner")

banner.innerText=event
banner.style.display="block"

if(type==="tornado"){

banner.className="alertBanner tornadoBanner"
document.getElementById("tornadoSound").play()

}

if(type==="severe"){

banner.className="alertBanner severeBanner"
document.getElementById("severeSound").play()

}

if(type==="watch"){

banner.className="alertBanner watchBanner"
document.getElementById("watchSound").play()

}

setTimeout(()=>{

banner.style.display="none"

},10000)

}

async function loadAlerts(){

let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let html=""
let current=[]

data.features.forEach(alert=>{

let event=alert.properties.event
current.push(event)

let style="card"

html+=`<div class="${style}">
<b>${event}</b>
</div>`

if(!lastAlerts.includes(event)){

if(event.includes("Tornado Warning")) triggerAlert("tornado",event)
else if(event.includes("Severe Thunderstorm Warning")) triggerAlert("severe",event)
else if(event.includes("Watch")) triggerAlert("watch",event)

}

})

lastAlerts=current

if(html==="") html='<div class="card">No active alerts</div>'

document.getElementById("alerts").innerHTML=html

let time=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})
document.getElementById("status").innerText="Last Updated: "+time

}

async function getSuggestions(){

let query=document.getElementById("searchBox").value

if(query.length<2){
document.getElementById("suggestions").innerHTML=""
return
}

let geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=8`)
let geoData=await geo.json()

let html=""

geoData.results.forEach(place=>{

html+=`<div class="suggestion" onclick="selectLocation(${place.latitude},${place.longitude})">
${place.name}, ${place.admin1}
</div>`

})

document.getElementById("suggestions").innerHTML=html

}

function selectLocation(lat2,lon2){

document.getElementById("suggestions").innerHTML=""
loadLocation(lat2,lon2)

}

navigator.geolocation.getCurrentPosition(pos=>{

loadLocation(pos.coords.latitude,pos.coords.longitude)

})

setInterval(loadAlerts,60000)

</script>

</body>
</html>
