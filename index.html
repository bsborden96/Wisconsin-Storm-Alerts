<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* HEADER */
header{
background:#151c2c;
padding:10px 0;
position:relative;
z-index:1000;
}

.headerContent{
display:flex;
align-items:center;
justify-content:center;
height:70px;
}

/* LOGO */
.logo{
height:55px;
width:auto;
display:block;
filter: drop-shadow(0 0 8px rgba(0,255,150,0.4));
transition: all 0.3s ease;
}

/* Pulse animations */
@keyframes logoPulse{
0%{transform:scale(1);}
50%{transform:scale(1.12);}
100%{transform:scale(1);}
}

@keyframes logoPulseStrong{
0%{transform:scale(1);}
50%{transform:scale(1.18);}
100%{transform:scale(1);}
}

.logo.pulse{
animation:logoPulse 1.5s infinite;
}

.logo.pulseStrong{
animation:logoPulseStrong 1s infinite;
}

/* ===== EVERYTHING ELSE ORIGINAL ===== */

.tornadoPopup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
z-index:20000;
align-items:center;
justify-content:center;
}

.tornadoBox{
background:#7a0000;
padding:40px;
border-radius:14px;
max-width:520px;
animation:flashAlert 1s infinite;
}

@keyframes flashAlert{
0%{opacity:1}
50%{opacity:.6}
100%{opacity:1}
}

.tornadoTitle{
font-size:36px;
font-weight:bold;
margin-bottom:20px;
}

.tornadoText{
font-size:22px;
line-height:1.6;
}

.closeBtn{
margin-top:25px;
padding:12px 20px;
font-size:18px;
border:none;
background:black;
color:white;
border-radius:8px;
cursor:pointer;
}

.menuIcon{
position:absolute;
top:18px;
left:18px;
font-size:52px;
cursor:pointer;
z-index:20001;
}

.menuPanel{
display:none;
position:absolute;
top:95px;
left:18px;
background:#111827;
border-radius:14px;
padding:16px;
text-align:left;
z-index:20001;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:28px;
padding:16px;
font-weight:bold;
}

.tickerWrap{
background:#7a0000;
overflow:hidden;
white-space:nowrap;
padding:12px 0;
}

.ticker{
display:inline-block;
white-space:nowrap;
font-size:22px;
position:relative;
left:100%;
animation:scrollTicker 30s linear infinite;
}

@keyframes scrollTicker{
0%{left:100%}
100%{left:-100%}
}

.searchBox{
margin:30px auto;
max-width:600px;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:22px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:260px;
overflow-y:auto;
font-size:20px;
}

.suggestions div{
padding:12px;
cursor:pointer;
}

.suggestions div:hover{
background:#374151;
}

.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.locationCard{
background:#111827;
padding:36px;
border-radius:14px;
}

.countyName{
font-size:52px;
font-weight:bold;
}

.cityName{
font-size:30px;
}

.riskBox{
margin-top:20px;
padding:20px;
border-radius:10px;
font-size:28px;
font-weight:bold;
}

.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
margin-top:30px;
}

.weatherCard{
background:#0f172a;
padding:28px;
border-radius:12px;
}

.weatherValue{
font-size:48px;
font-weight:bold;
}

.card{
background:#111;
padding:22px;
margin-top:16px;
border-radius:12px;
cursor:pointer;
font-size:22px;
}

.tornado{background:#7a0000}
.severe{background:#8a4b00}
.none{background:#1f3b1f}

.alertDetails{
display:none;
margin-top:10px;
font-size:18px;
text-align:left;
}

</style>
</head>

<body>

<div id="tornadoPopup" class="tornadoPopup">
<div class="tornadoBox">
<div class="tornadoTitle">🚨 TORNADO WARNING 🚨</div>
<div class="tornadoText">Seek shelter immediately.</div>
<button class="closeBtn" onclick="closeTornado()">Dismiss</button>
</div>
</div>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<!-- ✅ FIXED HEADER -->
<header>
<div class="headerContent">
<img src="logo.PNG" id="logo" class="logo">
</div>
</header>

<!-- REST OF YOUR PAGE UNCHANGED -->

<script>

function updateLogoPulse(level){
let logo=document.getElementById("logo")
if(!logo) return
logo.classList.remove("pulse","pulseStrong")
if(level==="high") logo.classList.add("pulseStrong")
else if(level==="medium") logo.classList.add("pulse")
}

</script>

</body>
</html>
