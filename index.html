<!DOCTYPE html>
<html>

<head>

<title>Wisconsin County Alerts</title>

<style>

body{
font-family:Arial;
background:#0a0f1c;

margin:0;
}

header{
background:#151c2c;
padding:15px;
font-size:22px;
text-align:center;
}

#container{
max-width:900px;
margin:auto;
padding:20px;
}

.county{
padding:10px;
border-bottom:1px solid #333;
display:flex;
justify-content:space-between;
background:#1f3b1f;
}

.alert{
font-weight:bold;
}

.red{background:#5a0000;}
.orange{background:#7a3b00;}
.yellow{background:#666600;}
.blue{background:#003c66;}
.green{background:#1f3b1f;}

</style>

</head>

<body>

<header>
Wisconsin County Alerts
</header>

<div id="container"></div>

<script>

const container=document.getElementById("container")

counties.forEach(c=>{
let div=document.createElement("div")
div.className="county green"
div.id=c.fips
div.innerHTML=`<span>${c.name} County</span><span class="alert">🟩 No Alerts</span>`
container.appendChild(div)
})


// FETCH NWS ALERTS

fetch("https://api.weather.gov/alerts/active?area=WI")

.then(r=>r.json())

.then(data=>{

data.features.forEach(alert=>{

let event=alert.properties.event
let geocodes=alert.properties.geocode.SAME

let emoji="⚠️"
let color="yellow"

if(event.includes("Tornado")){
emoji="🌪"
color="red"
}

if(event.includes("Severe Thunderstorm")){
emoji="⛈"
color="orange"
}

if(event.includes("High Wind")){
emoji="💨"
color="yellow"
}

if(event.includes("Winter Storm")){
emoji="❄️"
color="blue"
}

geocodes.forEach(code=>{

let county=document.getElementById(code)

if(county){

county.className="county "+color

county.querySelector(".alert").innerHTML=`${emoji} ${event}`

}

})

})

})

</script>

</body>

</html>
