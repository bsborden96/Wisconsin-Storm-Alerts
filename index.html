<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:38px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:12px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:20px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.status{
font-size:22px;
margin-top:10px;
opacity:0.9;
}

.section{
max-width:650px;
margin:auto;
padding:25px;
}

.locationCard{
background:#111827;
padding:40px;
border-radius:12px;
margin-top:15px;
}

.countyName{
font-size:56px;
font-weight:bold;
}

.cityName{
font-size:32px;
margin-top:10px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:15px;
}

.weatherCard{
background:#0f172a;
padding:20px;
border-radius:10px;
}

.weatherTitle{
font-size:16px;
opacity:0.8;
}

.weatherValue{
font-size:30px;
font-weight:bold;
margin-top:5px;
}

.card{
background:#111;
padding:24px;
margin-top:18px;
border-radius:10px;
font-size:20px;
}

.tornado{background:#7a0000;}
.severe{background:#8a4b00;}
.none{background:#1f3b1f;}

.searchBox{
width:70%;
padding:12px;
font-size:18px;
border-radius:6px;
border:none;
margin-right:10px;
}

.button{
padding:12px 16px;
font-size:18px;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
}

.searchBtn{background:#2563eb;}
.locBtn{background:#16a34a;}

</style>
</head>

<body>

<header>
US Storm Alerts
<div id="status" class="status">Loading...</div>
</header>

<nav>
<a href="index.html">Home</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<input id="searchBox" class="searchBox" placeholder="Search City, Town, or County (Example: Dallas TX)">

<button class="button searchBtn" onclick="searchLocation()">Search</button>

<button class="button locBtn" onclick="detectLocation()">Use My Location</button>

</div>

<div class="section">
<h2>Location</h2>
<div id="county">Detecting your location...</div>
</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="weatherCard">
<div class="weatherTitle">Temperature</div>
<div id="temp" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Dew Point</div>
<div id="dew" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Humidity</div>
<div id="humidity" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Precipitation</div>
<div id="precip" class="weatherValue">--</div>
</div>

</div>

</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Checking alerts...</div>
</div>

<script>

let currentLat
let currentLon
let stationsURL

async function loadLocation(lat,lon){

currentLat=lat
currentLon=lon

let res=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let data=await res.json()

let city=data.properties.relativeLocation.properties.city
let state=data.properties.relativeLocation.properties.state

stationsURL=data.properties.observationStations

let countyRes=await fetch(data.properties.county)
let countyData=await countyRes.json()

let countyName=countyData.properties.name

document.getElementById("county").innerHTML=
"<div class='locationCard'><div class='countyName'>"+countyName+"</div><div class='cityName'>"+city+", "+state+"</div></div>"

loadWeather()
loadAlerts()

}

function detectLocation(){

navigator.geolocation.getCurrentPosition(position=>{

loadLocation(position.coords.latitude,position.coords.longitude)

})

}

async function searchLocation(){

let query=document.getElementById("searchBox").value

if(!query) return

let geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=1`)
let geoData=await geo.json()

if(!geoData.results) return

let lat=geoData.results[0].latitude
let lon=geoData.results[0].longitude

loadLocation(lat,lon)

}

async function loadWeather(){

let stationsRes=await fetch(stationsURL)
let stations=await stationsRes.json()

let station=stations.features[0].id

let obsRes=await fetch(station+"/observations/latest")
let obs=await obsRes.json()

let tempC=obs.properties.temperature.value
let dewC=obs.properties.dewpoint.value

let tempF=tempC?Math.round((tempC*9/5)+32):"--"
let dewF=dewC?Math.round((dewC*9/5)+32):"--"

let humidity=obs.properties.relativeHumidity.value
humidity=humidity?Math.round(humidity):"--"

let precip=obs.properties.precipitationLastHour.value
let precipIn=precip?(precip*0.03937).toFixed(2):"0.00"

document.getElementById("temp").innerText=tempF+"°F"
document.getElementById("dew").innerText=dewF+"°F"
document.getElementById("humidity").innerText=humidity+"%"
document.getElementById("precip").innerText=precipIn+" in"

}

async function loadAlerts(){

let response=await fetch(`https://api.weather.gov/alerts/active?point=${currentLat},${currentLon}`)
let data=await response.json()

let html=""

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description

let style="card"

if(event.includes("Tornado Warning")) style+=" tornado"
else if(event.includes("Severe Thunderstorm Warning")) style+=" severe"
else style+=" none"

html+=`
<div class="${style}">
<h3>${event}</h3>
<p>${desc}</p>
</div>
`

})

if(html===""){
html='<div class="card none">No active alerts for this location.</div>'
}

document.getElementById("alerts").innerHTML=html

let now=new Date()
let time=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})

document.getElementById("status").innerText="Last Updated: "+time

}

detectLocation()

setInterval(loadAlerts,60000)
setInterval(loadWeather,300000)

</script>

</body>
</html>
