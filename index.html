<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* LOGO */
.logo{
width:300px;
max-width:96vw;
margin:20px auto;
display:block;
}

/* MENU */
.menuIcon{
position:fixed;
top:15px;
left:15px;
font-size:50px;
z-index:9999;
cursor:pointer;
}

.menuPanel{
display:none;
position:fixed;
top:80px;
left:15px;
background:#111827;
padding:15px;
border-radius:10px;
z-index:9999;
}

.menuPanel a{
display:block;
padding:10px;
color:white;
text-decoration:none;
}

/* TICKER */
.tickerWrap{
background:#7a0000;
overflow:hidden;
width:100%;
}

.tickerTrack{
display:flex;
white-space:nowrap;
will-change: transform;
}

.tickerTrack span{
padding-right:100px;
font-size:18px;
}

/* SEARCH */
.searchBox{
margin:10px auto;
max-width:600px;
position:relative;
}

.searchBox input{
width:100%;
padding:12px;
font-size:18px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:220px;
overflow-y:auto;
z-index:9999;
text-align:left;
}

/* SECTIONS */
.section{
padding:20px;
max-width:1000px;
margin:auto;
}

.locationCard{
background:#111827;
padding:20px;
border-radius:10px;
}

.riskBox{
margin-top:10px;
padding:15px;
border-radius:10px;
font-size:22px;
font-weight:bold;
}

.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.weatherCard{
background:#0f172a;
padding:15px;
border-radius:10px;
}

.card{
margin-top:10px;
padding:15px;
border-radius:10px;
text-align:left;
}

</style>
</head>

<body>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<!-- 🔥 FIXED MENU LINKS -->
<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<img src="logo.PNG" class="logo">

<!-- TICKER -->
<div class="tickerWrap">
  <div class="tickerTrack" id="tickerTrack">
    <span id="tickerContent">⚠ Loading alerts...</span>
  </div>
</div>

<div class="searchBox">
<input id="searchInput" placeholder="Search US city">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="section">
<div id="locationCard" class="locationCard">Loading location...</div>
<div id="riskLevel" class="riskBox low">Severe Weather Risk: LOW</div>
</div>

<div class="section">
<h2>Current Conditions</h2>
<div class="weatherGrid">
<div class="weatherCard">Temp<div id="temp">--</div></div>
<div class="weatherCard">Humidity<div id="humidity">--</div></div>
<div class="weatherCard">Dew<div id="dew">--</div></div>
<div class="weatherCard">Wind<div id="wind">--</div></div>
</div>
</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

/* MENU */
function toggleMenu(){
let m=document.getElementById("menuPanel")
m.style.display = m.style.display==="block"?"none":"block"
}

/* 🔥 FINAL CLEAN TICKER */
async function loadTicker(){

let ticker = document.getElementById("tickerContent")
let track = document.getElementById("tickerTrack")

try{

let res = await fetch("https://api.weather.gov/alerts/active")
let data = await res.json()

let groups = {
"TORNADO EMERGENCY": new Set(),
"PDS TORNADO WARNING": new Set(),
"TORNADO WARNING": new Set(),
"TORNADO WATCH": new Set(),
"SEVERE THUNDERSTORM WARNING": new Set()
}

data.features.forEach(a=>{

let event = a.properties.event || ""
let desc = (a.properties.description || "").toLowerCase()
let area = a.properties.areaDesc || ""

area.split(";").forEach(c=>{
let county = c.trim()

if(desc.includes("tornado emergency")){
groups["TORNADO EMERGENCY"].add(county)
}
else if(desc.includes("particularly dangerous situation")){
groups["PDS TORNADO WARNING"].add(county)
}
else if(event.includes("Tornado Warning")){
groups["TORNADO WARNING"].add(county)
}
else if(event.includes("Tornado Watch")){
groups["TORNADO WATCH"].add(county)
}
else if(event.includes("Severe Thunderstorm Warning")){
groups["SEVERE THUNDERSTORM WARNING"].add(county)
}

})

})

let order = [
"TORNADO EMERGENCY",
"PDS TORNADO WARNING",
"TORNADO WARNING",
"TORNADO WATCH",
"SEVERE THUNDERSTORM WARNING"
]

let parts = []

order.forEach(type=>{

let list = Array.from(groups[type])

if(list.length > 0){
parts.push(`⚠ ${type} — ${list.join(", ")}`)
}

})

let final = parts.join("   •   ")

if(final.length < 5){
final = "No major severe weather alerts across the United States"
}

ticker.innerText = final + "   •   " + final

/* SPEED */
let pos = 0
let speed = 1   // 🔥 smooth readable

if(window.tickerAnim) cancelAnimationFrame(window.tickerAnim)

function animate(){
pos -= speed
track.style.transform = `translateX(${pos}px)`

if(Math.abs(pos) > ticker.offsetWidth/2){
pos = 0
}

window.tickerAnim = requestAnimationFrame(animate)
}

animate()

}catch{
ticker.innerText = "⚠ Unable to load alerts"
}

}

loadTicker()
setInterval(loadTicker,300000)

/* GEO */
let lat=43, lon=-88

navigator.geolocation.getCurrentPosition(p=>{
lat=p.coords.latitude
lon=p.coords.longitude
loadAll()
},()=>loadAll())

function loadAll(){
loadLocation()
loadWeather()
loadAlerts()
}

/* LOCATION */
async function loadLocation(){
try{
let p=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let d=await p.json()

let city=d.properties.relativeLocation.properties.city
let state=d.properties.relativeLocation.properties.state

let countyRes=await fetch(d.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

locationCard.innerHTML=`<b>${county} County</b><br>${city}, ${state}`

}catch{
locationCard.innerText="Location unavailable"
}
}

/* WEATHER */
async function loadWeather(){
let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let d=await r.json()

let c=d.current
temp.innerText=Math.round(c.temperature_2m)+"°F"
dew.innerText=Math.round(c.dewpoint_2m)+"°F"
humidity.innerText=c.relative_humidity_2m+"%"
wind.innerText=Math.round(c.wind_speed_10m)+" mph"
}

/* ALERTS */
async function loadAlerts(){

let r=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let d=await r.json()

let html=""
let risk="low"

d.features.slice(0,5).forEach(a=>{
let e=a.properties.event

if(e.includes("Tornado")) risk="high"
else if(e.includes("Severe")) risk="medium"

let bg=e.includes("Tornado")?"#7a0000":
e.includes("Severe")?"#8a4b00":"#1f2937"

html+=`<div class="card" style="background:${bg}">
<b>${e}</b><br>${a.properties.areaDesc}
</div>`
})

alerts.innerHTML = html || "No alerts"

let box=document.getElementById("riskLevel")

if(risk==="high"){
box.className="riskBox high"
box.innerText="Severe Weather Risk: HIGH"
}
else if(risk==="medium"){
box.className="riskBox medium"
box.innerText="Severe Weather Risk: MODERATE"
}
else{
box.className="riskBox low"
box.innerText="Severe Weather Risk: LOW"
}

}

</script>

</body>
</html>
