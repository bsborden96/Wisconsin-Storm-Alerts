<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

/* HEADER */

header{
background:#151c2c;
padding:16px;
text-align:center;
font-size:26px;
font-weight:bold;
}

/* NAV */

nav{
background:#0f1424;
text-align:center;
padding:10px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

/* SECTIONS */

.section{
max-width:1000px;
margin:auto;
padding:20px;
}

h2{
margin-top:0;
}

/* WARNING CARDS */

#warnings{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:10px;
}

.warningCard{
background:#7a0000;
padding:12px;
border-radius:6px;
}

/* COUNTY GRID */

#countyGrid{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:6px;
max-width:500px;
margin:auto;
}

.county{
padding:10px;
border-radius:6px;
text-align:center;
cursor:pointer;
font-weight:bold;
}

.gray{background:#333}
.green{background:#1f3b1f}
.orange{background:#8a4b00}
.red{background:#7a0000}

/* FLASH TORNADO */

.flash{
animation:flash 1s infinite;
}

@keyframes flash{
0%{background:#7a0000}
50%{background:#2a0000}
100%{background:#7a0000}
}

/* DETAILS */

#details{
background:#111;
padding:15px;
border-radius:6px;
margin-top:20px;
}

</style>
</head>

<body>

<header>Wisconsin Storm Alerts</header>

<nav>
<a href="index.html">Alerts</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<h2>Active Warnings</h2>

<div id="warnings">
Loading alerts...
</div>

</div>

<div class="section">

<h2>Your County</h2>

<div id="userCounty">
Detecting your location...
</div>

<div id="localAlerts">
Checking alerts...
</div>

</div>

<div class="section">

<h2>County Status</h2>

<div id="countyGrid"></div>

</div>

<div class="section">

<h2>Alert Details</h2>

<div id="details">
Click a county to see alert information.
</div>

</div>

<script>

const counties=[

"Douglas","Bayfield","","","",

"Burnett","Washburn","Sawyer","Ashland","Iron",

"Polk","Barron","Rusk","Price","Vilas",

"St Croix","Dunn","Chippewa","Taylor","Oneida",

"Pierce","Pepin","Eau Claire","Clark","Lincoln",

"Buffalo","Trempealeau","Jackson","Marathon","Langlade",

"La Crosse","Monroe","Juneau","Wood","Forest",

"Vernon","Richland","Adams","Portage","Florence",

"Crawford","Grant","Sauk","Waushara","",

"Iowa","Lafayette","Columbia","Marquette","Green Lake",

"Dane","Green","Dodge","Fond du Lac","",

"Rock","Jefferson","Washington","Ozaukee","",

"Walworth","Waukesha","Milwaukee","","",

"Racine","Kenosha","","",""

]

const grid=document.getElementById("countyGrid")

let countyAlerts={}

/* BUILD COUNTY GRID */

counties.forEach(c=>{

let div=document.createElement("div")

if(c===""){
div.style.visibility="hidden"
grid.appendChild(div)
return
}

div.className="county gray"
div.id=c
div.innerText=c

div.onclick=()=>showCounty(c)

grid.appendChild(div)

})

function showCounty(name){

let alerts=countyAlerts[name]

if(!alerts){
document.getElementById("details").innerHTML="No alerts for "+name+" County."
return
}

let html="<b>"+name+" County</b><br><br>"

alerts.forEach(a=>{
html+="<b>"+a.event+"</b><br>"+a.description+"<hr>"
})

document.getElementById("details").innerHTML=html

}

function showLocalAlerts(county){

let alerts=countyAlerts[county]

if(!alerts){
document.getElementById("localAlerts").innerHTML="No alerts."
return
}

let html=""

alerts.forEach(a=>{
html+="<b>"+a.event+"</b><br>"
})

document.getElementById("localAlerts").innerHTML=html

}

/* LOCATION DETECTION */

function detectLocation(){

if(!navigator.geolocation){
document.getElementById("userCounty").innerHTML="Location unavailable"
return
}

navigator.geolocation.getCurrentPosition(async position=>{

let lat=position.coords.latitude
let lon=position.coords.longitude

let res=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let data=await res.json()

let county=data.properties.relativeLocation.properties.city

document.getElementById("userCounty").innerHTML="<b>Your County:</b> "+county

showLocalAlerts(county)

})

}

/* LOAD ALERTS */

async function loadAlerts(){

countyAlerts={}

let response=await fetch("https://api.weather.gov/alerts/active?area=WI")

let data=await response.json()

let warningGroups={}

document.querySelectorAll(".county").forEach(c=>{
c.className="county gray"
})

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description
let areas=alert.properties.areaDesc.split(";")

areas.forEach(a=>{

let county=a.trim()

if(document.getElementById(county)){

if(!countyAlerts[county]) countyAlerts[county]=[]

countyAlerts[county].push({
event:event,
description:desc
})

let box=document.getElementById(county)

if(event.includes("Tornado Warning")){
box.className="county red flash"
}
else if(event.includes("Severe Thunderstorm Warning")){
box.className="county orange"
}
else{
box.className="county green"
}

}

})

if(event.includes("Warning")){

if(!warningGroups[event]){
warningGroups[event]=[]
}

warningGroups[event].push(...areas)

}

})

let warningsHTML=""

for(let event in warningGroups){

let countiesList=[...new Set(warningGroups[event])]
.join(" • ")

warningsHTML+=`
<div class="warningCard">
<b>${event}</b><br>
${countiesList}
</div>
`

}

document.getElementById("warnings").innerHTML=
warningsHTML || "No active warnings."

}

loadAlerts()
detectLocation()

setInterval(loadAlerts,60000)

</script>

</body>
</html>
