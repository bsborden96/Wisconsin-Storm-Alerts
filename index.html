<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* HEADER */

header{
background:#151c2c;
padding:40px;
}

.headerContent{
display:flex;
align-items:center;
justify-content:center;
gap:22px;
}

.logo{
height:200px;
}

.titleText{
font-size:65px;
font-weight:bold;
}

/* 🔥 SIDE ARROW (LOWER NOW) */

.menuArrow{
position:fixed;
left:0;
top:65%; /* 🔥 MOVED LOWER */
transform:translateY(-50%);
background:#111827;
color:white;
font-size:40px;
padding:14px 18px;
border-radius:0 12px 12px 0;
cursor:pointer;
z-index:30002;
}

/* MENU */

.menuOverlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:none;
z-index:30000;
}

.menuOverlay.show{
display:block;
}

.menuPanel{
position:fixed;
top:0;
left:-320px;
width:300px;
height:100%;
background:#111827;
padding:30px 20px;
transition:left 0.3s ease;
z-index:30001;
}

.menuPanel.open{
left:0;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:40px;
padding:18px;
font-weight:bold;
border-bottom:1px solid #222;
}

/* TICKER */

.tickerWrap{
background:#7a0000;
padding:12px;
overflow:hidden;
}

.ticker{
white-space:nowrap;
display:inline-block;
animation:scroll 25s linear infinite;
}

@keyframes scroll{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* SEARCH */

.searchBox{
margin:30px auto;
max-width:600px;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:22px;
border-radius:8px;
border:none;
}

/* LAYOUT */

.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.locationCard{
background:#111827;
padding:36px;
border-radius:14px;
}

.riskBox{
margin-top:20px;
padding:20px;
border-radius:10px;
font-size:28px;
font-weight:bold;
}

.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}

.weatherValue{
font-size:40px;
}

.card{
background:#111827;
padding:24px;
border-radius:12px;
margin-top:20px;
}

</style>
</head>

<body>

<div class="menuArrow" onclick="toggleMenu()">➤</div>

<div id="menuOverlay" class="menuOverlay" onclick="closeMenu()"></div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<header>
<div class="headerContent">
<img src="/Wisconsin-Storm-Alerts/logo.PNG" class="logo">
<span class="titleText">US Storm Alerts</span>
</div>
</header>

<div class="tickerWrap">
<span id="ticker" class="ticker">Loading alerts...</span>
</div>

<!-- ✅ SEARCH RESTORED -->
<div class="searchBox">
<input id="searchInput" placeholder="Search any US city">
</div>

<div class="section">

<div id="locationCard" class="locationCard">
Detecting location...
</div>

<div id="riskLevel" class="riskBox low">
Severe Weather Risk: LOW
</div>

</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="card">
Temp
<div id="temp" class="weatherValue">--</div>
</div>

<div class="card">
Humidity
<div id="humidity" class="weatherValue">--</div>
</div>

<div class="card">
Dew
<div id="dew" class="weatherValue">--</div>
</div>

<div class="card">
Wind
<div id="wind" class="weatherValue">--</div>
</div>

</div>

</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts" class="card">Loading alerts...</div>
</div>

<script>

/* MENU */

function toggleMenu(){
document.getElementById("menuPanel").classList.toggle("open")
document.getElementById("menuOverlay").classList.toggle("show")
}

function closeMenu(){
document.getElementById("menuPanel").classList.remove("open")
document.getElementById("menuOverlay").classList.remove("show")
}

/* LOCATION */

let lat, lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude

loadLocation()
loadWeather()
loadAlerts()
loadTicker()
})

/* LOCATION FIXED */

async function loadLocation(){
let point=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let pointData=await point.json()

let city=pointData.properties.relativeLocation.properties.city
let state=pointData.properties.relativeLocation.properties.state

let countyRes=await fetch(pointData.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

document.getElementById("locationCard").innerHTML=
`<b>${county} County</b><br>${city}, ${state}`
}

/* WEATHER */

async function loadWeather(){
let res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let data=await res.json()
let c=data.current

temp.innerText=Math.round(c.temperature_2m)+"°F"
dew.innerText=Math.round(c.dewpoint_2m)+"°F"
humidity.innerText=c.relative_humidity_2m+"%"
wind.innerText=Math.round(c.wind_speed_10m)+" mph"
}

/* ALERTS + RISK */

async function loadAlerts(){

let res=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let data=await res.json()

let html=""
let risk="low"

data.features.forEach(a=>{

let e=a.properties.event

if(e.includes("Tornado")){
risk="high"
html+=`<div class="card" style="background:#7a0000">${e}</div>`
}
else if(e.includes("Severe Thunderstorm")){
if(risk!=="high") risk="medium"
html+=`<div class="card" style="background:#8a4b00">${e}</div>`
}

})

if(html===""){
html="No active alerts"
}

alerts.innerHTML=html

let box=document.getElementById("riskLevel")

if(risk==="high"){
box.className="riskBox high"
box.innerText="Severe Weather Risk: HIGH"
}
else if(risk==="medium"){
box.className="riskBox medium"
box.innerText="Severe Weather Risk: MODERATE"
}
else{
box.className="riskBox low"
box.innerText="Severe Weather Risk: LOW"
}

}

/* TICKER FIXED */

async function loadTicker(){

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let txt=""

data.features.forEach(a=>{
let e=a.properties.event

if(e.includes("Tornado") || e.includes("Severe Thunderstorm")){
txt += "⚠ " + e + " • "
}
})

if(txt===""){
txt="No active tornado or severe thunderstorm alerts"
}

ticker.innerText=txt

}

</script>

</body>
</html>
