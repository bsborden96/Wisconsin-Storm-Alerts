<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* LOGO */
.logo{
width:300px;
max-width:96vw;
margin:20px auto;
display:block;
transition: all 0.4s ease;
filter: drop-shadow(0 0 15px rgba(0,255,150,0.6));
}

/* MENU */
.menuIcon{
position:fixed;
top:15px;
left:15px;
font-size:50px;
z-index:9999;
cursor:pointer;
}

.menuPanel{
display:none;
position:fixed;
top:80px;
left:15px;
background:#111827;
padding:15px;
border-radius:10px;
z-index:9999;
}

.menuPanel a{
display:block;
padding:10px;
color:white;
text-decoration:none;
}

/* POPUP ALERT */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
background:#b91c1c;
color:white;
padding:15px;
font-weight:bold;
z-index:99999;
display:none;
}

/* TICKER */
.tickerWrap{
background:#7a0000;
overflow:hidden;
}

.tickerTrack{
display:flex;
white-space:nowrap;
}

.tickerTrack span{
padding-right:100px;
}

/* SEARCH */
.searchBox{
margin:10px auto;
max-width:600px;
position:relative;
}

.searchBox input{
width:100%;
padding:12px;
font-size:18px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:220px;
overflow-y:auto;
z-index:9999;
text-align:left;
}

/* SECTIONS */
.section{
padding:20px;
max-width:1000px;
margin:auto;
}

.locationCard{
background:#111827;
padding:20px;
border-radius:10px;
}

.riskBox{
margin-top:10px;
padding:15px;
border-radius:10px;
font-size:22px;
font-weight:bold;
}

.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

.weatherCard{
background:#0f172a;
padding:15px;
border-radius:10px;
}

.card{
margin-top:10px;
padding:15px;
border-radius:10px;
text-align:left;
}

</style>
</head>

<body>

<div id="popup" class="popup"></div>

<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<img src="logo.PNG" class="logo" id="logo">

<div class="tickerWrap">
<div class="tickerTrack">
<span id="tickerContent">Loading alerts...</span>
</div>
</div>

<div class="searchBox">
<input id="searchInput" placeholder="Search US city">
<div id="suggestions" class="suggestions"></div>
</div>

<div class="section">
<div id="locationCard" class="locationCard">Loading location...</div>
<div id="riskLevel" class="riskBox low">Severe Weather Risk: LOW</div>
</div>

<div class="section">
<h2>Current Conditions</h2>
<div class="weatherGrid">
<div class="weatherCard">Temp<div id="temp">--</div></div>
<div class="weatherCard">Humidity<div id="humidity">--</div></div>
<div class="weatherCard">Dew<div id="dew">--</div></div>
<div class="weatherCard">Wind<div id="wind">--</div></div>
</div>
</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

/* MENU */
function toggleMenu(){
let m=document.getElementById("menuPanel")
m.style.display = m.style.display==="block"?"none":"block"
}

/* LOGO GLOW */
function updateLogoGlow(level){
let logo=document.getElementById("logo")
if(level==="high") logo.style.filter="drop-shadow(0 0 25px red)"
else if(level==="medium") logo.style.filter="drop-shadow(0 0 20px orange)"
else logo.style.filter="drop-shadow(0 0 15px rgba(0,255,150,0.6))"
}

/* POPUP */
function showPopup(text){
let p=document.getElementById("popup")
p.innerText=text
p.style.display="block"

setTimeout(()=>{p.style.display="none"},8000)
}

/* TICKER (simple stable) */
async function loadTicker(){
let t=document.getElementById("tickerContent")

let res=await fetch("https://api.weather.gov/alerts/active")
let d=await res.json()

let arr=[]

d.features.slice(0,10).forEach(a=>{
arr.push(`⚠ ${a.properties.event}`)
})

t.innerText=arr.join(" • ")
}

/* GEO */
let lat=43, lon=-88

navigator.geolocation.getCurrentPosition(p=>{
lat=p.coords.latitude
lon=p.coords.longitude
loadAll()
},()=>loadAll())

function loadAll(){
loadLocation()
loadWeather()
loadAlerts()
loadTicker()
}

/* LOCATION */
async function loadLocation(){
let p=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let d=await p.json()

let city=d.properties.relativeLocation.properties.city
let state=d.properties.relativeLocation.properties.state

let countyRes=await fetch(d.properties.county)
let countyData=await countyRes.json()

let county=countyData.properties.name

locationCard.innerHTML=`<b>${county} County</b><br>${city}, ${state}`
}

/* WEATHER */
async function loadWeather(){
let r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,dewpoint_2m,relative_humidity_2m,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph`)
let d=await r.json()

let c=d.current
temp.innerText=Math.round(c.temperature_2m)+"°F"
dew.innerText=Math.round(c.dewpoint_2m)+"°F"
humidity.innerText=c.relative_humidity_2m+"%"
wind.innerText=Math.round(c.wind_speed_10m)+" mph"
}

/* ALERTS + POPUP */
async function loadAlerts(){

let r=await fetch(`https://api.weather.gov/alerts/active?point=${lat},${lon}`)
let d=await r.json()

let html=""
let risk="low"
let triggered=false

d.features.forEach(a=>{

let e=a.properties.event
let desc=a.properties.description || ""

if(desc.toLowerCase().includes("tornado emergency")){
e="TORNADO EMERGENCY"
risk="high"
}
else if(desc.toLowerCase().includes("particularly dangerous")){
e="PDS TORNADO WARNING"
risk="high"
}
else if(e.includes("Tornado")){
risk="high"
}
else if(e.includes("Severe")){
if(risk!=="high") risk="medium"
}

/* 🔥 POPUP TRIGGER */
if(!triggered && (e.includes("Tornado") || e.includes("Severe"))){
showPopup(`⚠ ${e} affecting your area`)
triggered=true
}

html+=`
<div class="card">
<b>${e}</b><br>
${desc.replace(/\n/g,"<br>")}
</div>
`

})

alerts.innerHTML=html || "No alerts"

/* RISK BOX */
if(risk==="high"){
riskLevel.className="riskBox high"
riskLevel.innerText="Severe Weather Risk: HIGH"
}
else if(risk==="medium"){
riskLevel.className="riskBox medium"
riskLevel.innerText="Severe Weather Risk: MODERATE"
}
else{
riskLevel.className="riskBox low"
riskLevel.innerText="Severe Weather Risk: LOW"
}

updateLogoGlow(risk)

}

/* SEARCH */
let input=document.getElementById("searchInput")
let suggestions=document.getElementById("suggestions")
let debounce

input.addEventListener("input",()=>{
clearTimeout(debounce)
let q=input.value.trim()

if(q.length<2){suggestions.innerHTML="";return}

debounce=setTimeout(async()=>{
let res=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=us&limit=5`)
let data=await res.json()

suggestions.innerHTML=""

data.forEach(place=>{
let div=document.createElement("div")
div.innerText=place.display_name

div.onclick=()=>{
lat=parseFloat(place.lat)
lon=parseFloat(place.lon)
input.value=place.display_name
suggestions.innerHTML=""
loadAll()
}

suggestions.appendChild(div)
})
},300)
})

</script>

</body>
</html>
