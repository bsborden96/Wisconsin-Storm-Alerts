<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:38px;
font-weight:bold;
}

.ticker-wrap{
width:100%;
background:#7f1d1d;
overflow:hidden;
height:45px;
display:flex;
align-items:center;
}

.ticker{
white-space:nowrap;
animation:tickerScroll 60s linear infinite;
font-size:22px;
font-weight:bold;
padding-left:100%;
}

@keyframes tickerScroll{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

/* NAV */

nav{
background:#0f1424;
padding:16px;
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
position:relative;
z-index:1000;
}

nav a{
color:white;
text-decoration:none;
font-size:20px;
font-weight:bold;
padding:10px 14px;
}

nav a:hover{
color:#ffcc00;
}

.dropdown{
position:relative;
}

.dropbtn{
background:#0f1424;
color:white;
border:none;
font-size:20px;
font-weight:bold;
padding:12px 16px;
cursor:pointer;
}

.dropdown-content{
display:none;
position:absolute;
top:45px;
left:0;
background:#1f2937;
min-width:240px;
border-radius:8px;
overflow:hidden;
z-index:2000;
}

.dropdown-content a{
color:white;
padding:18px;
text-decoration:none;
display:block;
font-size:20px;
}

.dropdown-content a:hover{
background:#374151;
}

/* PAGE */

.section{
max-width:700px;
margin:auto;
padding:25px;
}

.locationCard{
background:#111827;
padding:35px;
border-radius:12px;
margin-top:15px;
}

.countyName{
font-size:56px;
font-weight:bold;
}

.cityName{
font-size:34px;
margin-top:6px;
}

.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
margin-top:20px;
}

.weatherCard{
background:#0f172a;
padding:20px;
border-radius:10px;
}

.weatherTitle{
font-size:18px;
opacity:.8;
}

.weatherValue{
font-size:42px;
font-weight:bold;
margin-top:5px;
}

.card{
background:#111;
padding:20px;
margin-top:12px;
border-radius:10px;
font-size:18px;
}

.tornado{background:#7a0000;}
.severe{background:#8a4b00;}
.none{background:#1f3b1f;}

.searchBox{
width:70%;
padding:14px;
font-size:18px;
border-radius:6px;
border:none;
}

.button{
padding:12px 16px;
font-size:18px;
border:none;
border-radius:6px;
color:white;
cursor:pointer;
margin-left:8px;
}

.locBtn{background:#16a34a;}

</style>
</head>

<body>

<header>
US Storm Alerts
</header>

<div class="ticker-wrap">
<div id="alertTicker" class="ticker">
Loading national severe alerts...
</div>
</div>

<nav>

<a href="index.html">Home</a>

<div class="dropdown">
<button class="dropbtn" onclick="toggleMenu('toolsMenu')">Storm Tools ▼</button>
<div id="toolsMenu" class="dropdown-content">
<a href="tornado.html">Tornado Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="environment.html">Storm Environment</a>
<a href="lightning.html">Lightning Tracker</a>
</div>
</div>

<div class="dropdown">
<button class="dropbtn" onclick="toggleMenu('alertsMenu')">Alerts ▼</button>
<div id="alertsMenu" class="dropdown-content">
<a href="reports.html">Storm Reports</a>
<a href="severe.html">Severe Alerts</a>
</div>
</div>

</nav>

<div class="section">

<input id="searchBox" class="searchBox" placeholder="Search City or Town">
<button class="button locBtn" onclick="detectLocation()">Use My Location</button>

</div>

<div class="section">
<h2>Location</h2>
<div id="locationCard">Detecting location...</div>
</div>

<div class="section">

<h2>Current Conditions</h2>

<div class="weatherGrid">

<div class="weatherCard">
<div class="weatherTitle">Temperature</div>
<div id="temp" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Dew Point</div>
<div id="dew" class="weatherValue">--</div>
</div>

<div class="weatherCard">
<div class="weatherTitle">Humidity</div>
<div id="humidity" class="weatherValue">--</div>
</div>

</div>

</div>

<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

function toggleMenu(menuId){

let menu=document.getElementById(menuId)

let menus=document.querySelectorAll(".dropdown-content")

menus.forEach(m=>{
if(m.id!==menuId){m.style.display="none"}
})

if(menu.style.display==="block"){
menu.style.display="none"
}else{
menu.style.display="block"
}

}

document.addEventListener("click",function(e){

if(!e.target.matches(".dropbtn")){

document.querySelectorAll(".dropdown-content")
.forEach(menu=>menu.style.display="none")

}

})

function detectLocation(){

navigator.geolocation.getCurrentPosition(pos=>{

let lat=pos.coords.latitude
let lon=pos.coords.longitude

document.getElementById("locationCard").innerHTML=
"<div class='locationCard'><div class='countyName'>Location Detected</div><div class='cityName'>Lat "+lat.toFixed(2)+" , Lon "+lon.toFixed(2)+"</div></div>"

})

}

</script>

</body>
</html>
