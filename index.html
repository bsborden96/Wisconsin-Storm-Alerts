<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* HEADER */

header{
background:#151c2c;
padding:30px;
font-size:38px;
font-weight:bold;
}

/* LAST UPDATED */

.status{
font-size:22px;
margin-top:10px;
opacity:0.9;
}

/* SECTION */

.section{
max-width:650px;
margin:auto;
padding:25px;
}

/* LOCATION CARD */

.locationCard{
background:#111827;
padding:40px;
border-radius:12px;
margin-top:15px;
}

.countyName{
font-size:56px;
font-weight:bold;
}

.cityName{
font-size:32px;
margin-top:10px;
opacity:0.9;
}

/* ALERT CARDS */

.card{
background:#111;
padding:24px;
margin-top:18px;
border-radius:10px;
font-size:20px;
}

.tornado{
background:#7a0000;
}

.severe{
background:#8a4b00;
}

.none{
background:#1f3b1f;
}

/* MOBILE OPTIMIZATION */

@media (max-width:600px){

header{
font-size:44px;
}

.status{
font-size:26px;
}

.countyName{
font-size:64px;
}

.cityName{
font-size:36px;
}

.card{
font-size:22px;
}

}

</style>
</head>

<body>

<header>

Wisconsin Storm Alerts

<div id="status" class="status">Starting system...</div>

</header>

<div class="section">

<h2>Your Location</h2>
<div id="county">Detecting your location...</div>

</div>

<div class="section">

<h2>Active Alerts</h2>
<div id="alerts">Checking alerts...</div>

</div>

<script>

let userCounty=""
let userCity=""

/* DETECT LOCATION */

async function detectLocation(){

if(!navigator.geolocation){
document.getElementById("county").innerText="Location unavailable"
return
}

navigator.geolocation.getCurrentPosition(async position=>{

let lat=position.coords.latitude
let lon=position.coords.longitude

let res=await fetch(`https://api.weather.gov/points/${lat},${lon}`)
let data=await res.json()

userCity=data.properties.relativeLocation.properties.city

let countyURL=data.properties.county

let countyRes=await fetch(countyURL)
let countyData=await countyRes.json()

userCounty=countyData.properties.name.replace(" County","")

document.getElementById("county").innerHTML=
"<div class='locationCard'><div class='countyName'>"+userCounty+" County</div><div class='cityName'>"+userCity+"</div></div>"

loadAlerts()

})

}

/* LOAD ALERTS */

async function loadAlerts(){

let response=await fetch("https://api.weather.gov/alerts/active?area=WI")
let data=await response.json()

let html=""

data.features.forEach(alert=>{

let event=alert.properties.event
let desc=alert.properties.description
let areas=alert.properties.areaDesc

if(areas.includes(userCounty)){

let style="card"

if(event.includes("Tornado Warning")){
style+=" tornado"
}
else if(event.includes("Severe Thunderstorm Warning")){
style+=" severe"
}
else{
style+=" none"
}

html+=`
<div class="${style}">
<h3>${event}</h3>
<p>${desc}</p>
</div>
`

}

})

if(html===""){
html='<div class="card none">No active alerts for your county.</div>'
}

document.getElementById("alerts").innerHTML=html

updateTime()

}

/* UPDATE TIME */

function updateTime(){

let now=new Date()

let time=now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})

document.getElementById("status").innerText="Last Updated: "+time

}

detectLocation()

setInterval(loadAlerts,60000)

</script>

</body>
</html>
