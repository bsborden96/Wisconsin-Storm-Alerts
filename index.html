<!DOCTYPE html>
<html>
<head>

<title>Wisconsin Storm Radar</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

#ticker{
background:#111;
color:#ffcc00;
padding:8px;
font-weight:bold;
}

#navbar{
background:#151c2c;
padding:10px;
display:flex;
gap:20px;
}

#navbar a{
color:white;
text-decoration:none;
font-weight:bold;
}

#controls{
padding:10px;
text-align:center;
}

button{
padding:10px;
margin:5px;
background:#2c3e50;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

#map{
height:80vh;
}
</style>

</head>

<body>

<div id="ticker">Wisconsin Storm Radar</div>

<div id="navbar">
<a href="#">Home</a>
<a href="#">Radar</a>
<a href="#">Alerts</a>
</div>

<div id="controls">
<button id="reflectivityBtn">Reflectivity</button>
<button id="reportsBtn">Storm Reports</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// CREATE MAP
var map = L.map('map').setView([44.5,-89.5],7)

// BASE MAP
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map)

// RADAR LAYER
var radarLayer = null

function loadRadar(){

if(radarLayer){
map.removeLayer(radarLayer)
}

radarLayer = L.tileLayer(
'https://tilecache.rainviewer.com/v2/radar/nowcast/256/{z}/{x}/{y}/2/1_1.png',
{opacity:0.7}
)

radarLayer.addTo(map)

}

document.getElementById("reflectivityBtn").onclick = loadRadar

// LOAD RADAR ON START
loadRadar()

// STORM REPORTS
var reportsLayer = null

document.getElementById("reportsBtn").onclick = function(){

if(reportsLayer){
map.removeLayer(reportsLayer)
reportsLayer = null
return
}

fetch("https://mesonet.agron.iastate.edu/geojson/lsr.php?sts=1")
.then(r=>r.json())
.then(data=>{

reportsLayer = L.geoJSON(data,{
pointToLayer:function(feature,latlng){
return L.circleMarker(latlng,{
radius:6,
color:"white",
fillColor:"cyan",
fillOpacity:0.9
})
}
}).addTo(map)

})

}

</script>

</body>
</html>
