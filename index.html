<!DOCTYPE html>
<html>
<head>
<title>US Storm Alerts</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
    
<style>

/* BODY */
body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

/* LOGO */
.logo{
width:300px;
max-width:96vw;
height:auto;
display:block;
margin:20px auto 10px auto;
}

/* MENU */
.menuIcon{
position:fixed;
top:20px;
left:15px;
font-size:70px;
cursor:pointer;
z-index:999999;
}

.menuPanel{
display:none;
position:fixed;
top:90px;
left:15px;
background:#111827;
border-radius:14px;
padding:20px;
z-index:999999;
min-width:220px;
}

.menuPanel a{
display:block;
color:white;
text-decoration:none;
font-size:26px;
padding:14px;
font-weight:bold;
}

/* 🔥 UNIFIED WIDTH (FIXES YOUR UI ISSUE) */
.container{
max-width:600px;
margin:auto;
width:92%;
}

/* TICKER */
.tickerWrap{
background:#7a0000;
overflow:hidden;
white-space:nowrap;
padding:12px 0;
margin-top:10px;
}

.ticker{
display:inline-block;
white-space:nowrap;
font-size:20px;
animation:scroll 80s linear infinite; /* 🔥 SMOOTH */
}

@keyframes scroll{
0%{transform:translateX(100%)}
100%{transform:translateX(-100%)}
}

/* SEARCH */
.searchBox{
margin:20px auto;
position:relative;
}

.searchBox input{
width:100%;
padding:14px;
font-size:22px;
border-radius:8px;
border:none;
}

.suggestions{
position:absolute;
background:#1f2937;
width:100%;
border-radius:8px;
max-height:260px;
overflow-y:auto;
font-size:20px;
z-index:9999;
}

/* LAYOUT */
.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.locationCard{
background:#111827;
padding:36px;
border-radius:14px;
}

/* RISK */
.riskBox{
margin-top:20px;
padding:20px;
border-radius:10px;
font-size:28px;
font-weight:bold;
}

.low{background:#1f3b1f}
.medium{background:#8a4b00}
.high{background:#7a0000}

/* WEATHER */
.weatherGrid{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
margin-top:30px;
}

.weatherCard{
background:#0f172a;
padding:28px;
border-radius:12px;
}

.weatherValue{
font-size:48px;
font-weight:bold;
}

/* ALERTS */
.card{
background:#111;
padding:22px;
margin-top:16px;
border-radius:12px;
cursor:pointer;
font-size:22px;
}

</style>
</head>

<body>

<!-- MENU -->
<div class="menuIcon" onclick="toggleMenu()">☰</div>

<div id="menuPanel" class="menuPanel">
<a href="index.html">Home</a>
<a href="tracking.html">Storm Tracker</a>
<a href="winter.html">Winter Center</a>
</div>

<!-- LOGO -->
<img src="logo.PNG" class="logo">

<!-- 🔥 WRAPPED FOR SAME WIDTH -->
<div class="container">

<!-- TICKER -->
<div class="tickerWrap">
<div id="ticker" class="ticker">⚠ Loading U.S. weather alerts…</div>
</div>

<!-- SEARCH -->
<div class="searchBox">
<input id="searchInput" placeholder="Search any US city">
<div id="suggestions" class="suggestions"></div>
</div>

</div>

<!-- LOCATION -->
<div class="section">
<div id="locationCard" class="locationCard">Detecting location...</div>
<div id="riskLevel" class="riskBox low">Severe Weather Risk: LOW</div>
</div>

<!-- WEATHER -->
<div class="section">
<h2>Current Conditions</h2>
<div class="weatherGrid">
<div class="weatherCard">Temp<div id="temp" class="weatherValue">--</div></div>
<div class="weatherCard">Humidity<div id="humidity" class="weatherValue">--</div></div>
<div class="weatherCard">Dew<div id="dew" class="weatherValue">--</div></div>
<div class="weatherCard">Wind<div id="wind" class="weatherValue">--</div></div>
</div>
</div>

<!-- ALERTS -->
<div class="section">
<h2>Active Alerts</h2>
<div id="alerts">Loading alerts...</div>
</div>

<script>

/* MENU */
function toggleMenu(){
let panel=document.getElementById("menuPanel")
panel.style.display=(panel.style.display==="block")?"none":"block"
}

/* 🔥 INSTANT LOAD */
loadTicker()

/* GEO */
let lat, lon

navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude
lon=pos.coords.longitude
refreshAll()
})

function refreshAll(){
loadLocation()
loadWeather()
loadAlerts()
}

/* 🔥 SMART SORT + CACHE */
async function loadTicker(){

let tickerEl = document.getElementById("ticker")

/* 🔥 INSTANT CACHE LOAD */
let cached = localStorage.getItem("tickerCache")
if(cached){
tickerEl.innerText = cached
}

try{

let res=await fetch("https://api.weather.gov/alerts/active",{
headers:{"User-Agent":"StormApp"}
})

let data=await res.json()

let alerts = data.features.map(a=>{
let e=a.properties.event || ""
let desc=(a.properties.description || "").toLowerCase()
let area=a.properties.areaDesc || "Unknown"

/* 🔥 PRIORITY SCORE */
let score=0

if(desc.includes("particularly dangerous situation")) score=5
else if(e.includes("Tornado Warning")) score=4
else if(e.includes("Tornado Watch")) score=3
else if(e.includes("Severe Thunderstorm Warning")) score=2
else score=1

return {
text:`⚠ ${e} — ${area}`,
score
}
})

/* 🔥 SORT BY SEVERITY */
alerts.sort((a,b)=>b.score-a.score)

/* 🔥 LIMIT */
let topAlerts = alerts.slice(0,8).map(a=>a.text)

let finalText = topAlerts.length
? topAlerts.join(" • ")
: "No major alerts across the United States"

tickerEl.innerText = finalText

localStorage.setItem("tickerCache", finalText)

}catch(err){
tickerEl.innerText="Error loading alerts"
}

}

/* AUTO REFRESH */
setInterval(loadTicker, 60000)

</script>

</body>
</html>
