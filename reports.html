<!DOCTYPE html>
<html>
<head>
<title>Local Storm Reports</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:38px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:12px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:20px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.section{
max-width:700px;
margin:auto;
padding:25px;
}

.reportCard{
background:#0f172a;
padding:20px;
margin-top:15px;
border-radius:10px;
font-size:20px;
}

.distance{
opacity:0.7;
margin-top:4px;
}

</style>

</head>

<body>

<header>
Storm Reports
</header>

<nav>
<a href="index.html">Home</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<h2>Recent Local Storm Reports</h2>
<div id="reports">Finding nearby reports...</div>

</div>

<script>

let userLat
let userLon

/* DISTANCE FUNCTION */

function distance(lat1,lon1,lat2,lon2){

let R=6371
let dLat=(lat2-lat1)*Math.PI/180
let dLon=(lon2-lon1)*Math.PI/180

let a=
Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(lat1*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLon/2)*Math.sin(dLon/2)

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

let km=R*c

return km*0.621371

}

/* LOAD REPORTS */

async function loadReports(){

try{

let response=await fetch("https://www.spc.noaa.gov/climo/reports/today_wind.csv")

let text=await response.text()

let rows=text.split("\n")

let html=""

rows.forEach(row=>{

let cols=row.split(",")

let lat=parseFloat(cols[7])
let lon=parseFloat(cols[8])
let location=cols[5]
let time=cols[0]

if(!lat || !lon) return

let dist=distance(userLat,userLon,lat,lon)

if(dist<150){

html+=`
<div class="reportCard">
💨 Wind Report<br>
${location}<br>
<div class="distance">${Math.round(dist)} miles away</div>
${time}
</div>
`

}

})

if(html===""){
html="No nearby storm reports."
}

document.getElementById("reports").innerHTML=html

}catch{

document.getElementById("reports").innerHTML="Unable to load storm reports."

}

}

/* GET LOCATION */

navigator.geolocation.getCurrentPosition(position=>{

userLat=position.coords.latitude
userLon=position.coords.longitude

loadReports()

})

</script>

</body>
</html>
