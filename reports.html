<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Reports</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

header{
background:#151c2c;
padding:15px;
text-align:center;
font-size:26px;
font-weight:bold;
}

nav{
background:#0f1424;
text-align:center;
padding:10px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.panel{
background:#111;
margin:20px;
padding:20px;
border-radius:8px;
}

.report{
padding:10px;
border-bottom:1px solid #333;
}

.time{
color:#aaa;
font-size:12px;
}

.type{
font-weight:bold;
}

</style>

</head>

<body>

<header>Wisconsin Storm Reports</header>

<nav>
<a href="index.html">Alerts</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="panel">

<h2>Recent Storm Reports</h2>

<div id="reports">
Loading storm reports...
</div>

</div>

<script>

async function loadReports(){

try{

let response = await fetch(
"https://mesonet.agron.iastate.edu/cgi-bin/request/gis/lsr.py?state=WI&fmt=geojson&hours=12"
)

let data = await response.json()

let reportsHTML=""

data.features.slice(0,20).forEach(report=>{

let type=report.properties.typetext
let city=report.properties.city
let county=report.properties.county
let magnitude=report.properties.magnitude||""
let time=new Date(report.properties.valid).toLocaleString()

reportsHTML+=`
<div class="report">
<div class="type">${type}</div>
${city}, ${county} County<br>
${magnitude}<br>
<div class="time">${time}</div>
</div>
`

})

if(reportsHTML===""){
reportsHTML="No recent storm reports."
}

document.getElementById("reports").innerHTML=reportsHTML

}catch{

document.getElementById("reports").innerHTML=
"Unable to load storm reports."

}

}

loadReports()

setInterval(loadReports,60000)

</script>

</body>
</html>
