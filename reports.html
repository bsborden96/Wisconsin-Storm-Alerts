<!DOCTYPE html>
<html>
<head>
<title>Wisconsin Storm Reports</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
}

header{
background:#151c2c;
padding:15px;
text-align:center;
font-size:26px;
font-weight:bold;
}

nav{
background:#0f1424;
text-align:center;
padding:10px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.panel{
background:#111;
margin:20px;
padding:20px;
border-radius:8px;
}

.report{
padding:10px;
border-bottom:1px solid #333;
}

.type{
font-weight:bold;
}

.time{
font-size:12px;
color:#aaa;
}

</style>

</head>

<body>

<header>Wisconsin Storm Reports</header>

<nav>
<a href="index.html">Alerts</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="panel">

<h2>Recent Storm Reports</h2>

<div id="reports">
Loading storm reports...
</div>

</div>

<script>

async function loadReports(){

try{

let tornadoData = await fetch("https://www.spc.noaa.gov/climo/reports/today_torn.csv").then(r=>r.text())
let hailData = await fetch("https://www.spc.noaa.gov/climo/reports/today_hail.csv").then(r=>r.text())
let windData = await fetch("https://www.spc.noaa.gov/climo/reports/today_wind.csv").then(r=>r.text())

let lines = tornadoData.split("\n")
.concat(hailData.split("\n"))
.concat(windData.split("\n"))

let html=""

lines.slice(1,40).forEach(line=>{

let parts=line.split(",")

let time=parts[0]
let city=parts[1]
let state=parts[2]
let type=parts[3]

if(state==="WI"){

html+=`
<div class="report">
<div class="type">${type}</div>
${city}, WI
<div class="time">${time}</div>
</div>
`

}

})

if(html===""){
html="No recent storm reports in Wisconsin."
}

document.getElementById("reports").innerHTML=html

}catch{

document.getElementById("reports").innerHTML=
"Storm report feed unavailable."

}

}

loadReports()

setInterval(loadReports,300000)

</script>

</body>
</html>
