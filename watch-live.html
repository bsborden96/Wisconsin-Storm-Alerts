<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Watch Live — StormVector</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#050a14">

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<link
  rel="preconnect"
  href="https://fonts.googleapis.com"
>

<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="styles.css"
>

</head>

<body class="watch-live-page">

<!-- ═══════════════════════════════════════════
     ANIMATED WEATHER BACKGROUND
════════════════════════════════════════════ -->
<canvas
  id="bgCanvas"
  aria-hidden="true">
</canvas>


<!-- Screen-reader announcements -->
<div
  id="ariaLive"
  class="sr-only"
  aria-live="assertive"
  aria-atomic="true">
</div>


<!-- ═══════════════════════════════════════════
     BREAKING WEATHER BANNER
════════════════════════════════════════════ -->
<div
  id="liveBreakingBanner"
  class="live-breaking-banner"
  role="alert"
  hidden>

  ⚠ STORMVECTOR BREAKING WEATHER ⚠

</div>


<!-- ═══════════════════════════════════════════
     HEADER
════════════════════════════════════════════ -->
<div
  id="headerBar"
  aria-label="Navigation header">

  <button
    class="menu-btn"
    id="menuBtn"
    onclick="toggleMenu()"
    aria-expanded="false"
    aria-controls="menuPanel"
    aria-label="Open navigation menu">

    ☰

  </button>

  <div id="headerTitle">
    WATCH LIVE
  </div>

</div>


<!-- ═══════════════════════════════════════════
     NAVIGATION
════════════════════════════════════════════ -->
<nav
  id="menuPanel"
  class="menu-panel"
  role="menu"
  aria-label="Main navigation">

  <a
    href="./index.html"
    role="menuitem">

    <span class="menu-icon-char">
      🏠
    </span>

    Home

  </a>

  <a
    href="./outlooks.html"
    role="menuitem">

    <span class="menu-icon-char">
      🧭
    </span>

    Outlooks

  </a>

  <a
    href="./watch-live.html"
    role="menuitem">

    <span class="menu-icon-char">
      📺
    </span>

    Watch Live

  </a>

</nav>


<!-- ═══════════════════════════════════════════
     MAIN CONTENT
════════════════════════════════════════════ -->
<main id="mainContent">


  <!-- LOCATION -->
  <section
    class="section"
    style="padding-top:4px">

    <div
      id="liveLocationCard"
      class="location-card"
      aria-live="polite">

      Locating…

    </div>

  </section>



  <!-- ═══════════════════════════════════════
       LIVE BROADCAST
  ════════════════════════════════════════ -->
  <section class="section">

    <div
      class="live-stage"
      id="liveStage">


      <!-- LIVE STATUS -->
      <div
        class="live-badge"
        id="liveBadge">

        <span class="live-dot"></span>

        STANDBY

      </div>



      <!-- ═══════════════════════════════════
           VECTOR — AI METEOROLOGIST
      ════════════════════════════════════ -->
      <div
        class="live-avatar"
        id="liveAvatar"
        role="img"
        aria-label="Vector, the StormVector AI meteorologist">

        <!-- orbit / halo -->
        <div
          class="live-avatar-ring"
          aria-hidden="true">
        </div>


        <!--
          Vector's robot body is created from this
          element using the Watch Live CSS.

          JavaScript adds "speaking" to #liveAvatar
          while Vector is talking.
        -->
        <div
          class="live-avatar-core"
          aria-hidden="true">

          V

        </div>

      </div>



      <!-- VECTOR NAME -->
      <div class="live-name">

        VECTOR

        <span class="live-name-sub">
          AI METEOROLOGIST
        </span>

      </div>



      <!-- ═══════════════════════════════════
           BROADCAST STATUS
      ════════════════════════════════════ -->
      <div
        class="live-crew-row"
        aria-label="Broadcast system status">

        <div class="live-crew-card">

          <span class="live-crew-label">
            Producer
          </span>

          Builds the rundown from live weather data

        </div>


        <div class="live-crew-card">

          <span class="live-crew-label">
            Broadcaster
          </span>

          Vector adapts each update as conditions change

        </div>

      </div>



      <!-- ═══════════════════════════════════
           CAPTIONS
      ════════════════════════════════════ -->
      <div
        class="live-caption-box"
        id="liveCaptionBox"
        aria-live="polite">

        <span id="liveCaptionText">

          Preparing your local broadcast…

        </span>

      </div>



      <!-- ═══════════════════════════════════
           CURRENT CONDITIONS
      ════════════════════════════════════ -->
      <div
        class="live-conditions-row"
        id="liveConditionsRow"
        aria-label="Current weather conditions">
      </div>



      <!-- ═══════════════════════════════════
           CONTROLS
      ════════════════════════════════════ -->
      <div
        class="live-controls"
        id="liveControls">


        <button
          class="live
