<!DOCTYPE html>
<html>
<head>
<title>SPC Severe Weather Outlooks</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#151c2c;
padding:30px;
font-size:38px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:14px;
}

nav a{
color:white;
text-decoration:none;
margin:0 15px;
font-size:22px;
font-weight:bold;
}

nav a:hover{
color:#ffcc00;
}

.section{
max-width:1000px;
margin:auto;
padding:30px;
}

.card{
background:#111827;
border-radius:12px;
padding:20px;
margin-top:25px;
}

.map{
width:100%;
max-width:900px;
border-radius:10px;
margin-top:10px;
}

</style>
</head>

<body>

<header>
SPC Severe Weather Outlooks
</header>

<nav>
<a href="index.html">Home</a>
<a href="spc.html">SPC Outlooks</a>
<a href="lightning.html">Lightning Tracker</a>
<a href="reports.html">Storm Reports</a>
</nav>

<div class="section">

<div class="card">
<h2>Day 1 Severe Outlook</h2>
<img id="day1" class="map">
</div>

<div class="card">
<h2>Day 2 Severe Outlook</h2>
<img id="day2" class="map">
</div>

<div class="card">
<h2>Day 3 Severe Outlook</h2>
<img id="day3" class="map">
</div>

</div>

<script>

function loadSPC(){

let time=new Date().getTime()

document.getElementById("day1").src="https://www.spc.noaa.gov/products/outlook/day1otlk.gif?"+time
document.getElementById("day2").src="https://www.spc.noaa.gov/products/outlook/day2otlk.gif?"+time
document.getElementById("day3").src="https://www.spc.noaa.gov/products/outlook/day3otlk.gif?"+time

}

loadSPC()

/* refresh maps every 10 minutes */

setInterval(loadSPC,600000)

</script>

</body>
</html>
