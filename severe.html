<!DOCTYPE html>
<html>
<head>
<title>Severe Weather Alerts</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0a0f1c;
color:white;
text-align:center;
}

header{
background:#7a0000;
padding:30px;
font-size:34px;
font-weight:bold;
}

nav{
background:#0f1424;
padding:16px;
display:flex;
justify-content:center;
gap:30px;
flex-wrap:wrap;
}

nav a{
color:white;
text-decoration:none;
font-size:20px;
font-weight:bold;
}

.dropdown{position:relative;}

.dropbtn{
background:#0f1424;
color:white;
border:none;
font-size:20px;
padding:12px 16px;
cursor:pointer;
}

.dropdown-content{
display:none;
position:absolute;
background:#1f2937;
min-width:230px;
border-radius:8px;
z-index:1000;
}

.dropdown-content a{
color:white;
padding:18px;
display:block;
text-decoration:none;
}

.dropdown-content a:hover{
background:#374151;
}

.section{
max-width:900px;
margin:auto;
padding:30px;
}

.alert{
background:#111827;
padding:20px;
border-radius:10px;
margin-top:15px;
text-align:left;
}

.tornado{background:#7a0000;}
.severe{background:#8a4b00;}

</style>
</head>

<body>

<header>Severe Weather Alerts</header>

<nav>

<a href="index.html">Home</a>

<div class="dropdown">
<button class="dropbtn" onclick="toggleMenu('toolsMenu')">Storm Tools ▼</button>
<div id="toolsMenu" class="dropdown-content">
<a href="tornado.html">Tornado Tracker</a>
<a href="tracking.html">Storm Tracker</a>
<a href="environment.html">Storm Environment</a>
<a href="lightning.html">Lightning Tracker</a>
</div>
</div>

<div class="dropdown">
<button class="dropbtn" onclick="toggleMenu('alertsMenu')">Alerts ▼</button>
<div id="alertsMenu" class="dropdown-content">
<a href="reports.html">Storm Reports</a>
<a href="severe.html">Severe Alerts</a>
</div>
</div>

</nav>

<div class="section">

<h2>Active Severe Weather Alerts</h2>

<div id="alertBox">Loading alerts...</div>

</div>

<script>

function toggleMenu(menuId){

let menu=document.getElementById(menuId)
let menus=document.querySelectorAll(".dropdown-content")

menus.forEach(m=>{
if(m.id!==menuId){m.style.display="none"}
})

menu.style.display=menu.style.display==="block"?"none":"block"

}

async function loadAlerts(){

try{

let res=await fetch("https://api.weather.gov/alerts/active")
let data=await res.json()

let html=""

data.features.forEach(alert=>{

let event=alert.properties.event
let area=alert.properties.areaDesc

if(
event==="Tornado Warning" ||
event==="Tornado Watch" ||
event==="Severe Thunderstorm Warning" ||
event==="Severe Thunderstorm Watch"
){

let style="alert severe"

if(event.includes("Tornado")) style="alert tornado"

html+=`
<div class="${style}">
<b>${event}</b><br><br>
Area: ${area}
</div>
`

}

})

if(html==="") html="No severe alerts currently active."

document.getElementById("alertBox").innerHTML=html

}catch{

document.getElementById("alertBox").innerHTML="Unable to load alerts."

}

}

loadAlerts()

setInterval(loadAlerts,60000)

</script>

</body>
</html>
